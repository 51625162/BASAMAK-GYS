<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deneme Sınavı — Basamak GYS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10243E; --teal:#0E9E97; --teal-dark:#0B7F79; --amber:#F5A623;
    --coral:#FF6B5D; --violet:#8B6BF2;
    --green:#22C55E; --green-bg:#E9FBF0; --red:#EF4444; --red-bg:#FEECEC;
    --cloud:#F3F7F9; --white:#FFFFFF; --mist:#E1EAEE; --slate:#5B7186;
    --radius-lg:22px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cloud);color:var(--ink);font-family:'Inter',system-ui,-apple-system,sans-serif;}
  h1,h2,h3{font-family:'Sora',system-ui,-apple-system,sans-serif;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 6vw;background:var(--white);border-bottom:1px solid var(--mist);position:sticky;top:0;z-index:10;}
  .crumb{display:flex;align-items:center;gap:10px;font-size:0.86rem;color:var(--slate);font-weight:600;flex-wrap:wrap;}
  .crumb .cur{color:var(--ink);}
  .crumb .sep{opacity:0.5;}

  .wrap{max-width:760px;margin:0 auto;padding:28px 6vw 90px;}

  .list-card{background:var(--white);border:1px solid var(--mist);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:14px;}
  .list-card .icon{width:48px;height:48px;border-radius:12px;background:var(--cloud);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;}
  .list-card .info{flex-grow:1;}
  .list-card h3{margin:0;font-size:1rem;}
  .list-card p{margin:2px 0 0;color:var(--slate);font-size:0.82rem;}
  .list-card .go{padding:10px 18px;border-radius:100px;background:var(--teal);color:white;font-weight:700;font-size:0.85rem;}

  .empty-card{background:var(--white);border:1.5px dashed var(--mist);border-radius:var(--radius-lg);padding:30px;text-align:center;color:var(--slate);}
  .empty-card a{color:var(--teal-dark);font-weight:700;}

  .q-progress{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .timer-row{
    display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--ink);color:white;padding:10px;border-radius:14px;margin-bottom:14px;
    font-weight:700;font-size:1.1rem;
  }
  .timer-row.warn{background:var(--coral);}
  .q-bar{flex-grow:1;height:6px;background:var(--mist);border-radius:10px;overflow:hidden;}
  .q-bar-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--amber));border-radius:10px;transition:width .3s ease;}
  .q-progress-label{font-family:'IBM Plex Mono';font-size:0.78rem;color:var(--slate);white-space:nowrap;}

  .q-card{background:var(--white);border:1px solid var(--mist);border-radius:var(--radius-lg);padding:26px;}
  .q-img{max-width:100%;border-radius:14px;margin-bottom:16px;}
  .q-text{font-size:1.08rem;font-weight:600;line-height:1.55;margin-bottom:20px;white-space:pre-line;}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;border:1.5px solid var(--mist);border-radius:14px;background:var(--white);font-size:0.96rem;font-weight:500;transition:all .15s ease;}
  .opt:hover:not(.disabled){border-color:var(--teal);background:rgba(14,158,151,0.04);}
  .opt-letter{width:28px;height:28px;border-radius:8px;background:var(--cloud);color:var(--slate);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;flex-shrink:0;}
  .opt.correct{background:var(--green-bg);border-color:var(--green);}
  .opt.correct .opt-letter{background:var(--green);color:white;}
  .opt.wrong{background:var(--red-bg);border-color:var(--red);}
  .opt.wrong .opt-letter{background:var(--red);color:white;}
  .opt.disabled{cursor:default;}
  .opt.dim{opacity:0.55;}

  .solution-toggle{margin-top:16px;display:none;align-items:center;gap:8px;font-weight:700;font-size:0.88rem;color:var(--violet);}
  .solution-toggle.show{display:inline-flex;}
  .solution-box{display:none;margin-top:12px;padding:16px 18px;border-radius:14px;background:rgba(139,107,242,0.06);border:1px solid rgba(139,107,242,0.25);font-size:0.9rem;line-height:1.6;}
  .solution-box.show{display:block;}

  .nav-row{display:flex;justify-content:flex-end;margin-top:20px;}
  .next-btn{padding:12px 24px;border-radius:100px;background:var(--ink);color:white;font-weight:700;font-size:0.92rem;display:none;align-items:center;gap:8px;}
  .next-btn.show{display:inline-flex;}

  .result-card{background:var(--white);border:1px solid var(--mist);border-radius:var(--radius-lg);padding:34px;text-align:center;}
  .result-card .big-score{font-family:'Sora';font-weight:800;font-size:2.6rem;margin:6px 0;}
  .result-actions{display:flex;gap:10px;margin-top:20px;justify-content:center;flex-wrap:wrap;}
  .result-btn{padding:12px 22px;border-radius:100px;font-weight:700;font-size:0.9rem;}
  .result-btn.primary{background:linear-gradient(135deg,var(--teal),var(--teal-dark));color:white;}
  .result-btn.secondary{background:var(--cloud);color:var(--ink);}

  .hidden{display:none !important;}
  .setup-group{margin-bottom:20px;}
  .setup-group h4{font-size:0.82rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--slate);margin:0 0 10px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{padding:9px 16px;border-radius:100px;border:1.5px solid var(--mist);font-size:0.85rem;font-weight:600;color:var(--ink);background:var(--white);}
  .chip.active{background:var(--teal);border-color:var(--teal);color:white;}
  .start-btn{width:100%;margin-top:8px;padding:14px;border-radius:100px;background:linear-gradient(135deg,var(--teal),var(--teal-dark));color:white;font-weight:700;font-size:0.95rem;text-align:center;border:none;cursor:pointer;}
  .topic-check-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1.5px solid var(--mist);border-radius:12px;cursor:pointer;}
  .topic-check-row input{width:18px;height:18px;}
  .result-msg{display:none;margin-top:12px;padding:12px 14px;border-radius:12px;font-size:0.85rem;}
  .result-msg.ok{display:block;background:rgba(34,197,94,0.1);color:#16803C;}
  .result-msg.err{display:block;background:rgba(239,68,68,0.1);color:#C0392B;}
  .result-msg.warn{display:block;background:rgba(245,166,35,0.12);color:#B0740F;}
</style>
</head>
<body>

<div class="topbar">
  <div class="crumb">
    <a href="index.html">Basamak GYS</a><span class="sep">/</span>
    <a href="saymanlik.html" id="crumbModul">Saymanlık</a><span class="sep">/</span>
    <span class="cur">Deneme Sınavı</span>
  </div>
</div>

<div class="wrap">

  <div id="listScreen">
    <h1 style="font-size:1.4rem;">Deneme Sınavları</h1>
    <p style="color:var(--slate);margin-bottom:20px;">Eklediğin denemeler burada listelenir.</p>

    <div class="q-card" style="margin-bottom:24px;">
      <div style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;" id="autoCreateToggle">
        <div>
          <h3 style="margin:0 0 4px;font-size:1.05rem;">✨ Otomatik Deneme Oluştur</h3>
          <p style="margin:0;color:var(--slate);font-size:0.85rem;">Kendi soru bankandan karışık, süreli bir deneme oluştur.</p>
        </div>
        <span id="autoCreateArrow" style="font-size:1.2rem;color:var(--slate);">▾</span>
      </div>

      <div id="autoCreatePanel" style="display:none;margin-top:20px;">
        <div class="setup-group">
          <h4>Soru Sayısı</h4>
          <div class="chip-row" id="autoCountChips">
            <button class="chip active" data-val="25">25 Soru</button>
            <button class="chip" data-val="50">50 Soru</button>
            <button class="chip" data-val="100">100 Soru</button>
          </div>
        </div>
        <div class="setup-group">
          <h4>Zorluk</h4>
          <div class="chip-row" id="autoDiffChips">
            <button class="chip active" data-val="all">Karışık (Kolay+Orta+Zor)</button>
            <button class="chip" data-val="1">🟢 Sadece Kolay</button>
            <button class="chip" data-val="2">🟡 Sadece Orta</button>
            <button class="chip" data-val="3">🔴 Sadece Zor</button>
          </div>
        </div>
        <div class="setup-group">
          <h4>Konular</h4>
          <div id="autoTopicChecks" style="display:flex;flex-direction:column;gap:8px;"></div>
        </div>
        <button class="start-btn" id="autoCreateBtn">Deneme Oluştur ve Başla</button>
        <div class="result-msg" id="autoCreateResult"></div>
      </div>
    </div>

    <div id="denemeListArea" style="max-height:200px;overflow-y:auto;padding-right:4px;"></div>
  </div>


  <div id="quizScreen" class="hidden">
    <div class="timer-row" id="timerRow">
      <span id="timerIcon">⏱️</span>
      <span class="mono" id="timerText">00:00</span>
    </div>
    <div class="q-progress">
      <div class="q-bar"><div class="q-bar-fill" id="qBarFill" style="width:0%"></div></div>
      <div class="q-progress-label mono"><span id="qIndex">1</span>/<span id="qTotal">0</span></div>
    </div>
    <div class="q-card">
      <div id="qTags" style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;"></div>
      <div id="qImgWrap"></div>
      <div class="q-text" id="qText"></div>
      <div id="qOptions"></div>
      <button class="solution-toggle" id="solutionToggle">💡 Çözümü Gör</button>
      <div class="solution-box" id="solutionBox"></div>
      <div class="nav-row"><button class="next-btn" id="nextBtn">Sonraki Soru →</button></div>
    </div>
  </div>

  <div id="resultScreen" class="hidden">
    <div class="result-card">
      <div style="font-size:2.2rem;">🎯</div>
      <div class="big-score" id="finalScore">0 / 0</div>
      <p id="finalMsg"></p>
      <div class="result-actions">
        <a class="result-btn secondary" href="deneme-sinavi.html" id="donLink">Denemelere Dön</a>
      </div>
    </div>
  </div>

</div>

<script src="db.js?v=1786350782"></script>
<script>bgysRequireAuth();</script>
<script>
  const LETTERS = ["A","B","C","D"];
  const params = new URLSearchParams(location.search);
  const denemeId = params.get('id') || null;

  let quiz = [];
  let qIdx = 0, correctCount = 0, wrongCount = 0, answered = false;

  const modulInfo = bgysModulInfo();
  document.getElementById('crumbModul').textContent = modulInfo.ad;
  document.getElementById('crumbModul').setAttribute('href', modulInfo.sayfa);
  document.getElementById('donLink').setAttribute('href', bgysWithModul('deneme-sinavi.html'));
  document.title = `Deneme Sınavı — ${modulInfo.ad} — Basamak GYS`;

  async function init() {
    if (denemeId === null) {
      await showList();
      await setupAutoCreatePanel();
      bgysAutoRefresh(showList);
      if (params.get('olustur') === '1') {
        document.getElementById('autoCreatePanel').style.display = 'block';
        document.getElementById('autoCreateArrow').textContent = '▴';
        document.getElementById('autoCreatePanel').scrollIntoView({ behavior: 'smooth' });
      }
    } else {
      await loadDeneme(denemeId);
    }
  }

  document.getElementById('autoCreateToggle').addEventListener('click', () => {
    const panel = document.getElementById('autoCreatePanel');
    const acik = panel.style.display !== 'none';
    panel.style.display = acik ? 'none' : 'block';
    document.getElementById('autoCreateArrow').textContent = acik ? '▾' : '▴';
  });

  let autoCount = 25, autoDiff = 'all';
  document.querySelectorAll('#autoCountChips .chip').forEach(c => {
    c.addEventListener('click', () => {
      document.querySelectorAll('#autoCountChips .chip').forEach(x => x.classList.remove('active'));
      c.classList.add('active');
      autoCount = parseInt(c.dataset.val);
    });
  });
  document.querySelectorAll('#autoDiffChips .chip').forEach(c => {
    c.addEventListener('click', () => {
      document.querySelectorAll('#autoDiffChips .chip').forEach(x => x.classList.remove('active'));
      c.classList.add('active');
      autoDiff = c.dataset.val;
    });
  });

  async function setupAutoCreatePanel() {
    const sorular = await bgysGetAllByModul('sorular');
    const genelPool = sorular.filter(s => s.denemeId === undefined || s.denemeId === null);
    const konular = Array.from(new Set(genelPool.map(s => s.bolum).filter(Boolean))).sort();
    const el = document.getElementById('autoTopicChecks');
    if (konular.length === 0) {
      el.innerHTML = '<p style="color:var(--slate);font-size:0.85rem;">Henüz sorun yok — önce İçerik Ekle\'den soru ekle.</p>';
      return;
    }
    el.innerHTML = `
      <div class="topic-check-row" onclick="document.getElementById('topic-all').click()">
        <input type="checkbox" id="topic-all" checked onclick="event.stopPropagation();toggleAllTopics(this.checked)">
        <label style="font-weight:700;">Tümü (${konular.length} konu)</label>
      </div>
    ` + konular.map(k => `
      <div class="topic-check-row" onclick="document.getElementById('topic-${btoa(unescape(encodeURIComponent(k)))}').click()">
        <input type="checkbox" class="topic-item" id="topic-${btoa(unescape(encodeURIComponent(k)))}" value="${k.replace(/"/g,'&quot;')}" checked onclick="event.stopPropagation()">
        <label>${k}</label>
      </div>
    `).join('');
  }

  window.toggleAllTopics = (checked) => {
    document.querySelectorAll('.topic-item').forEach(cb => cb.checked = checked);
  };

  function shuffleArr(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  document.getElementById('autoCreateBtn').addEventListener('click', async () => {
    const secilenKonular = Array.from(document.querySelectorAll('.topic-item:checked')).map(cb => cb.value);
    if (secilenKonular.length === 0) { showAutoMsg('err', 'En az bir konu seç.'); return; }
    showAutoMsg('warn', 'Deneme oluşturuluyor...');

    const sorular = await bgysGetAllByModul('sorular');
    let pool = sorular.filter(s => (s.denemeId === undefined || s.denemeId === null) && secilenKonular.includes(s.bolum));
    if (autoDiff !== 'all') pool = pool.filter(s => s.difficulty === parseInt(autoDiff));
    pool = shuffleArr(pool);
    const secilenSorular = pool.slice(0, Math.min(autoCount, pool.length));

    if (secilenSorular.length === 0) { showAutoMsg('err', 'Bu kriterlere uyan soru bulunamadı.'); return; }

    const tarih = new Date().toLocaleDateString('tr-TR');
    const zorlukAdi = autoDiff === 'all' ? 'Karışık' : { '1':'Kolay','2':'Orta','3':'Zor' }[autoDiff];
    const yeniDenemeId = await bgysAdd('denemeler', {
      modul: bgysCurrentModul(), baslik: `Otomatik Deneme (${zorlukAdi}) — ${tarih}`,
      tip: 'metin', soruSayisi: secilenSorular.length, zorluk: autoDiff === 'all' ? null : parseInt(autoDiff), otomatik: true
    });
    for (const s of secilenSorular) {
      const klon = { ...s };
      delete klon.id;
      klon.denemeId = yeniDenemeId;
      klon.createdAt = Date.now();
      await bgysAdd('sorular', klon);
    }

    if (secilenSorular.length < autoCount) {
      showAutoMsg('warn', `Sadece ${secilenSorular.length} soru bulundu (istenen ${autoCount}), yine de oluşturuldu. Başlatılıyor...`);
    } else {
      showAutoMsg('ok', `${secilenSorular.length} sorulu deneme oluşturuldu, başlatılıyor...`);
    }
    setTimeout(() => { location.href = bgysWithModul('deneme-sinavi.html?id=' + yeniDenemeId); }, 900);
  });

  function showAutoMsg(cls, text) {
    const el = document.getElementById('autoCreateResult');
    el.className = 'result-msg ' + cls;
    el.textContent = text;
    el.style.display = 'block';
  }

  const DENEME_ZORLUK_LABEL2 = { 1: '🟢 Kolay', 2: '🟡 Orta', 3: '🔴 Zor' };

  async function showList() {
    const denemeler = await bgysGetAllByModul('denemeler');
    const area = document.getElementById('denemeListArea');
    if (denemeler.length === 0) {
      area.innerHTML = `<div class="empty-card">Henüz bir deneme sınavı eklemedin.<br>Bölüm sayfasındaki "İçerik Ekle" ile ekleyebilirsin.</div>`;
      return;
    }
    area.innerHTML = denemeler.reverse().map(d => {
      let action;
      if (d.tip === 'metin') action = `<a class="go" href="${bgysWithModul('deneme-sinavi.html?id=' + d.id)}">Çöz</a>`;
      else if (d.tip === 'pdf') action = `<button class="go" onclick="window.open('${d.dataUrl}','_blank')">Gör</button>`;
      else action = `<button class="go" onclick="window.open('${d.dataUrls[0]}','_blank')">Gör</button>`;
      const zorlukEtiket = d.zorluk ? ` · ${DENEME_ZORLUK_LABEL2[d.zorluk]}` : '';
      return `<div class="list-card">
        <div class="icon">${d.tip === 'metin' ? '📝' : d.tip === 'pdf' ? '📄' : '🖼️'}</div>
        <div class="info"><h3>${d.baslik}</h3><p>${d.tip === 'metin' ? d.soruSayisi + ' soru' : d.tip.toUpperCase()}${zorlukEtiket}</p></div>
        ${action}
      </div>`;
    }).join('');
  }

  let timerInterval = null;
  let secondsLeft = 0;

  function startTimer(totalSoru) {
    secondsLeft = totalSoru * 60; // her soru için 1 dakika
    updateTimerDisplay();
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      secondsLeft--;
      updateTimerDisplay();
      if (secondsLeft <= 0) {
        clearInterval(timerInterval);
        showResults(true);
      }
    }, 1000);
  }

  function updateTimerDisplay() {
    const m = Math.max(0, Math.floor(secondsLeft / 60));
    const s = Math.max(0, secondsLeft % 60);
    document.getElementById('timerText').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    const row = document.getElementById('timerRow');
    if (secondsLeft <= 60) row.classList.add('warn'); else row.classList.remove('warn');
  }

  async function loadDeneme(id) {
    const sorular = await bgysGetAllByModul('sorular');
    quiz = sorular.filter(s => s.denemeId === id);
    if (quiz.length === 0) {
      document.getElementById('listScreen').classList.remove('hidden');
      document.getElementById('denemeListArea').innerHTML = '<div class="empty-card">Bu deneme bulunamadı veya sorusu yok.</div>';
      return;
    }
    document.getElementById('listScreen').classList.add('hidden');
    document.getElementById('quizScreen').classList.remove('hidden');
    document.getElementById('qTotal').textContent = quiz.length;
    qIdx = 0; correctCount = 0; wrongCount = 0;
    startTimer(quiz.length);
    renderQuestion();
  }

  function renderQuestion() {
    answered = false;
    const q = quiz[qIdx];
    document.getElementById('qIndex').textContent = qIdx + 1;
    document.getElementById('qBarFill').style.width = (qIdx / quiz.length * 100) + '%';
    const tagsEl = document.getElementById('qTags');
    if (tagsEl) {
      const oncedenCozuldu = bgysIsSolved(q.id);
      const cozulmeSayisi = bgysGetSolvedCount(q.id);
      tagsEl.innerHTML = oncedenCozuldu ? `<span class="q-tag" style="font-size:0.68rem;font-weight:700;padding:4px 11px;border-radius:100px;background:rgba(34,197,94,0.12);color:#16803C;">✓ ${cozulmeSayisi}. kez çözüldü</span>` : '';
    }
    const imgWrap = document.getElementById('qImgWrap');
    imgWrap.innerHTML = (q.tip === 'image' && q.imageDataUrl) ? `<img class="q-img" src="${q.imageDataUrl}">` : '';
    document.getElementById('qText').textContent = q.question;
    const optsEl = document.getElementById('qOptions');
    optsEl.innerHTML = '';
    q.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = `<span class="opt-letter">${LETTERS[i]}</span><span>${opt}</span>`;
      btn.addEventListener('click', () => selectAnswer(i, btn, q));
      optsEl.appendChild(btn);
    });
    document.getElementById('solutionToggle').classList.remove('show');
    document.getElementById('solutionToggle').textContent = '💡 Çözümü Gör';
    document.getElementById('solutionBox').classList.remove('show');
    document.getElementById('solutionBox').textContent = q.explanation || 'Açıklama eklenmedi.';
    document.getElementById('nextBtn').classList.remove('show');
  }

  function selectAnswer(i, btn, q) {
    if (answered) return;
    answered = true;
    document.querySelectorAll('#qOptions .opt').forEach((el, idx) => {
      el.classList.add('disabled');
      if (idx === q.correct) el.classList.add('correct');
      if (idx !== q.correct) el.classList.add('dim');
    });
    const doguMuydu = (i === q.correct);
    if (doguMuydu) correctCount++; else { btn.classList.remove('dim'); btn.classList.add('wrong'); wrongCount++; }
    bgysMarkSolved(q.id, doguMuydu);
    document.getElementById('solutionToggle').classList.add('show');
    document.getElementById('nextBtn').classList.add('show');
  }

  document.getElementById('solutionToggle').addEventListener('click', () => {
    const box = document.getElementById('solutionBox');
    box.classList.toggle('show');
    document.getElementById('solutionToggle').textContent = box.classList.contains('show') ? '💡 Çözümü Gizle' : '💡 Çözümü Gör';
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    qIdx++;
    if (qIdx >= quiz.length) showResults(); else renderQuestion();
  });

  function showResults(timeUp) {
    clearInterval(timerInterval);
    document.getElementById('quizScreen').classList.add('hidden');
    document.getElementById('resultScreen').classList.remove('hidden');
    const total = quiz.length;
    document.getElementById('finalScore').textContent = `${correctCount} / ${total}`;
    const pct = Math.round((correctCount/total)*100);
    const unanswered = total - correctCount - wrongCount;
    let msg = `%${pct} başarı`;
    if (unanswered > 0) msg += ` · ${unanswered} soru cevaplanmadı`;
    if (timeUp) msg = `⏱️ Süre doldu! ` + msg;
    document.getElementById('finalMsg').textContent = msg;
  }

  init();
</script>

</body>
</html>
