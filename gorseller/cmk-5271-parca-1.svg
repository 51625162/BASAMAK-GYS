<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d2b50"/><stop offset="1" stop-color="#1768b4"/></linearGradient><style>.h{font:700 30px Arial;fill:#fff}.sh{font:700 20px Arial;fill:#123b69}.tx{font:16px Arial;fill:#20344b}.sm{font:14px Arial;fill:#304c68}.num{font:700 22px Arial;fill:#fff}</style></defs><rect width="1500" height="1000" rx="24" fill="#eef4fa"/><rect width="1500" height="150" rx="24" fill="url(#bg)"/><rect y="125" width="1500" height="25" fill="url(#bg)"/><text x="36" y="54" class="h" font-size="22">BASAMAK GYS · 5271 SAYILI KANUN</text><text x="36" y="100" class="h" font-size="38">CEZA MUHAKEMESİ KANUNU</text><rect x="1100" y="28" width="350" height="88" rx="16" fill="#ffc857"/><text x="1125" y="62" font-family="Arial" font-size="22" font-weight="700" fill="#102c4d">1. PARÇA · MADDE 1–32</text><text x="1125" y="91" font-family="Arial" font-size="18" fill="#102c4d">Genel Hükümler ve Temel Kavramlar</text>
<g><rect x="24" y="174" width="470" height="240" rx="18" fill="#fff" stroke="#c8dced" stroke-width="2"/><rect x="24" y="174" width="470" height="48" rx="18" fill="#1765b7"/><rect x="24" y="205" width="470" height="17" fill="#1765b7"/><text x="48" y="205" class="h" font-size="21">1 · KANUNUN KAPSAMI</text><text x="48" y="254" class="sh">Madde 1</text><text x="48" y="284" class="tx">Ceza muhakemesinin nasıl yapılacağını,</text><text x="48" y="309" class="tx">sürece katılan kişilerin hak, yetki ve</text><text x="48" y="334" class="tx">yükümlülüklerini düzenler.</text><rect x="46" y="356" width="420" height="38" rx="9" fill="#e8f7ef"/><text x="62" y="380" class="sm">Hatırla: usul kuralları + katılımcı hakları</text></g>
<g><rect x="514" y="174" width="962" height="240" rx="18" fill="#fff" stroke="#c8dced" stroke-width="2"/><rect x="514" y="174" width="962" height="48" rx="18" fill="#1b8b83"/><rect x="514" y="205" width="962" height="17" fill="#1b8b83"/><text x="538" y="205" class="h" font-size="21">2 · TEMEL KAVRAMLAR — MADDE 2</text><rect x="536" y="238" width="214" height="142" rx="12" fill="#fff0f0" stroke="#d7e2ec"/><text x="550" y="267" font-family="Arial" font-weight="700" font-size="18" fill="#b4232d">ŞÜPHELİ</text><text x="550" y="298" class="sm">Soruşturma evresinde suç şüphesi</text><text x="550" y="319" class="sm">altında bulunan kişi</text><text x="550" y="340" class="sm"></text><rect x="768" y="238" width="214" height="142" rx="12" fill="#edf4ff" stroke="#d7e2ec"/><text x="782" y="267" font-family="Arial" font-weight="700" font-size="18" fill="#1759a6">SANIK</text><text x="782" y="298" class="sm">Kovuşturmanın başlamasından hüküm kesinleşene</text><text x="782" y="319" class="sm">kadar</text><text x="782" y="340" class="sm"></text><rect x="1000" y="238" width="214" height="142" rx="12" fill="#eaf8f0" stroke="#d7e2ec"/><text x="1014" y="267" font-family="Arial" font-weight="700" font-size="18" fill="#087c68">MÜDAFİ</text><text x="1014" y="298" class="sm">Şüpheli veya sanığın savunmasını</text><text x="1014" y="319" class="sm">yapan avukat</text><text x="1014" y="340" class="sm"></text><rect x="1232" y="238" width="214" height="142" rx="12" fill="#fff5e7" stroke="#d7e2ec"/><text x="1246" y="267" font-family="Arial" font-weight="700" font-size="18" fill="#a35d00">VEKİL</text><text x="1246" y="298" class="sm">Katılan veya suçtan zarar</text><text x="1246" y="319" class="sm">göreni temsil eden avukat</text><text x="1246" y="340" class="sm"></text></g>
<g><rect x="24" y="432" width="460" height="270" rx="18" fill="#fff" stroke="#c8dced" stroke-width="2"/><rect x="24" y="432" width="460" height="48" rx="18" fill="#3b82c4"/><rect x="24" y="463" width="460" height="17" fill="#3b82c4"/><text x="48" y="463" class="h" font-size="21">3 · GÖREV · MADDE 3–7</text><circle cx="56" cy="511" r="14" fill="#1765b7"/><text x="50" y="518" class="num" font-size="16">3</text><text x="82" y="517" class="sm">Görevler kanunla belirlenir.</text><circle cx="56" cy="546" r="14" fill="#1765b7"/><text x="50" y="553" class="num" font-size="16">4</text><text x="82" y="552" class="sm">Mahkeme görevini re’sen inceler.</text><circle cx="56" cy="581" r="14" fill="#1765b7"/><text x="50" y="588" class="num" font-size="16">5</text><text x="82" y="587" class="sm">Görevsizlik kararı verilebilir.</text><circle cx="56" cy="616" r="14" fill="#1765b7"/><text x="50" y="623" class="num" font-size="16">6</text><text x="82" y="622" class="sm">Hukuki nitelik değişti diye alt mahkemeye gönderilemez.</text><circle cx="56" cy="651" r="14" fill="#1765b7"/><text x="50" y="658" class="num" font-size="16">7</text><text x="82" y="657" class="sm">Görevsiz mahkemenin işlemleri kural olarak hükümsüzdür.</text></g>
<g><rect x="504" y="432" width="460" height="270" rx="18" fill="#fff" stroke="#c8dced" stroke-width="2"/><rect x="504" y="432" width="460" height="48" rx="18" fill="#cc477b"/><rect x="504" y="463" width="460" height="17" fill="#cc477b"/><text x="528" y="463" class="h" font-size="21">4 · BAĞLANTILI DAVALAR</text><text x="532" y="512" class="sh">Madde 8–11</text><text x="532" y="543" class="tx">• Bir kişinin birden çok suçtan sanık olması</text><text x="532" y="574" class="tx">• Bir suçta birden fazla sanık bulunması</text><text x="532" y="605" class="tx">• Davaların birleştirilmesi veya ayrılması</text><rect x="526" y="631" width="414" height="44" rx="10" fill="#fff0f6"/><text x="540" y="658" class="sm">Amaç: bağlantılı davaların birlikte değerlendirilmesi</text></g>
<g><rect x="984" y="432" width="492" height="270" rx="18" fill="#fff" stroke="#c8dced" stroke-width="2"/><rect x="984" y="432" width="492" height="48" rx="18" fill="#179c79"/><rect x="984" y="463" width="492" height="17" fill="#179c79"/><text x="1008" y="463" class="h" font-size="21">5 · YETKİ · MADDE 12–21</text><text x="1010" y="515" class="sh">Genel kural</text><text x="1010" y="543" class="tx">Suçun işlendiği yer mahkemesi yetkilidir.</text><path d="M1010 562 H1448" stroke="#dce6f0" stroke-width="2"/><text x="1010" y="592" class="sm">Özel durumlar: teşebbüs, kesintisiz/zincirleme</text><text x="1010" y="616" class="sm">suçlar, taşıtlar ve yabancı ülkede işlenen suçlar.</text><rect x="1008" y="638" width="440" height="38" rx="9" fill="#e8f7ef"/><text x="1024" y="662" class="sm">Görev = hangi mahkeme? · Yetki = hangi yer?</text></g>
<g><rect x="24" y="720" width="720" height="250" rx="18" fill="#fff" stroke="#c8dced" stroke-width="2"/><rect x="24" y="720" width="720" height="48" rx="18" fill="#e4a333"/><rect x="24" y="751" width="720" height="17" fill="#e4a333"/><text x="48" y="751" class="h" font-size="21">SÜREÇ ŞEMASI · SORUŞTURMA → KOVUŞTURMA</text><rect x="52" y="795" width="250" height="105" rx="12" fill="#eaf3ff" stroke="#91bce8" stroke-width="2"/><text x="75" y="827" class="sh">SORUŞTURMA</text><text x="75" y="855" class="sm">Suç şüphesinin öğrenilmesi</text><text x="75" y="878" class="sm">→ iddianamenin kabulüne kadar</text><path d="M312 847 H394" stroke="#1765b7" stroke-width="5"/><path d="M382 835 L398 847 L382 859" fill="none" stroke="#1765b7" stroke-width="5"/><rect x="408" y="795" width="300" height="105" rx="12" fill="#eaf8f0" stroke="#85d2b1" stroke-width="2"/><text x="432" y="827" class="sh">KOVUŞTURMA</text><text x="432" y="855" class="sm">İddianamenin kabulüyle başlar</text><text x="432" y="878" class="sm">→ hüküm kesinleşene kadar</text><text x="52" y="935" class="sm">Ezber: Şüpheli = soruşturma · Sanık = kovuşturma</text></g>
<g><rect x="764" y="720" width="712" height="250" rx="18" fill="#fff" stroke="#c8dced" stroke-width="2"/><rect x="764" y="720" width="712" height="48" rx="18" fill="#d94848"/><rect x="764" y="751" width="712" height="17" fill="#d94848"/><text x="788" y="751" class="h" font-size="21">SINAVDA DİKKAT · MADDE 22–32</text><text x="792" y="805" class="tx">• Hâkimin davaya bakamayacağı hâller</text><text x="792" y="838" class="tx">• Hâkimin reddi ve çekinmesi</text><text x="792" y="871" class="tx">• Ret isteminin süresi, usulü ve inceleme mercii</text><rect x="790" y="899" width="654" height="44" rx="10" fill="#fff0f0"/><text x="806" y="926" class="sm">Birbirine karıştırma: yasaklılık ≠ ret ≠ çekinme</text></g></svg>