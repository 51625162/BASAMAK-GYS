<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Bilgi Kartları — Basamak GYS</title><style>
:root{--ink:#10243E;--teal:#0E9E97;--cloud:#F3F7F9;--white:#fff;--mist:#E1EAEE;--slate:#5B7186;--radius:18px}*{box-sizing:border-box}body{margin:0;background:var(--cloud);color:var(--ink);font-family:Inter,Arial,sans-serif}.topbar{padding:18px 6vw;background:#fff;border-bottom:1px solid var(--mist);position:sticky;top:0;z-index:10}.crumb{display:flex;gap:10px;align-items:center;font-size:.88rem;color:var(--slate);font-weight:600}.crumb a{color:inherit;text-decoration:none}.hero,.content{max-width:1180px;margin:auto}.hero{padding:40px 6vw 8px}.hero h1{margin:0 0 5px}.hero p{margin:0;color:var(--slate)}.content{padding:36px 6vw 90px}.group{background:#fff;border:1px solid var(--mist);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}.head{width:100%;padding:16px 18px;background:#fff;border:0;display:flex;justify-content:space-between;cursor:pointer;text-align:left}.title{font-weight:800}.count{font-size:.75rem;color:var(--slate);margin-left:8px}.arrow{transition:transform .18s}.group.open .arrow{transform:rotate(180deg)}.body{display:none;padding:0 14px 14px}.group.open .body{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;max-height:420px;overflow-y:auto;padding-bottom:14px;}.card{background:var(--cloud);border:1px solid var(--mist);border-radius:14px;padding:16px}.tag{display:inline-block;font-size:.67rem;font-weight:700;padding:4px 9px;border-radius:100px;background:#e8f6f5;color:#0b7f79}.card h3{font-size:.92rem;margin:10px 0}.card p{font-size:.88rem;line-height:1.6;white-space:pre-line;margin:0;color:#304a60}.empty{text-align:center;background:#fff;border:1.5px dashed var(--mist);border-radius:var(--radius);padding:48px 24px;color:var(--slate)}
</style></head><body><div class="topbar"><div class="crumb"><a href="index.html">Basamak GYS</a><span>/</span><a href="saymanlik.html" id="crumbModul">Saymanlık</a><span>/</span><span>Bilgi Kartları</span></div></div><section class="hero"><h1 id="pageH1">Bilgi Kartları</h1><p>Aynı bölümdeki kısa notlar tek başlık altında toplanır.</p></section><div class="content"><div id="groups"></div><div id="empty" class="empty" style="display:none">📥<h3>Henüz bilgi kartı eklemedin</h3><p>Kısa notlarını İçerik Ekle bölümünden ekleyebilirsin.</p></div></div>
<script src="db.js?v=1786350782"></script><script>bgysRequireAuth();</script><script>
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
async function render(){try{const all=await bgysGetAllByModul('konular'),items=all.filter(x=>x.tip==='metin'),root=document.getElementById('groups'),empty=document.getElementById('empty');if(!items.length){root.innerHTML='';root.style.display='none';empty.style.display='block';return}empty.style.display='none';root.style.display='block';const groups={};items.forEach(x=>{const k=(x.bolum||'Diğer').trim()||'Diğer';(groups[k]??=[]).push(x)});root.innerHTML=Object.entries(groups).map(([b,arr],i)=>`<section class="group open" id="g${i}"><button class="head" onclick="document.getElementById('g${i}').classList.toggle('open')"><span><span class="title">${esc(b)}</span><span class="count">${arr.length} kart</span></span><span class="arrow">▼</span></button><div class="body">${arr.slice().reverse().map(it=>`<article class="card"><span class="tag">${it.kaynak==='yapistir'?'📋 Yapıştır':'📝 Bilgi Kartı'}</span><h3>${esc(it.baslik||'Bilgi kartı')}</h3><p>${esc(it.metin||'')}</p></article>`).join('')}</div></section>`).join('')}catch(e){console.error(e)}}
const mi=bgysModulInfo();document.getElementById('crumbModul').textContent=mi.ad;document.getElementById('crumbModul').href=mi.sayfa;document.getElementById('pageH1').textContent=mi.ad+' Bilgi Kartları';document.title='Bilgi Kartları — '+mi.ad+' — Basamak GYS';render();bgysAutoRefresh(render);
</script></body></html>
