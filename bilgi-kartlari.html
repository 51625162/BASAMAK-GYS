<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Bilgi Kartları — Basamak GYS</title>
<style>body{margin:0;background:#F3F7F9;color:#10243E;font-family:Inter,Arial,sans-serif}.topbar{padding:18px 6vw;background:#fff;border-bottom:1px solid #E1EAEE}.crumb{display:flex;gap:10px;align-items:center;font-size:.88rem;color:#5B7186;font-weight:600}.content{max-width:1180px;margin:auto;padding:36px 6vw 90px}.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}.g-card{background:#fff;border:1px solid #E1EAEE;border-radius:22px;overflow:hidden}.g-info{padding:20px}.g-tag{display:inline-block;font-size:.68rem;font-weight:700;padding:4px 10px;border-radius:100px;background:#E8F6F5;color:#0B7F79}.g-info h3{margin:10px 0;font-size:1rem}.g-info p{font-size:.9rem;line-height:1.6;white-space:pre-line}.empty-card{text-align:center;background:#fff;border:1.5px dashed #E1EAEE;border-radius:22px;padding:48px 24px;color:#5B7186}.hero{max-width:1180px;margin:auto;padding:40px 6vw 8px}.hero h1{margin:0 0 5px}.hero p{margin:0;color:#5B7186}</style></head><body>
<div class="topbar"><div class="crumb"><a href="index.html">Basamak GYS</a><span>/</span><a href="saymanlik.html" id="crumbModul">Saymanlık</a><span>/</span><span>Bilgi Kartları</span></div></div>
<section class="hero"><h1 id="pageH1">Bilgi Kartları</h1><p>Kısa, akılda kalıcı notların — hızlı tekrar için.</p></section>
<div class="content"><div id="ownKonuGrid" class="gallery-grid"></div><div id="ownKonuEmpty" class="empty-card" style="display:none"><h3>Henüz bilgi kartı eklemedin</h3><p>Kısa notlarını İçerik Ekle bölümünden ekleyebilirsin.</p></div></div>
<script src="db.js?v=1786350782"></script><script>bgysRequireAuth();</script><script>
const konuDataMap={};
async function renderOwnKonular(){
 try{
  const all=await bgysGetAllByModul('konular');
  // Normal metin kartları ve Yapıştır modunda eklenen metin notları birlikte gösterilir.
  const items=all.filter(it=>it.tip==='metin');
  const grid=document.getElementById('ownKonuGrid'),empty=document.getElementById('ownKonuEmpty');
  if(!items.length){grid.innerHTML='';grid.style.display='none';empty.style.display='block';return}
  empty.style.display='none';grid.style.display='grid';
  items.forEach(it=>konuDataMap[it.id]=it);
  grid.innerHTML=items.slice().reverse().map(it=>`<div class="g-card"><div class="g-info"><span class="g-tag">${it.bolum||''}${it.kaynak==='yapistir'?' · 📋 Yapıştır':''}</span><h3>${it.baslik||'Bilgi kartı'}</h3><p>${it.metin||''}</p></div></div>`).join('');
 }catch(e){console.error('Bilgi kartları yüklenemedi',e)}
}
const modulInfo=bgysModulInfo();document.getElementById('crumbModul').textContent=modulInfo.ad;document.getElementById('crumbModul').href=modulInfo.sayfa;document.getElementById('pageH1').textContent=`${modulInfo.ad} Bilgi Kartları`;document.title=`Bilgi Kartları — ${modulInfo.ad} — Basamak GYS`;
renderOwnKonular();bgysAutoRefresh(renderOwnKonular);
</script></body></html>
