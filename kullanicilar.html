<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kayıtlı Kullanıcılar — Basamak GYS</title>
<script src="db.js?v=1786350782"></script>
<style>
body{margin:0;background:#F3F7F9;color:#10243E;font-family:Inter,system-ui,sans-serif}.wrap{max-width:700px;margin:auto;padding:24px 18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.card{background:white;border:1px solid #E1EAEE;border-radius:18px;padding:20px;margin-bottom:16px}h1{font-size:1.35rem;margin:0}.muted{color:#5B7186;font-size:.88rem}input{width:100%;box-sizing:border-box;padding:12px;border:1.5px solid #E1EAEE;border-radius:12px;margin:10px 0;font:inherit}.row{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:100px;padding:10px 16px;font-weight:700;cursor:pointer}.primary{background:#0E9E97;color:white}.danger{background:#FEECEC;color:#C0392B}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #E1EAEE}.item:last-child{border-bottom:0}.email{font-weight:600;word-break:break-all}.msg{padding:10px 12px;border-radius:10px;margin-top:10px;font-size:.86rem;display:none}.ok{display:block;background:#ECFDF3;color:#16803C}.err{display:block;background:#FEECEC;color:#C0392B}a{color:#0B7F79;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><h1>👥 Kayıtlı Kullanıcılar</h1><a href="icerik-ekle.html">← İçerik Ekle</a></div>
<div class="card"><div class="muted">Not veya içerik paylaşırken kullanacağın e-posta adreslerini burada kayıtlı tutabilirsin. Kayıtlar sadece kendi hesabına aittir.</div><input id="email" type="email" placeholder="ornek@mail.com"><div class="row"><button class="btn primary" id="add">+ Kullanıcı Ekle</button></div><div id="msg" class="msg"></div></div>
<div class="card"><h3>Kayıtlı Kullanıcılar</h3><div id="list" class="muted">Yükleniyor...</div></div>
</div>
<script>
async function col(){await bgysInitFirebase();const u=bgysCurrentUser()||await bgysWaitForAuth();if(!u)throw Error('Giriş yapılmamış');return firebase.firestore().collection('users').doc(u.uid).collection('kayitliKullanicilar')}
function msg(t,c){const e=document.getElementById('msg');e.textContent=t;e.className='msg '+c}
async function load(){const list=document.getElementById('list');try{const s=await (await col()).orderBy('email').get({source:'server'});if(s.empty){list.textContent='Henüz kayıtlı kullanıcı yok.';return}list.innerHTML=s.docs.map(d=>{const x=d.data();return `<div class="item"><span class="email">${x.email}</span><button class="btn danger" onclick="removeUser('${d.id}')">🗑️ Sil</button></div>`}).join('')}catch(e){list.textContent='Yüklenemedi: '+e.message}}
async function removeUser(id){if(!confirm('Bu kullanıcı kayıtlı listeden silinsin mi?'))return;try{await (await col()).doc(id).delete();await load();msg('Kullanıcı silindi.','ok')}catch(e){msg('Silme hatası: '+e.message,'err')}}
document.getElementById('add').onclick=async()=>{const input=document.getElementById('email');const email=input.value.trim().toLowerCase();if(!email||!email.includes('@')){msg('Geçerli bir e-posta gir.','err');return}try{const c=await col();const old=await c.where('email','==',email).limit(1).get({source:'server'});if(!old.empty){msg('Bu kullanıcı zaten kayıtlı.','err');return}await c.add({email,createdAt:Date.now()});input.value='';msg('Kullanıcı kaydedildi.','ok');await load()}catch(e){msg('Ekleme hatası: '+e.message,'err')}};
bgysRequireAuth().then(load);
</script>
</body>
</html>
