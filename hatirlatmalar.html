<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hatırlatmalar — Basamak GYS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10243E; --teal:#0E9E97; --teal-dark:#0B7F79; --amber:#F5A623;
    --coral:#FF6B5D; --violet:#8B6BF2; --red:#EF4444; --red-dark:#C0392B;
    --green:#22C55E;
    --cloud:#F3F7F9; --white:#FFFFFF; --mist:#E1EAEE; --slate:#5B7186;
    --radius-lg:22px; --radius-md:16px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cloud);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Sora',sans-serif;letter-spacing:-0.01em;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 6vw;background:var(--white);border-bottom:1px solid var(--mist);position:sticky;top:0;z-index:10;}
  .crumb{display:flex;align-items:center;gap:10px;font-size:0.86rem;color:var(--slate);font-weight:600;}
  .crumb .cur{color:var(--ink);}
  .crumb .sep{opacity:0.5;}

  .page-hero{max-width:820px;margin:0 auto;padding:34px 6vw 8px;display:flex;align-items:center;gap:16px;}
  .page-hero .icon{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,var(--coral),var(--red-dark));display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:white;flex-shrink:0;}
  .page-hero h1{font-size:clamp(1.4rem,3vw,1.8rem);margin:0 0 4px;}
  .page-hero p{margin:0;color:var(--slate);font-size:0.9rem;}

  .wrap{max-width:820px;margin:0 auto;padding:20px 6vw 90px;}

  .tabs{display:flex;gap:8px;margin-bottom:24px;}
  .tab-btn{padding:10px 20px;border-radius:100px;background:var(--white);border:1.5px solid var(--mist);font-weight:700;font-size:0.88rem;color:var(--slate);}
  .tab-btn.active{background:var(--ink);color:white;border-color:var(--ink);}
  .panel{display:none;}
  .panel.active{display:block;}

  .card{background:var(--white);border:1px solid var(--mist);border-radius:var(--radius-lg);padding:22px;margin-bottom:20px;}
  .card h3{margin:0 0 14px;font-size:1.02rem;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:0.82rem;font-weight:700;margin-bottom:6px;}
  .field input, .field textarea, .field select{width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid var(--mist);font-size:0.92rem;background:var(--cloud);color:var(--ink);font-family:inherit;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .btn{padding:12px 20px;border-radius:100px;font-weight:700;font-size:0.88rem;}
  .btn.primary{background:linear-gradient(135deg,var(--coral),var(--red-dark));color:white;width:100%;}
  .btn.primary.teal{background:linear-gradient(135deg,var(--teal),var(--teal-dark));}
  .btn.secondary{background:var(--cloud);color:var(--ink);}
  .btn.danger{background:rgba(239,68,68,0.1);color:var(--red-dark);}
  .btn.small{padding:8px 14px;font-size:0.8rem;}

  .result-msg{display:none;margin-top:12px;padding:11px 14px;border-radius:12px;font-size:0.85rem;}
  .result-msg.ok{display:block;background:rgba(34,197,94,0.1);color:#16803C;}
  .result-msg.err{display:block;background:rgba(239,68,68,0.1);color:var(--red-dark);}

  .item-card{background:var(--white);border:1px solid var(--mist);border-radius:16px;padding:16px 18px;margin-bottom:10px;display:flex;align-items:center;gap:14px;}
  .item-card.overdue{border-color:var(--red);background:rgba(239,68,68,0.04);}
  .item-card.done{opacity:0.55;}
  .item-icon{width:38px;height:38px;border-radius:11px;background:var(--cloud);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;}
  .item-info{flex-grow:1;min-width:0;}
  .item-info h4{margin:0 0 3px;font-size:0.95rem;}
  .item-info p{margin:0;color:var(--slate);font-size:0.8rem;}
  .item-actions{display:flex;gap:6px;flex-shrink:0;}
  .empty-note{color:var(--slate);font-size:0.85rem;padding:20px 0;text-align:center;}

  .status-badge{font-size:0.68rem;font-weight:700;padding:3px 9px;border-radius:100px;display:inline-block;margin-bottom:4px;}
  .status-badge.planlandi{background:rgba(139,107,242,0.12);color:var(--violet);}
  .status-badge.tamamlandi{background:rgba(34,197,94,0.12);color:#16803C;}
</style>
</head>
<body>

<div class="topbar">
  <div class="crumb">
    <a href="index.html">Basamak GYS</a><span class="sep">/</span>
    <span class="cur">Hatırlatmalar</span>
  </div>
</div>

<section class="page-hero">
  <div class="icon">🔔</div>
  <div>
    <h1>Hatırlatmalar & Ders Takip</h1>
    <p>Kendi tarih/saatini belirle, zamanı gelince ana sayfada kırmızı bildirimle görürsün.</p>
  </div>
</section>

<div class="wrap">
  <div class="tabs">
    <button class="tab-btn active" data-tab="hatirlatma">🔔 Hatırlatmalar</button>
    <button class="tab-btn" data-tab="takip">📅 Ders Takip Çizelgesi</button>
  </div>

  <!-- ===== HATIRLATMALAR ===== -->
  <div class="panel active" id="panel-hatirlatma">
    <div class="card">
      <h3>Yeni Hatırlatma Ekle</h3>
      <div class="field"><label>Başlık</label><input type="text" id="hBaslik" placeholder="Örn. Anayasa tekrarı yap"></div>
      <div class="field"><label>Not (opsiyonel)</label><textarea id="hNot" rows="2" placeholder="Ek detay..."></textarea></div>
      <div class="field-row">
        <div class="field"><label>Tarih</label><input type="date" id="hTarih"></div>
        <div class="field"><label>Saat</label><input type="time" id="hSaat"></div>
      </div>
      <button class="btn primary" id="hEkleBtn">Hatırlatma Ekle</button>
      <div class="result-msg" id="hResult"></div>
    </div>

    <h3 style="font-size:1rem;margin:24px 0 12px;">Tüm Hatırlatmaların</h3>
    <div id="hList"></div>
  </div>

  <!-- ===== DERS TAKİP ÇİZELGESİ ===== -->
  <div class="panel" id="panel-takip">
    <div class="card">
      <h3>Çizelgeye Ekle</h3>
      <div class="field"><label>Ders / Konu</label><input type="text" id="tDers" placeholder="Örn. Saymanlık - 5018 Sayılı Kanun"></div>
      <div class="field-row">
        <div class="field"><label>Tarih</label><input type="date" id="tTarih"></div>
        <div class="field"><label>Saat</label><input type="time" id="tSaat"></div>
      </div>
      <div class="field"><label>Süre (dakika, opsiyonel)</label><input type="number" id="tSure" placeholder="Örn. 60"></div>
      <div class="field"><label>Not (opsiyonel)</label><textarea id="tNot" rows="2" placeholder="Ne çalışılacak..."></textarea></div>
      <button class="btn primary teal" id="tEkleBtn">Çizelgeye Ekle</button>
      <div class="result-msg" id="tResult"></div>
    </div>

    <h3 style="font-size:1rem;margin:24px 0 12px;">Çizelgem</h3>
    <div id="tList"></div>
  </div>
</div>

<script src="db.js"></script>
<script>bgysRequireAuth();</script>
<script>
  // ===== HATIRLATMALAR =====
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });

  function showMsg(id, cls, text) {
    const el = document.getElementById(id);
    el.className = 'result-msg ' + cls;
    el.textContent = text;
  }

  document.getElementById('hEkleBtn').addEventListener('click', async () => {
    const baslik = document.getElementById('hBaslik').value.trim();
    const not_ = document.getElementById('hNot').value.trim();
    const tarih = document.getElementById('hTarih').value;
    const saat = document.getElementById('hSaat').value;
    if (!baslik || !tarih || !saat) { showMsg('hResult', 'err', 'Başlık, tarih ve saat gerekli.'); return; }
    const zamanTs = new Date(`${tarih}T${saat}:00`).getTime();
    await bgysAdd('hatirlatmalar', { baslik, not: not_, tarih, saat, zamanTs, tamamlandi: false });
    showMsg('hResult', 'ok', 'Hatırlatma eklendi.');
    document.getElementById('hBaslik').value = '';
    document.getElementById('hNot').value = '';
    document.getElementById('hTarih').value = '';
    document.getElementById('hSaat').value = '';
    renderHatirlatmalar();
  });

  async function renderHatirlatmalar() {
    const items = await bgysGetAll('hatirlatmalar');
    const el = document.getElementById('hList');
    if (items.length === 0) { el.innerHTML = '<div class="empty-note">Henüz hatırlatma eklemedin.</div>'; return; }
    const now = Date.now();
    items.sort((a, b) => (a.zamanTs || 0) - (b.zamanTs || 0));
    el.innerHTML = items.map(it => {
      const gecmis = !it.tamamlandi && it.zamanTs && it.zamanTs <= now;
      return `
      <div class="item-card ${gecmis ? 'overdue' : ''} ${it.tamamlandi ? 'done' : ''}">
        <div class="item-icon">${it.tamamlandi ? '✅' : gecmis ? '🔴' : '🔔'}</div>
        <div class="item-info">
          <h4>${it.baslik}</h4>
          <p>${it.tarih} · ${it.saat}${it.not ? ' — ' + it.not : ''}</p>
        </div>
        <div class="item-actions">
          ${!it.tamamlandi ? `<button class="btn secondary small" onclick="tamamlaHatirlatma('${it.id}')">Tamamlandı</button>` : ''}
          <button class="btn danger small" onclick="silHatirlatma('${it.id}')">Sil</button>
        </div>
      </div>`;
    }).join('');
  }
  window.tamamlaHatirlatma = async (id) => { await bgysMarkReminderDone(id); renderHatirlatmalar(); };
  window.silHatirlatma = async (id) => { await bgysDelete('hatirlatmalar', id); renderHatirlatmalar(); };

  // ===== DERS TAKİP ÇİZELGESİ =====
  document.getElementById('tEkleBtn').addEventListener('click', async () => {
    const ders = document.getElementById('tDers').value.trim();
    const tarih = document.getElementById('tTarih').value;
    const saat = document.getElementById('tSaat').value;
    const sure = document.getElementById('tSure').value.trim();
    const not_ = document.getElementById('tNot').value.trim();
    if (!ders || !tarih || !saat) { showMsg('tResult', 'err', 'Ders, tarih ve saat gerekli.'); return; }
    const zamanTs = new Date(`${tarih}T${saat}:00`).getTime();
    await bgysAdd('dersTakip', { ders, tarih, saat, zamanTs, sure: sure || null, not: not_, durum: 'planlandi' });
    showMsg('tResult', 'ok', 'Çizelgeye eklendi.');
    document.getElementById('tDers').value = '';
    document.getElementById('tTarih').value = '';
    document.getElementById('tSaat').value = '';
    document.getElementById('tSure').value = '';
    document.getElementById('tNot').value = '';
    renderTakip();
  });

  async function renderTakip() {
    const items = await bgysGetAll('dersTakip');
    const el = document.getElementById('tList');
    if (items.length === 0) { el.innerHTML = '<div class="empty-note">Henüz çizelgeye bir şey eklemedin.</div>'; return; }
    items.sort((a, b) => (a.zamanTs || 0) - (b.zamanTs || 0));
    el.innerHTML = items.map(it => `
      <div class="item-card ${it.durum === 'tamamlandi' ? 'done' : ''}">
        <div class="item-icon">📅</div>
        <div class="item-info">
          <span class="status-badge ${it.durum}">${it.durum === 'tamamlandi' ? 'Tamamlandı' : 'Planlandı'}</span>
          <h4>${it.ders}</h4>
          <p>${it.tarih} · ${it.saat}${it.sure ? ' · ' + it.sure + ' dk' : ''}${it.not ? ' — ' + it.not : ''}</p>
        </div>
        <div class="item-actions">
          ${it.durum !== 'tamamlandi' ? `<button class="btn secondary small" onclick="tamamlaTakip('${it.id}')">Tamamlandı</button>` : ''}
          <button class="btn danger small" onclick="silTakip('${it.id}')">Sil</button>
        </div>
      </div>
    `).join('');
  }
  window.tamamlaTakip = async (id) => {
    await bgysInitFirebase();
    await bgysUserCollection('dersTakip').doc(String(id)).update({ durum: 'tamamlandi' });
    renderTakip();
  };
  window.silTakip = async (id) => { await bgysDelete('dersTakip', id); renderTakip(); };

  renderHatirlatmalar();
  renderTakip();
</script>

</body>
</html>
