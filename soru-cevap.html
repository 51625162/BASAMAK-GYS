<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soru-Cevap — Basamak GYS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#10243E;--teal:#0E9E97;--teal-dark:#0B7F79;--violet:#8B6BF2;--coral:#FF6B5D;--cloud:#F3F7F9;--white:#fff;--mist:#E1EAEE;--slate:#5B7186;--radius:20px}
*{box-sizing:border-box}body{margin:0;background:var(--cloud);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}h1,h2,h3{font-family:Sora,system-ui,sans-serif}button{font-family:inherit;cursor:pointer;border:0}a{color:inherit;text-decoration:none}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 6vw;background:#fff;border-bottom:1px solid var(--mist);position:sticky;top:0;z-index:10}.crumb{display:flex;gap:10px;align-items:center;font-size:.88rem;color:var(--slate);font-weight:600}.crumb .cur{color:var(--ink)}.sep{opacity:.5}
.page-hero{padding:40px 6vw 10px;max-width:1180px;margin:auto;display:flex;align-items:center;gap:18px}.page-hero .icon{width:58px;height:58px;border-radius:16px;flex-shrink:0;background:linear-gradient(135deg,#F49AC1,#E0629C);display:flex;align-items:center;justify-content:center;font-size:1.7rem}.page-hero h1{font-size:clamp(1.5rem,3vw,2rem);margin:0 0 4px}.page-hero p{margin:0;color:var(--slate);font-size:.95rem}.content{max-width:1180px;margin:auto;padding:30px 6vw 90px}
.group-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}.group-card{background:#fff;border:1px solid var(--mist);border-radius:var(--radius);overflow:hidden;box-shadow:0 8px 22px -18px rgba(16,36,62,.3)}.group-head{padding:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}.group-head:hover{background:#fbfdfe}.group-title{display:flex;align-items:center;gap:12px;min-width:0}.group-icon{width:44px;height:44px;border-radius:13px;background:rgba(14,158,151,.12);color:var(--teal-dark);display:flex;align-items:center;justify-content:center;font-size:1.25rem;flex-shrink:0}.group-title h3{margin:0;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.count{font-size:.72rem;font-weight:700;color:var(--slate);background:var(--cloud);padding:5px 9px;border-radius:100px;white-space:nowrap}.arrow{font-size:1rem;color:var(--slate);transition:transform .2s}.group-card.open .arrow{transform:rotate(180deg)}
.question-list{display:none;border-top:1px solid var(--mist);padding:8px 14px 14px}.group-card.open .question-list{display:block}.qa-item{padding:14px 8px;border-bottom:1px dashed var(--mist)}.qa-item:last-child{border-bottom:0}.qa-number{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--teal-dark);font-weight:700;margin-bottom:6px}.qa-question{font-weight:700;font-size:.91rem;line-height:1.5}.qa-answer{display:none;margin-top:9px;padding:10px 12px;border-radius:10px;background:rgba(14,158,151,.07);color:var(--teal-dark);font-size:.88rem;line-height:1.55;white-space:pre-line}.qa-item.show .qa-answer{display:block}.qa-actions{display:flex;gap:7px;margin-top:10px}.qa-btn{padding:7px 11px;border-radius:9px;font-size:.75rem;font-weight:700;background:#fff;color:var(--violet);border:1px solid var(--violet)}.qa-btn.delete{color:var(--coral);border-color:var(--coral)}
.empty-card{background:#fff;border:1.5px dashed var(--mist);border-radius:var(--radius);padding:48px 24px;text-align:center;color:var(--slate)}.empty-card .big-icon{font-size:2.4rem;margin-bottom:12px}.empty-card h3{color:var(--ink);margin:0 0 8px;font-size:1.1rem}.empty-card p{margin:0 0 10px;font-size:.92rem}
@media(max-width:650px){.group-grid{grid-template-columns:1fr}.topbar{padding:15px 4vw}.page-hero,.content{padding-left:4vw;padding-right:4vw}}
</style>
</head>
<body>
<div class="topbar"><div class="crumb"><a href="index.html">Basamak GYS</a><span class="sep">/</span><a href="saymanlik.html" id="crumbModul">Saymanlık</a><span class="sep">/</span><span class="cur">Soru-Cevap</span></div></div>
<section class="page-hero"><div class="icon">📇</div><div><h1 id="pageH1">Soru-Cevap</h1><p>Aynı konu veya dosyaya ait soru-cevaplar tek yerde. Gruba tıklayarak soruları aç.</p></div></section>
<div class="content"><div id="groupGrid" class="group-grid"></div><div id="emptyCard" class="empty-card" style="display:none"><div class="big-icon">📥</div><h3>Henüz soru-cevap eklemedin</h3><p>İçerik Ekle bölümünden soru-cevaplarını ekleyebilirsin.</p></div></div>
<script src="db.js?v=1786350782"></script>
<script>bgysRequireAuth();</script>
<script>
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function groupKey(it){return String(it.bolum||'Genel').trim()||'Genel'}
async function renderOwnKonular(){
  const items=await bgysGetAllByModul('soruCevap');
  const grid=document.getElementById('groupGrid'), empty=document.getElementById('emptyCard');
  if(!items.length){grid.innerHTML='';grid.style.display='none';empty.style.display='block';return}
  empty.style.display='none';grid.style.display='grid';
  const groups={};
  [...items].reverse().forEach(it=>{const k=groupKey(it);if(!groups[k])groups[k]=[];groups[k].push(it)});
  grid.innerHTML=Object.entries(groups).map(([name,list],gi)=>`
    <div class="group-card" id="group-${gi}">
      <div class="group-head" onclick="toggleGroup(${gi})">
        <div class="group-title"><div class="group-icon">📚</div><div><h3>${esc(name)}</h3></div></div>
        <div style="display:flex;align-items:center;gap:9px"><span class="count">${list.length} soru</span><span class="arrow">▼</span></div>
      </div>
      <div class="question-list">
        ${list.map((it,i)=>`<div class="qa-item" id="qa-${esc(it.id)}">
          <div class="qa-number">SORU ${i+1}</div>
          <div class="qa-question">${esc(it.soru||'Soru')}</div>
          <div class="qa-answer">💡 ${esc(it.cevap||'Cevap girilmedi')}</div>
          <div class="qa-actions"><button class="qa-btn" onclick="toggleAnswer(event,'${esc(it.id)}')">👁️ Cevabı Gör</button><button class="qa-btn delete" onclick="deleteQA(event,'${esc(it.id)}')">🗑️ Sil</button></div>
        </div>`).join('')}
      </div>
    </div>`).join('');
}
function toggleGroup(i){document.getElementById('group-'+i)?.classList.toggle('open')}
function toggleAnswer(e,id){e.stopPropagation();const el=document.getElementById('qa-'+id);if(!el)return;el.classList.toggle('show');const b=el.querySelector('.qa-btn');if(b)b.textContent=el.classList.contains('show')?'🙈 Cevabı Gizle':'👁️ Cevabı Gör'}
async function deleteQA(e,id){e.stopPropagation();if(!confirm('Bu soru-cevap silinsin mi?'))return;try{await bgysDelete('soruCevap',id);await renderOwnKonular()}catch(err){alert('Silinemedi: '+err.message)}}
const modulInfo=bgysModulInfo();document.getElementById('crumbModul').textContent=modulInfo.ad;document.getElementById('crumbModul').href=modulInfo.sayfa;document.getElementById('pageH1').textContent=`${modulInfo.ad} Soru-Cevap`;document.title=`Soru-Cevap — ${modulInfo.ad} — Basamak GYS`;
renderOwnKonular();bgysAutoRefresh(renderOwnKonular);
</script>
</body>
</html>
