<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10243e"><title>Favoriler ve Yanlışlar | Basamak GYS</title>
<style>
:root{--navy:#10243e;--teal:#0e9e97;--bg:#f4f7fb;--muted:#607286;--line:#e0e8ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font:14px/1.6 Arial,sans-serif}.top{background:var(--navy);color:white;padding:15px max(16px,calc((100% - 960px)/2));font-weight:800}.wrap{max-width:960px;margin:auto;padding:20px 14px 45px}.back{color:var(--teal);text-decoration:none;font-weight:700;font-size:13px}.hero,.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:19px;margin-top:14px}.hero{background:linear-gradient(120deg,#10243e,#175365,#087a75);color:white}.hero h1{font-size:clamp(24px,5vw,34px);margin:7px 0}.hero p{color:#d7e6ed;margin:0;font-size:13px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.btn{border:0;border-radius:9px;padding:11px 13px;font-weight:800;cursor:pointer;font-size:12px}.tab{background:#fff;border:1px solid var(--line);color:var(--navy)}.tab.active,.primary{background:var(--teal);color:white}.soft{background:#e8f7f5;color:#087a75}.item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;margin-top:10px}.tiny,.muted{color:var(--muted);font-size:12px}.item h3{font-size:14px;margin:7px 0}.answer{background:#eaf8ef;padding:10px;border-radius:8px;margin-top:9px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.empty{padding:18px;background:#f7f9fc;border-radius:10px;color:var(--muted)}.practice{margin-top:14px;padding-top:8px}.practice-options{display:grid;gap:8px;margin:12px 0}.choice{display:flex;align-items:flex-start;gap:8px;padding:9px;border:1px solid var(--line);border-radius:8px;cursor:pointer}.practice-feedback{margin-top:10px;padding:10px;border-radius:8px}.practice-feedback.good{background:#eaf8ef;color:#17633b}.practice-feedback.bad{background:#fff0ed;color:#a42d20}[hidden]{display:none!important}
</style><script src="db.js?v=20261014-6"></script></head><body><header class="top">Basamak GYS · Favoriler ve Yanlışlar</header><main class="wrap"><a class="back" href="ds-sefligi.html">← Çalışma alanlarına dön</a><section class="hero"><h1>Favoriler ve Yanlışlar</h1><p>Kaydettiğin sorular hesabına özel tutulur. Soru Çöz bölümünde soruyu kontrol ettikten sonra favoriye ekleyebilir veya yanlışlar listene kaydedebilirsin.</p></section><div class="tabs"><button class="btn tab active" data-tab="favori">★ Favorilerim</button><button class="btn tab" data-tab="yanlis">↻ Yanlışlarım</button></div><section class="panel"><div class="actions"><button class="btn soft" id="refresh">Listeyi yenile</button><span id="count" class="muted"></span></div><div id="list"><p class="muted">Kayıtlar yükleniyor…</p></div></section></main>
<script>
const $=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let activeType="favori",records=[];
async function load(){const box=$("list");box.innerHTML='<p class="muted">Yükleniyor…</p>';try{if(typeof bgysGetAll!=="function")throw Error("Veri bağlantısı yok");records=(await bgysGetAll("favorilerYanlislar")).filter(x=>x.type===activeType);$("count").textContent=records.length+" kayıt";box.innerHTML=records.length?records.map(r=>'<article class="item" data-record="'+esc(r.id)+'"><div class="tiny">'+esc(r.topic||"Konu belirtilmemiş")+'</div><h3>'+esc(r.question||"Soru")+'</h3><div class="muted">'+["A","B","C","D"].map(k=>r.options?.[k]?'<div><b>'+k+')</b> '+esc(r.options[k])+'</div>':"").join("")+'</div><div class="answer"><b>Doğru cevap:</b> '+esc(r.answer||"—")+') '+esc(r.options?.[r.answer]||"")+(r.userAnswer?'<br><b>Önceki cevabın:</b> '+esc(r.userAnswer):"")+'<br>'+esc(r.explanation||"")+'</div><div class="actions"><button class="btn primary" data-practice="'+esc(r.id)+'">Tekrar çöz</button><button class="btn soft" data-remove="'+esc(r.id)+'">Listeden kaldır</button></div><div class="practice" data-practice-panel="'+esc(r.id)+'" hidden><hr><b>Şimdi cevabını seç:</b><div class="practice-options">'+["A","B","C","D"].map(k=>r.options?.[k]?'<label class="choice"><input type="radio" name="practice-'+esc(r.id)+'" value="'+k+'"> <b>'+k+')</b> '+esc(r.options[k])+'</label>':"").join("")+'</div><button class="btn primary" data-check="'+esc(r.id)+'">Cevabı kontrol et</button><div class="practice-feedback" data-feedback="'+esc(r.id)+'" aria-live="polite"></div></div></article>').join(""):'<div class="empty">Bu listede henüz kayıt yok. Soru Çöz bölümünde bir soruyu kontrol ettikten sonra favoriye ekleyebilir veya yanlışlar listene kaydedebilirsin.</div>';}catch(e){box.innerHTML='<div class="empty">Kayıtlar yüklenemedi. Hesap girişini ve Firebase güvenlik kurallarının yayımlandığını kontrol et.</div>';console.error(e);}}
document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{activeType=b.dataset.tab;document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));load();}));
$("refresh").addEventListener("click",load);$("list").addEventListener("click",async e=>{const practice=e.target.closest("[data-practice]");if(practice){const panel=$("list").querySelector('[data-practice-panel="'+practice.dataset.practice+'"]');if(panel)panel.hidden=!panel.hidden;return;}const check=e.target.closest("[data-check]");if(check){const rec=records.find(x=>String(x.id)===check.dataset.check);const card=check.closest(".item");const selected=card?.querySelector('input[name="practice-'+check.dataset.check+'"]:checked');const feedback=card?.querySelector('[data-feedback="'+check.dataset.check+'"]');if(!selected){feedback.className="practice-feedback bad";feedback.textContent="Önce A, B, C veya D seçeneklerinden birini seç.";return;}const correct=String(rec?.answer||"").trim().toUpperCase();const ok=selected.value===correct;feedback.className="practice-feedback "+(ok?"good":"bad");feedback.innerHTML=(ok?"✓ Doğru cevap!":"✗ Yanlış cevap.")+'<br><b>Doğru cevap: '+esc(correct)+')</b> '+esc(rec?.options?.[correct]||"")+(rec?.explanation?'<br>'+esc(rec.explanation):"");return;}const b=e.target.closest("[data-remove]");if(!b)return;try{await bgysDelete("favorilerYanlislar",b.dataset.remove);await load();}catch(err){alert("Kayıt kaldırılamadı.");}});</script><script>bgysRequireAuth();</script></body></html>
