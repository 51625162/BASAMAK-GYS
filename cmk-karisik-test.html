:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#18324d;background:#f3f7fb}*{box-sizing:border-box}body{margin:0}.top{background:#10243e;color:white;padding:16px max(16px,calc((100% - 760px)/2));font-weight:800}.wrap{max-width:760px;margin:auto;padding:22px 14px 48px}.panel{background:#fff;border:1px solid #d8e3ee;border-radius:18px;padding:22px;box-shadow:0 6px 24px #16395b0a}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;color:#087f78}.muted{color:#60758a}.bar{height:7px;background:#e6edf5;border-radius:10px;overflow:hidden;margin:16px 0}.bar span{display:block;height:100%;background:#109b91;width:0}.question{font-size:20px;line-height:1.5;margin:18px 0}.option{display:flex;align-items:flex-start;gap:10px;padding:14px;margin:10px 0;border:1px solid #cfdae6;border-radius:12px;cursor:pointer;line-height:1.45}.option:has(input:checked){border-color:#0e9e97;background:#eaf8f6}.option input{margin-top:4px;accent-color:#0e9e97}.btn{display:block;width:100%;border:0;border-radius:12px;background:#109b91;color:#fff;font-size:16px;font-weight:800;padding:16px;margin-top:18px;cursor:pointer}.btn.secondary{background:#e7f1fa;color:#17466c}.feedback{padding:14px;border-radius:12px;margin-top:14px;line-height:1.6}.good{background:#e6f7ed;color:#175a38}.bad{background:#fff0ed;color:#8b2f23}.hidden{display:none!important}small{color:#61758a}@media(max-width:520px){.panel{padding:17px}.question{font-size:18px}}
</style></head><body><header class="top">Basamak GYS · 5271 Sayılı CMK</header><main class="wrap"><section class="panel"><div class="eyebrow">KARIŞIK SORU ÇÖZ</div><h1>5271 Sayılı Ceza Muhakemesi Kanunu</h1><p class="muted">25 soruluk karışık test · Dört seçenekli sınav pratiği</p><div class="bar"><span id="bar"></span></div><div id="quiz"></div><div id="feedback" class="feedback hidden"></div><button id="action" class="btn">Teste başla</button><button id="restart" class="btn secondary hidden">Testi yeniden başlat</button></section></main>
<script>
const questions=[{"id":"cmk5271-mixed-001","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Madde 2","question":"I. Soruşturma evresinde suç şüphesi altındaki kişi şüphelidir.\nII. Kovuşturmanın başlamasından hükmün kesinleşmesine kadar suç şüphesi altındaki kişi sanıktır.\nIII. Müdafi, mağdurun vekilidir.\nYukarıdaki ifadelerden hangileri doğrudur?","options":{"A":"Yalnız I","B":"I ve II","C":"II ve III","D":"I, II ve III"},"answer":"B","explanation":"CMK m. 2’ye göre I ve II doğrudur. Müdafi şüpheli veya sanığın savunmasını üstlenen avukattır; mağdurun avukatı vekildir."},{"id":"cmk5271-mixed-002","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Madde 3","question":"Ceza muhakemesinde görevli mahkemelerin görev ve yetkileri bakımından aşağıdaki ifadelerden hangisi doğrudur?","options":{"A":"Görev kuralları yalnız tarafların anlaşmasıyla belirlenir","B":"Görev kuralları sadece savcının takdirine bağlıdır","C":"Mahkemelerin görevleri kanunla belirlenir","D":"Görev kuralları yalnız kolluk tarafından belirlenir"},"answer":"C","explanation":"Mahkemelerin görev alanı kanuni düzenlemeye dayanır; tarafların veya kolluğun takdiriyle değiştirilemez."},{"id":"cmk5271-mixed-003","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Madde 8","question":"Bir kişinin birden fazla suçtan sanık olması veya bir suçta birden fazla sanık bulunması nedeniyle davalar arasında bağlantı bulunması hâlinde aşağıdaki kavramlardan hangisi gündeme gelir?","options":{"A":"Bağlantı","B":"İnfaz","C":"Uzlaştırma","D":"Hükmün açıklanmasının geri bırakılması"},"answer":"A","explanation":"CMK’nın bağlantıya ilişkin hükümleri, davalar arasındaki maddi veya hukuki bağlantının sonuçlarını düzenler."},{"id":"cmk5271-mixed-004","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Madde 12","question":"Yetkili mahkemenin belirlenmesinde genel kural olarak aşağıdakilerden hangisi esas alınır?","options":{"A":"Şüphelinin nüfusa kayıtlı olduğu yer","B":"Mağdurun doğduğu yer","C":"Kolluk biriminin bulunduğu yer","D":"Suçun işlendiği yer"},"answer":"D","explanation":"CMK m. 12’de genel yetki kuralı suçun işlendiği yer mahkemesi üzerinden düzenlenir."},{"id":"cmk5271-mixed-005","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Madde 20","question":"Bir hâkim veya mahkeme, hukuki ya da fiilî nedenlerle görevini yapamayacak hâle gelirse hangi kurum gündeme gelebilir?","options":{"A":"İdari para cezası","B":"Mahkemenin davadan çekilmesi veya görev yapamaması nedeniyle kanuni çözüm","C":"Otomatik beraat","D":"Kovuşturmanın kendiliğinden düşmesi"},"answer":"B","explanation":"CMK’nın hâkim ve mahkemenin görev yapamaması hâllerine ilişkin hükümleri uygulanır; bu durum kendiliğinden beraat veya düşme doğurmaz."},{"id":"cmk5271-mixed-006","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Madde 34","question":"Hâkim ve mahkemelerin her türlü kararı için genel olarak aşağıdakilerden hangisi aranır?","options":{"A":"Gerekçeli olması","B":"Yalnız sözlü açıklama yapılması","C":"Tarafların oybirliği","D":"Kolluk amirinin onayı"},"answer":"A","explanation":"CMK m. 34, hâkim ve mahkeme kararlarının gerekçeli olmasını düzenler."},{"id":"cmk5271-mixed-007","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Madde 35","question":"Bir kararın ilgilisine açıklanması veya tebliği bakımından aşağıdaki ifadelerden hangisi doğrudur?","options":{"A":"Her karar yalnız sosyal medyada duyurulur","B":"Tebliğ hiçbir durumda gerekmez","C":"Kararın açıklanması ve tebliği kanundaki usule göre yapılır","D":"Kararı sadece kolluk tebliğ edebilir"},"answer":"C","explanation":"Kararların açıklanması ve tebliği CMK’daki usul hükümlerine tabidir."},{"id":"cmk5271-mixed-008","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Madde 43","question":"Tanığın çağrılması bakımından aşağıdakilerden hangisi temel usule uygundur?","options":{"A":"Tanık yalnız telefon mesajıyla çağrılabilir ve başka usul uygulanamaz","B":"Tanığın çağrılması kanundaki çağrı ve tebligat hükümlerine göre yapılır","C":"Tanık hiçbir zaman zorla getirilemez","D":"Tanığın çağrılmasına yalnız sanık karar verir"},"answer":"B","explanation":"Tanık çağrısı ve çağrıya uymamanın sonuçları CMK’nın tanıklığa ilişkin hükümlerinde düzenlenir."},{"id":"cmk5271-mixed-009","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Madde 63","question":"Çözümü uzmanlığı, özel veya teknik bilgiyi gerektiren hâllerde başvurulan kişi kimdir?","options":{"A":"Katılan","B":"Müdafi","C":"Zabıt kâtibi","D":"Bilirkişi"},"answer":"D","explanation":"Bilirkişiye, çözümü uzmanlığı veya özel/teknik bilgiyi gerektiren konularda başvurulur."},{"id":"cmk5271-mixed-010","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Madde 75","question":"Şüpheli veya sanık üzerinde beden muayenesi ve vücuttan örnek alınması tedbirleri bakımından aşağıdakilerden hangisi doğrudur?","options":{"A":"Tedbirler CMK’da belirtilen koşul ve usullere tabidir","B":"Her durumda herhangi bir koşul olmaksızın yapılır","C":"Sadece mağdurun izniyle yapılabilir","D":"Mahkeme kararı hiçbir zaman aranmaz"},"answer":"A","explanation":"Beden muayenesi ve örnek alınması, CMK’nın ilgili maddelerindeki şartlar ve karar usulleri çerçevesinde uygulanır."},{"id":"cmk5271-mixed-011","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Madde 90","question":"Suçüstü hâlinde yakalama yetkisiyle ilgili aşağıdaki ifadelerden hangisi doğrudur?","options":{"A":"Yakalama yalnız kesinleşmiş hapis cezasında mümkündür","B":"Suçüstü hâlinde kimse yakalanamaz","C":"Kanunda belirtilen koşullarda herkes geçici yakalama yapabilir","D":"Yakalama yalnız bilirkişinin yetkisindedir"},"answer":"C","explanation":"CMK m. 90, suçüstü hâlleri dâhil yakalama yetkisini ve koşullarını düzenler."},{"id":"cmk5271-mixed-012","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Madde 91","question":"Gözaltı süresi ve gözaltı kararına ilişkin aşağıdakilerden hangisi doğrudur?","options":{"A":"Gözaltı süresi sınırsızdır","B":"Gözaltı, kanunda öngörülen şart ve süre sınırlarına tabidir","C":"Gözaltı kararını yalnız mağdur verir","D":"Gözaltı her olayda otomatik olarak dört gündür"},"answer":"B","explanation":"Gözaltı tedbiri ve süresi CMK m. 91’de düzenlenir; somut olay ve kanuni istisnalar dikkate alınmalıdır."},{"id":"cmk5271-mixed-013","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Madde 100","question":"Tutuklama için aşağıdakilerden hangisi temel koşullardandır?","options":{"A":"Yalnız ihbar yapılmış olması","B":"Şüphelinin sabıkasız olması","C":"Mağdurun talepte bulunması tek başına","D":"Kuvvetli suç şüphesini gösteren somut deliller ve tutuklama nedeni"},"answer":"D","explanation":"CMK m. 100, kuvvetli suç şüphesini gösteren somut delillerin ve tutuklama nedeninin bulunmasını arar; ölçülülük de gözetilir."},{"id":"cmk5271-mixed-014","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Madde 109","question":"Tutuklama yerine uygulanabilen adli kontrol tedbiri hangi maddede düzenlenmiştir?","options":{"A":"CMK m. 109","B":"CMK m. 2","C":"CMK m. 34","D":"CMK m. 185"},"answer":"A","explanation":"Adli kontrol, CMK’nın 109. maddesinde düzenlenmiştir."},{"id":"cmk5271-mixed-015","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Madde 116","question":"Şüpheli veya sanığın yakalanabileceği ya da suç delillerinin elde edilebileceği hususunda makul şüphe varsa hangi koruma tedbiri gündeme gelebilir?","options":{"A":"Hükmün açıklanması","B":"Uzlaştırma","C":"Arama","D":"Beraat"},"answer":"C","explanation":"CMK m. 116, şüpheli veya sanığın yakalanabileceği ya da suç delillerinin elde edilebileceği hususunda makul şüphe hâlinde aramayı düzenler."},{"id":"cmk5271-mixed-016","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Madde 127","question":"Elkoyma işlemiyle ilgili aşağıdakilerden hangisi doğrudur?","options":{"A":"Elkoyma, hiçbir koşula bağlı olmayan idari bir işlemdir","B":"Elkoyma CMK’da düzenlenen karar, uygulama ve hâkim onayı kurallarına tabidir","C":"Elkoyma yalnız sanığın rızasıyla yapılabilir","D":"Elkoyma sadece hüküm kesinleştikten sonra uygulanır"},"answer":"B","explanation":"Elkoyma, CMK m. 123 ve devamındaki hükümler çerçevesinde uygulanır; ilgili hâkim kararı/onayı koşulları gözetilir."},{"id":"cmk5271-mixed-017","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Madde 135","question":"Telekomünikasyon yoluyla iletişimin denetlenmesi tedbiri hangi maddede düzenlenmiştir?","options":{"A":"CMK m. 43","B":"CMK m. 75","C":"CMK m. 100","D":"CMK m. 135"},"answer":"D","explanation":"İletişimin denetlenmesi, CMK m. 135 ve devamındaki ilgili hükümler kapsamında düzenlenir."},{"id":"cmk5271-mixed-018","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Madde 147","question":"İfade veya sorgu sırasında şüpheli ya da sanığa hangi hak özellikle bildirilmelidir?","options":{"A":"Susma hakkı ve müdafi yardımından yararlanma hakkı","B":"Tanığın mesleğini seçme hakkı","C":"Mahkemenin yerini değiştirme hakkı","D":"Bilirkişiyi tek başına atama hakkı"},"answer":"A","explanation":"CMK m. 147, ifade ve sorguda şüpheli/sanığın haklarının bildirilmesini; susma ve müdafi yardımından yararlanma haklarını da kapsar."},{"id":"cmk5271-mixed-019","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Madde 170","question":"Cumhuriyet savcısı, soruşturma sonunda kamu davası açılması için yeterli şüpheye ulaştığında genel olarak hangi belgeyi düzenler?","options":{"A":"Bilirkişi raporu","B":"İnfaz emri","C":"İddianame","D":"Tebligat mazbatası"},"answer":"C","explanation":"CMK m. 170, iddianamenin düzenlenmesini ve içeriğini düzenler."},{"id":"cmk5271-mixed-020","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Madde 174","question":"Mahkeme, iddianamenin iadesi bakımından aşağıdakilerden hangisini yapabilir?","options":{"A":"İddianameyi hiçbir inceleme yapmadan her durumda kabul etmek zorundadır","B":"Kanunda belirtilen eksiklik veya aykırılıklar varsa iddianameyi iade edebilir","C":"İddianameyi yalnız mağdurun onayıyla kabul eder","D":"İddianameyi doğrudan infaz eder"},"answer":"B","explanation":"CMK m. 174, iddianamenin iadesi nedenlerini ve usulünü düzenler."},{"id":"cmk5271-mixed-021","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Madde 185","question":"Sanığın on sekiz yaşını doldurmamış olması hâlinde duruşmanın açıklığı bakımından hangi özel kural uygulanır?","options":{"A":"Duruşma mutlaka televizyonla yayımlanır","B":"Duruşma her durumda herkese açık yapılır","C":"Duruşma yalnız kolluğa açık yapılır","D":"Duruşmanın kapalı yapılmasına ilişkin özel kural uygulanır"},"answer":"D","explanation":"CMK m. 185, sanık on sekiz yaşını doldurmamışsa duruşmanın kapalı yapılmasını öngören özel düzenlemeyi içerir."},{"id":"cmk5271-mixed-022","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Madde 206","question":"Duruşmada ortaya konulan delilin reddedilmesi bakımından aşağıdakilerden hangisi doğrudur?","options":{"A":"Kanunda belirtilen ret nedenleri varsa delilin ortaya konulması reddedilebilir","B":"Her delil hiçbir inceleme yapılmadan kabul edilir","C":"Delile yalnız sanık karar verir","D":"Deliller yalnız hüküm kesinleştikten sonra sunulur"},"answer":"A","explanation":"CMK m. 206, delillerin ortaya konulmasının reddedilebileceği hâlleri düzenler."},{"id":"cmk5271-mixed-023","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Madde 223","question":"Yüklenen suçun sanık tarafından işlendiğinin sabit olmaması hâlinde hangi hüküm verilebilir?","options":{"A":"Tutuklama","B":"İddianamenin iadesi","C":"Beraat","D":"Yakalama"},"answer":"C","explanation":"CMK m. 223 kapsamında, yüklenen suçun sanık tarafından işlendiğinin sabit olmaması beraat nedenleri arasındadır."},{"id":"cmk5271-mixed-024","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Madde 267","question":"Hâkim kararları ile kanunun gösterdiği hâllerde mahkeme kararlarına karşı başvurulan olağan kanun yolu hangisidir?","options":{"A":"Temyiz","B":"İtiraz","C":"Yargılamanın yenilenmesi","D":"Kanun yararına bozma"},"answer":"B","explanation":"CMK m. 267 ve devamında itiraz kanun yolu düzenlenir."},{"id":"cmk5271-mixed-025","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Madde 308","question":"Yargıtay Cumhuriyet Başsavcısının itiraz yetkisi hangi maddede düzenlenmiştir?","options":{"A":"CMK m. 100","B":"CMK m. 170","C":"CMK m. 267","D":"CMK m. 308"},"answer":"D","explanation":"CMK m. 308, Yargıtay Cumhuriyet Başsavcısının itirazını düzenler."}];
const quiz=document.getElementById("quiz"),feedback=document.getElementById("feedback"),action=document.getElementById("action"),restart=document.getElementById("restart"),bar=document.getElementById("bar");
let index=0,correct=0,answered=false,started=false;
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function render(){
 feedback.className="feedback hidden";feedback.innerHTML="";
 if(index>=questions.length){quiz.innerHTML='<h2>Test tamamlandı</h2><p>Doğru: <b>'+correct+'</b> · Yanlış: <b>'+(questions.length-correct)+'</b></p><p>Başarı oranı: <b>'+Math.round(correct/questions.length*100)+'%</b></p>';bar.style.width="100%";action.classList.add("hidden");restart.classList.remove("hidden");return;}
 const q=questions[index];answered=false;bar.style.width=(index/questions.length*100)+"%";
 quiz.innerHTML='<small>Soru '+(index+1)+' / '+questions.length+' · '+esc(q.topic)+'</small><div class="question">'+esc(q.question).replace(/\n/g,"<br>")+'</div>'+["A","B","C","D"].map(k=>'<label class="option"><input type="radio" name="answer" value="'+k+'"><span><b>'+k+'.</b> '+esc(q.options[k])+'</span></label>').join("");
 action.textContent="Cevabı kontrol et";action.classList.remove("hidden");
}
action.addEventListener("click",()=>{
 if(index>=questions.length)return;
 if(!started){started=true;render();return;}
 if(!answered){const pick=quiz.querySelector('input[name="answer"]:checked');if(!pick){feedback.className="feedback bad";feedback.textContent="Devam etmeden önce bir seçenek işaretle.";return;}
 const q=questions[index],ok=pick.value===q.answer;answered=true;if(ok)correct++;
 feedback.className="feedback "+(ok?"good":"bad");feedback.innerHTML=(ok?"Doğru cevap!":"Yanlış cevap. Doğru cevap: "+q.answer)+"<br>"+esc(q.explanation);
 action.textContent=index===questions.length-1?"Sonucu gör":"Sonraki soru";return;}
 index++;render();
});
restart.addEventListener("click",()=>{index=0;correct=0;answered=false;started=true;restart.classList.add("hidden");action.classList.remove("hidden");render();});
</script></body></html>
