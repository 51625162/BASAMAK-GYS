<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#122943"><title>Basamak GYS · CMK Karışık Test</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#18334d;font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:960px;margin:0 auto;padding:20px 16px 48px}.back{display:inline-block;color:#1767c8;text-decoration:none;font-weight:700;margin:4px 0 16px}.panel{background:#fff;border:1px solid #e0e8f1;border-radius:20px;padding:clamp(18px,4vw,32px);box-shadow:0 10px 28px #1229430c}.top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#55738f}.title{font-size:clamp(22px,4vw,30px);line-height:1.2;margin:5px 0 8px;color:#122943}.sub{margin:0;color:#61778b;font-size:14px}.finish{border:0;border-radius:12px;padding:11px 15px;background:#e45151;color:#fff;font-weight:800;cursor:pointer}.track{height:8px;background:#e8eef5;border-radius:20px;overflow:hidden;margin:22px 0 12px}.track span{display:block;height:100%;width:0;background:#1674e8;transition:width .2s}.meta{font-size:13px;color:#637b92;margin-bottom:12px}.topic{display:inline-block;background:#eaf4ff;color:#205b9a;padding:5px 10px;border-radius:9px;font-size:12px;font-weight:800;margin-bottom:12px}.question{font-size:clamp(18px,2.5vw,22px);line-height:1.55;font-weight:750;margin:4px 0 20px;white-space:pre-line}.options{display:grid;gap:10px}.option{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1px solid #dbe5ef;border-radius:13px;cursor:pointer}.option:hover{border-color:#8dbaf0;background:#f8fbff}.option input{margin-top:5px;accent-color:#176fe5;flex:0 0 auto}.letter{font-weight:900;color:#1767c8;min-width:22px}.option.correct{border-color:#15945c;background:#effaf4}.option.wrong{border-color:#d94a4a;background:#fff4f4}.feedback{display:none;margin-top:14px;border-radius:12px;padding:14px;background:#f1f6fb;border:1px solid #dce7f1}.feedback.show{display:block}.feedback strong{display:block;margin-bottom:4px}.controls{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px;margin-top:18px}.btn{border:1px solid #d6e2ee;background:#fff;border-radius:12px;min-height:46px;padding:10px 14px;color:#1c456b;font-weight:800;cursor:pointer}.btn.primary{background:#176fe5;border-color:#176fe5;color:#fff}.btn:disabled{opacity:.4;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:7px;margin-top:24px}.num{border:1px solid #dbe5ef;background:#fff;border-radius:9px;min-height:36px;font-weight:750;color:#536e87;cursor:pointer}.num.active{background:#176fe5;color:#fff;border-color:#176fe5}.num.done{box-shadow:inset 0 -3px #1d9c65}.hint{color:#6a8094;font-size:12px;margin:12px 0 0}.result{display:none;margin-top:22px;padding:22px;border-radius:16px;background:#eff6ff;border:1px solid #cfe2fb}.result.show{display:block}.score{font-size:34px;font-weight:900;color:#145ab0}.restart{margin-top:12px}@media(max-width:560px){.wrap{padding:12px 10px 30px}.panel{border-radius:16px;padding:16px}.top{gap:8px}.finish{padding:9px 10px;font-size:13px}.grid{grid-template-columns:repeat(5,minmax(0,1fr))}.controls{grid-template-columns:1fr 1fr}.controls .show-answer{grid-column:1/-1;grid-row:1}.question{font-size:18px}.option{padding:12px;gap:8px}}
#options{display:grid!important;visibility:visible!important;opacity:1!important;height:auto!important;overflow:visible!important}#options .option{display:flex!important;visibility:visible!important;opacity:1!important}#feedback.show{display:block;position:relative;z-index:1}</style></head><body><main class="wrap"><a class="back" href="soru-coz.html">← Soru Çöz bölümüne dön</a><section class="panel"><div class="top"><div><div class="eyebrow">5271 Sayılı Ceza Muhakemesi Kanunu</div><h1 class="title">CMK Karışık Test</h1><p class="sub">450 sınav formatında soru · dört seçenek · gerekçeli cevaplar · <a href="https://www.mevzuat.gov.tr/mevzuatmetin/1.5.5271.pdf" target="_blank" rel="noopener">5271 sayılı Kanun PDF kaynağını aç</a></p></div><button class="finish" id="finish">Testi bitir</button></div><div class="track"><span id="progress"></span></div><div class="meta" id="meta"></div><div id="topic" class="topic"></div><div id="question" class="question"></div><div id="options" class="options"></div><div id="feedback" class="feedback"></div><div class="controls"><button class="btn" id="prev">← Önceki</button><button class="btn show-answer" id="show">Cevabı göster +</button><button class="btn primary" id="next">Sonraki →</button></div><div class="grid" id="grid" aria-label="Soru seçimi"></div><p class="hint">Cevabı işaretle, açıklamayı aç ve numara kutularıyla sorular arasında geçiş yap. Testi bitirerek sonucunu görebilirsin.</p><div class="result" id="result"></div></section></main>
<script>
const questions=[{"id":"cmk5271-mixed-pdf-001","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tanımlar · m.2","question":"Savcı suç şüphesini öğrenmiş, delilleri toplamış ve iddianameyi mahkemeye sunmuştur. Mahkeme henüz iddianameyi kabul etmemiştir. Kişinin sıfatı ve muhakeme evresi bakımından hangisi doğrudur?","options":{"A":"Kişi şüphelidir; soruşturma iddianamenin kabulüne kadar sürer.","B":"Kişi sanıktır; kovuşturma iddianamenin düzenlenmesiyle başlar.","C":"Kişi hükümlüdür; kovuşturma hükmün kesinleşmesiyle başlar.","D":"Kişi mağdurdur; soruşturma ilk duruşmada sona erer."},"answer":"A","explanation":"CMK m.2'ye göre şüpheli soruşturma evresinde suç şüphesi altındaki kişidir. Soruşturma iddianamenin kabulüne kadar sürer; kovuşturma kabul ile başlar.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-002","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Görev · m.4-7","question":"İddianame kabul edildikten sonra mahkeme, duruşmada yalnız suçun hukuki niteliğinin değiştiğini belirterek dosyayı alt dereceli mahkemeye göndermek istemektedir. Hangisi doğrudur?","options":{"A":"Mahkeme görev konusunu yalnız taraflar isterse inceler.","B":"Mahkeme kovuşturmanın her aşamasında görevini re'sen değerlendirebilir; ancak yalnız hukuki nitelik değişikliğiyle dosyayı alt mahkemeye gönderemez.","C":"Görevli olmayan mahkemenin tüm işlemleri her durumda geçerlidir.","D":"Görevsizlik kararına karşı kanun yolu yoktur."},"answer":"B","explanation":"CMK m.4 görev konusunun kovuşturmanın her aşamasında re'sen değerlendirilmesini; m.6 ise duruşmada suçun hukuki niteliğinin değişmesi nedeniyle alt mahkemeye gönderme yapılamamasını düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-003","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Yetki · m.12-13","question":"Suçun işlendiği yer belirlenememiştir. Şüpheli Türkiye'de yakalanmıştır ve Türkiye'de yerleşim yeri yoktur. CMK m.13'e göre öncelikle hangi yer mahkemesi yetkilidir?","options":{"A":"Her durumda Ankara mahkemesi","B":"İlk ihbarın yapıldığı yer","C":"Şüphelinin yakalandığı yer mahkemesi","D":"Mağdurun seçtiği yer"},"answer":"C","explanation":"CMK m.13/1'e göre suçun işlendiği yer belli değilse öncelikle yakalandığı yer mahkemesi yetkilidir; yakalanmamışsa yerleşim yeri esas alınır.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-004","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Hâkimin reddi · m.25, 31","question":"Sanık, tarafsızlığı şüpheye düşüren olguyu duruşma başladıktan sonra öğrenmiş ve ret istemini sebebi öğrendiği tarihten itibaren sekizinci gün yapmıştır. Hangisi doğrudur?","options":{"A":"Ret istemi her zaman kabul edilir.","B":"Ret istemini yalnız savcı yapabilir.","C":"Sonradan öğrenilen sebeplerde süre sınırlaması yoktur.","D":"Sonradan öğrenilen sebep için yedi günlük süre öngörüldüğünden istem süresinde değildir ve kanuni koşullarla geri çevrilebilir."},"answer":"D","explanation":"CMK m.25/2, sonradan öğrenilen ret sebebi için öğrenmeden itibaren yedi gün içinde başvuru yapılmasını öngörür. Süreye uyulmaması m.31 kapsamında geri çevirme nedeni olabilir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-005","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Sürelerin hesaplanması · m.39","question":"Bir karar tebliğ edilmiştir. Günle belirlenen sürelerin başlaması ve son günün tatile rastlaması hakkında hangi ifade doğrudur?","options":{"A":"Süre tebliği izleyen gün işlemeye başlar; son gün tatile rastlarsa tatili izleyen gün sona erer.","B":"Süre tebliğ anında başlar ve tatiller her zaman düşülür.","C":"Süre karar kesinleşince başlar.","D":"Süre yalnız ilk iş gününde başlar ve son gün değişmez."},"answer":"A","explanation":"CMK m.39/1'e göre günle belirlenen süreler tebliğ gününü izleyen gün işlemeye başlar. Son gün tatile rastlarsa süre tatilin ertesi günü biter.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-006","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tanıklıktan çekinme · m.45","question":"Sanığın kardeşi tanık olarak dinlenirken çekinme hakkını kullanmak istediğini açıklamıştır. CMK'ye göre hangisi doğrudur?","options":{"A":"Kardeşler hiçbir koşulda çekinemez.","B":"Kanundaki hısımlık kapsamında çekinme hakkı vardır; kişi dinlenirken de bu hakkını kullanabilir.","C":"Tanıklığa başladıktan sonra çekinme hakkı sona erer.","D":"Hak yalnız yargılama bittikten sonra kullanılır."},"answer":"B","explanation":"CMK m.45/1, üçüncü derece dâhil kan hısımlarına tanıklıktan çekinme hakkı tanır. m.45/3 uyarınca kişi dinlenirken de her zaman çekinebilir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-007","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Bilirkişi · m.63","question":"Mahkeme, yalnız genel bilgiyle ve hâkimlik mesleğinin gerektirdiği hukuk bilgisiyle çözülebilecek bir konuda bilirkişi atanmasını istemektedir. Hangisi doğrudur?","options":{"A":"Bilirkişi her uyuşmazlıkta zorunludur.","B":"Bilirkişi raporu hâkimin hukuki değerlendirmesinin yerini alır.","C":"Bu nitelikteki konularda bilirkişiye başvurulamaz.","D":"Taraf isterse mutlaka bilirkişi atanır."},"answer":"C","explanation":"CMK m.63'e göre bilirkişiye uzmanlık, özel veya teknik bilgi gereken hâllerde başvurulur; genel bilgi veya hâkimlik mesleğinin gerektirdiği hukuk bilgisiyle çözülebilen konularda başvurulamaz.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-008","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Bilirkişi süresi · m.66","question":"Bilirkişiye üç aylık inceleme süresi verilmiştir. Özel sebepler nedeniyle ek süre istemektedir. CMK m.66'ya göre hangisi doğrudur?","options":{"A":"Süre altı aydır ve uzatılamaz.","B":"Süre bilirkişinin talebiyle otomatik uzar.","C":"Rapor gecikirse dava kendiliğinden düşer.","D":"Bilirkişinin istemi üzerine atayan merciin gerekçeli kararıyla en çok üç ay ek süre verilebilir."},"answer":"D","explanation":"CMK m.66/1'e göre süre kural olarak üç ayı geçemez; özel sebepler zorunlu kıldığında gerekçeli kararla en çok üç ay uzatılabilir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-009","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Gözlem altına alma · m.74","question":"Şüphelinin akıl hastalığı ve bunun davranışlarına etkisi araştırılacaktır. Soruşturmada karar mercii ve süre bakımından hangisi doğrudur?","options":{"A":"Uzman hekim önerisi ve savcı ile müdafi dinlendikten sonra sulh ceza hâkimi karar verebilir; ilk süre üç hafta, toplam süre en çok üç aydır.","B":"Kolluk amiri karar verir; süre sınırsızdır.","C":"Yalnız ağır ceza mahkemesi karar verir; ilk süre altı aydır.","D":"Müdafiin dinlenmesi yasaktır."},"answer":"A","explanation":"CMK m.74'e göre soruşturmada sulh ceza hâkimi, kovuşturmada mahkeme karar verir. İlk gözlem süresi üç haftayı geçemez; ek sürelerle toplam süre üç ayı aşamaz.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-010","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Yakalama · m.90","question":"Gecikmesinde sakınca bulunan ve yakalama emri düzenlenmesini gerektiren bir hâlde kolluk görevlisi savcıya veya amirine derhâl ulaşamamaktadır. Hangisi doğrudur?","options":{"A":"Kolluk hiçbir durumda yakalama yapamaz.","B":"Kanuni koşullar varsa kolluk görevlisi yakalama yetkisini kullanabilir.","C":"Yakalama yalnız mağdurun yazılı talebiyle olur.","D":"Kişi yalnız kesinleşmiş mahkûmiyetle yakalanır."},"answer":"B","explanation":"CMK m.90/2, gecikmesinde sakınca bulunan hâllerde savcıya veya amire derhâl başvurma olanağı yoksa kolluğa yakalama yetkisi tanır.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-011","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tutuklama · m.100","question":"Dosyada kuvvetli suç şüphesini gösteren somut deliller bulunduğu ileri sürülmekte; ancak herhangi bir tutuklama nedeni gösterilememektedir. Hangisi doğrudur?","options":{"A":"Suç şüphesi tek başına her durumda yeterlidir.","B":"Katalog suç isnadı varsa diğer koşullar incelenmez.","C":"Somut deliller yanında tutuklama nedeni bulunmalı ve tedbir ölçülü olmalıdır.","D":"Tutuklama kararını kolluk verir."},"answer":"C","explanation":"CMK m.100/1, kuvvetli suç şüphesini gösteren somut delillerin yanında bir tutuklama nedeni bulunmasını ve ölçülülüğü arar.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-012","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Adli kontrolün ihlali · m.112","question":"Şüpheli, adli kontrol kapsamında belirlenen yere başvurma yükümlülüğünü mazeretsiz ve isteyerek yerine getirmemiştir. Hangisi gündeme gelebilir?","options":{"A":"Kamu davası kendiliğinden düşer.","B":"Şüpheli otomatik beraat eder.","C":"Adli kontrol kesin hükme dönüşür.","D":"Yetkili yargı mercii, hükmedilebilecek hapis cezasının süresine bakılmaksızın tutuklama kararı verebilir."},"answer":"D","explanation":"CMK m.112/1'e göre adli kontrol hükümlerini isteyerek yerine getirmeyen kişi hakkında, hükmedilebilecek hapis cezasının süresine bakılmaksızın tutuklama kararı verilebilir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-013","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Arama · m.119","question":"Kolluk, gecikmesinde sakınca olduğunu ileri sürerek konutta arama yapmak istemektedir. Savcıya ulaşılabilmektedir; kolluk amiri de yazılı emir vermek istemektedir. Hangisi doğrudur?","options":{"A":"Konutta arama hâkim kararı veya gecikmede sakınca varsa savcının yazılı emriyle yapılabilir; kolluk amirinin emri yeterli değildir.","B":"Konutta arama her zaman kolluk amirinin sözlü emriyle yapılır.","C":"Arama için hâkim kararı verilemez.","D":"Karar veya emirde aranacak yerin belirtilmesi gerekmez."},"answer":"A","explanation":"CMK m.119/1'e göre konut, işyeri ve kamuya açık olmayan kapalı alanlarda hâkim kararı veya gecikmede sakınca varsa savcının yazılı emri gerekir; kolluk amirinin emri yeterli değildir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-014","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · El koyma · m.127","question":"Hâkim kararı olmaksızın yapılan el koyma işlemi 10.00'da gerçekleştirilmiştir. Kanuni sürelerde hâkim onayı alınmazsa hangi kural uygulanır?","options":{"A":"El koyma yedi gün sonra kalkar.","B":"İşlem 24 saat içinde hâkim onayına sunulur; hâkim 48 saat içinde kararını açıklamazsa el koyma kendiliğinden kalkar.","C":"Hâkim onayı hiçbir zaman gerekmez.","D":"El koyma yalnız sanığın rızasıyla sona erer."},"answer":"B","explanation":"CMK m.127/3'e göre hâkim kararı olmadan yapılan el koyma 24 saat içinde hâkim onayına sunulur; hâkim 48 saat içinde kararını açıklamazsa el koyma kendiliğinden kalkar.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-015","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İfade alma · m.147","question":"Şüpheliye isnat edilen suç anlatılmış, ancak susma hakkı ile lehine somut delil toplanmasını isteme imkânı hatırlatılmamıştır. Hangisi doğrudur?","options":{"A":"Bu haklar yalnız hükümden sonra bildirilir.","B":"Şüphelinin ifade sırasında usul güvencesi yoktur.","C":"Susma hakkı ve lehine delil toplanmasını isteme olanağı ifade alma sırasında bildirilmesi gereken güvencelerdendir.","D":"Kimlik dışında hiçbir soru sorulamaz."},"answer":"C","explanation":"CMK m.147; isnadın bildirilmesi, müdafi yardımı, susma hakkı ve şüpheden kurtulmak için somut delil toplanmasını isteme olanağının hatırlatılmasını öngörür.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-016","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İddianamenin iadesi · m.170,174","question":"Deliller suçun işlendiği konusunda yeterli şüphe oluşturmuş ve savcı iddianame düzenlemiştir. Mahkeme kanunda sayılan bir iade nedeni tespit ederse ne yapabilir?","options":{"A":"Şüpheli hakkında doğrudan mahkûmiyet kurar.","B":"İddianameyi her durumda kabul eder.","C":"İade kararı kamu davasını kesin olarak düşürür.","D":"İddianameyi kanuni usul ve süre içinde başsavcılığa iade edebilir."},"answer":"D","explanation":"CMK m.170 yeterli şüphe varsa iddianame düzenlenmesini; m.174 ise kanunda sayılan nedenlerle iade usulünü düzenler. İade beraat veya kendiliğinden düşme değildir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-017","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Kovuşturmanın başlaması · m.175","question":"Mahkeme iddianameyi kabul etmiştir. Bu kabulün doğrudan sonucu nedir?","options":{"A":"Kovuşturma evresi başlar ve kamu davası açılmış olur.","B":"Soruşturma yeniden başlar.","C":"Sanık otomatik tutuklanır.","D":"Hüküm kesinleşmiş sayılır."},"answer":"A","explanation":"CMK m.175/1'e göre iddianamenin kabulüyle kamu davası açılmış olur ve kovuşturma evresi başlar.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-018","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Duruşmada soru yöneltme · m.201","question":"Duruşmada savcı ve sanık müdafii tanığa soru sormak ister. Salondaki mağdur yakını da doğrudan soru yöneltmek ister. Hangisi doğrudur?","options":{"A":"Duruşmada kimse soru soramaz.","B":"Savcı, müdafi ve vekil doğrudan soru yöneltebilir; diğer kişiler sorularını hâkim aracılığıyla yöneltir.","C":"Yalnız mağdur yakını doğrudan soru sorabilir.","D":"Sorular ancak hüküm açıklandıktan sonra sorulur."},"answer":"B","explanation":"CMK m.201 savcıya, müdafiye ve vekile doğrudan soru yöneltme hakkı tanır. Diğer kişiler sorularını mahkeme başkanı veya hâkim aracılığıyla yöneltir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-019","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Delillerin değerlendirilmesi · m.217","question":"Mahkeme, dosyaya girmiş bir belgeyi duruşmada açıklamadan ve tartışmaya açmadan hükme esas almak istemektedir. Hangisi doğrudur?","options":{"A":"Dosyadaki her belge tartışılmadan hükme alınır.","B":"Yalnız sanığın kabul ettiği deliller kullanılabilir.","C":"Hüküm duruşmaya getirilmiş ve huzurda tartışılmış delillere dayanmalı; suç hukuka uygun elde edilen her türlü delille ispatlanabilir.","D":"Delilin hukuka uygun olması tartışılma şartını ortadan kaldırır."},"answer":"C","explanation":"CMK m.217/1 hükmün duruşmada ortaya konulup tartışılan delillere dayanmasını, m.217/2 suçun hukuka uygun elde edilen her türlü delille ispatını düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-020","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Hüküm çeşitleri · m.223","question":"Mahkeme, yüklenen fiilin sanık tarafından işlendiğinin sabit olmadığı kanaatine ulaşmıştır. Hangi hüküm verilmelidir?","options":{"A":"Tutuklama","B":"Görevsizlik","C":"Zorla getirme","D":"Beraat"},"answer":"D","explanation":"CMK m.223/2-e'ye göre yüklenen suçun sanık tarafından işlendiğinin sabit olmaması beraat nedenidir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-021","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Mağdurun dinlenmesi · m.236","question":"Suçun etkisiyle psikolojisi bozulmuş çocuk mağdurun aynı olay hakkında tekrar tekrar dinlenmesi planlanmaktadır. Hangisi doğrudur?","options":{"A":"Kural olarak bir defa dinlenir; maddi gerçeğin ortaya çıkarılması bakımından zorunluluk hâli saklıdır.","B":"Çocuk mağdur her duruşmada mutlaka dinlenir.","C":"Çocuğun beyanı hiçbir koşulda alınamaz.","D":"Mağdur yalnız yemin ettirilerek dinlenebilir."},"answer":"A","explanation":"CMK m.236/2, suçun etkisiyle psikolojisi bozulmuş çocuk veya mağdurun bir defa dinlenmesini öngörür; maddi gerçeğin ortaya çıkarılması açısından zorunluluk hâlleri saklıdır.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-022","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Uzlaştırma · m.253","question":"Soruşturulan suçun CMK m.253 kapsamında olduğu belirlenmiştir. Uzlaştırma sürecine ilişkin doğru ifade hangisidir?","options":{"A":"Uzlaştırma yalnız hüküm kesinleştikten sonra gündeme gelir.","B":"Kanunda sayılan suçlarda şüpheli ile mağdur veya suçtan zarar gören arasında uzlaştırma girişiminde bulunulur; kapsam ve usul m.253 ve devamına göre belirlenir.","C":"Uzlaştırma kararı kolluk tarafından kesin hüküm gibi verilir.","D":"Uzlaştırma her suçta zorunludur ve mağdurun iradesi önemsizdir."},"answer":"B","explanation":"CMK m.253 uzlaştırma girişiminde bulunulacak suçları ve usulü düzenler. Kapsam, ilgili kanun hükümlerine göre belirlenir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-023","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İtiraz · m.267-268","question":"Kanunda özel bir düzenleme bulunmadığı varsayımında, hâkim kararına itiraz etmek isteyen kişi hangi usulle başvurur?","options":{"A":"Yalnız kolluğa sözlü bildirimle.","B":"Yalnız hüküm kesinleştikten sonra Yargıtaya.","C":"Kural olarak kararı öğrendiği günden itibaren iki hafta içinde kararı veren mercie dilekçeyle veya tutanağa geçirilen beyanla.","D":"Kararı veren hâkime hiçbir şekilde başvuramaz."},"answer":"C","explanation":"CMK m.267 itiraz yolunu düzenler. m.268/1'e göre özel hüküm yoksa başvuru, kararın öğrenildiği günden itibaren iki hafta içinde kararı veren mercie yapılır.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-024","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İstinaf · m.272-275","question":"İlk derece mahkemesi hükmüne karşı süresi içinde istinaf başvurusu yapılmıştır. CMK m.275'in genel kuralına göre başvurunun etkisi nedir?","options":{"A":"Hüküm aynı anda kesinleşir.","B":"Dosya soruşturma evresine döner.","C":"Başvuru yalnız para cezasının ödenmesini durdurur.","D":"Süresinde yapılan istinaf başvurusu hükmün kesinleşmesini engeller."},"answer":"D","explanation":"CMK m.275/1'e göre süresi içinde yapılan istinaf başvurusu hükmün kesinleşmesini engeller.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-025","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Temyiz · m.291","question":"Gerekçeli hüküm tebliğ edilmiştir. CMK m.291'deki genel temyiz süresi ve başvuru yeri hangisidir?","options":{"A":"Yedi gün içinde savcılığa sözlü başvuru","B":"Bir ay içinde doğrudan Anayasa Mahkemesine","C":"Yalnız hüküm kesinleştikten sonra","D":"İki hafta içinde hükmü veren mahkemeye dilekçeyle veya zabıt kâtibine tutanağa geçirilen beyanla"},"answer":"D","explanation":"CMK m.291/1'e göre temyiz istemi gerekçeli hükmün tebliğinden itibaren iki hafta içinde hükmü veren mahkemeye dilekçe veya tutanağa geçirilen beyanla yapılır.","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Müdafi görevlendirilmesi · m.150","question":"Şüpheli, müdafi seçebilecek durumda olduğunu ancak müdafi istemediğini belirtmiştir. İsnat edilen suçun alt sınırı beş yıldan fazla hapis cezasını gerektirmektedir. CMK m.150 bakımından hangisi doğrudur?","options":{"A":"Müdafi görevlendirilmesi yalnız mahkûmiyetten sonra yapılabilir.","B":"Şüphelinin istememesi her durumda müdafi görevlendirilmesini engeller.","C":"Kanunun zorunlu müdafilik öngördüğü hâllerde istemese de müdafi görevlendirilir.","D":"Müdafi ancak mağdur talep ederse görevlendirilir."},"answer":"C","explanation":"CMK m.150, zorunlu müdafilik hâllerini düzenler. Kanunda öngörülen durumlarda kişinin istemi bulunmasa da müdafi görevlendirilmesi gerekir.","id":"cmk5271-mixed-pdf-026","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Yakalama ve gözaltı · m.91","question":"Yakalanan kişi, Cumhuriyet savcısının kararıyla gözaltına alınmıştır. Bireysel suçlarda gözaltı süresinin başlangıcı ve genel azami süre bakımından hangisi doğrudur?","options":{"A":"Yakalama yerine en yakın hâkimliğe gönderilme için gereken süre hariç, yakalama anından itibaren genel kural olarak 24 saati geçemez.","B":"Gözaltı süresi her durumda yedi gündür.","C":"Süre yalnız ifade işlemi bittikten sonra başlar.","D":"Gözaltı süresini kolluk amiri sınırsız olarak belirler."},"answer":"A","explanation":"CMK m.91'de gözaltı süresi ve uzatma koşulları düzenlenir. Genel kural bireysel suçlarda yakalama yerine en yakın hâkim veya mahkemeye gönderilme için zorunlu süre hariç 24 saattir; kanuni istisnalar ayrıca değerlendirilir.","id":"cmk5271-mixed-pdf-027","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tutuklulukta süre · m.102","question":"Ağır ceza mahkemesinin görevine girmeyen bir suç nedeniyle yürütülen kovuşturmada tutukluluk süresi değerlendirilirken aşağıdakilerden hangisi esas alınır?","options":{"A":"Tutukluluk süresinin sınırı bulunmaz.","B":"Her suç için otomatik olarak beş yıl uygulanır.","C":"Süreyi yalnız kolluk belirler.","D":"CMK m.102'deki suç türüne ve kanuni koşullara göre belirlenen azami süre dikkate alınır."},"answer":"D","explanation":"CMK m.102, tutuklulukta geçecek sürelerin üst sınırlarını suçun niteliğine ve yargılama evresine göre düzenler; somut dosyada ilgili fıkra ve istisnalar birlikte incelenmelidir.","id":"cmk5271-mixed-pdf-028","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Adli kontrol · m.109","question":"Tutuklama nedenleri bulunmakla birlikte tutuklama yerine adli kontrol uygulanmasına karar verilmiştir. Adli kontrolün hukuki niteliği bakımından hangisi doğrudur?","options":{"A":"Adli kontrol yalnız kesin hükümden sonra uygulanabilir.","B":"Adli kontrol, kanuni koşulları varsa tutuklama yerine uygulanabilen bir koruma tedbiridir.","C":"Adli kontrol kararı sanığın suçunu kabul ettiği anlamına gelir.","D":"Adli kontrolü yalnız kolluk amiri kararlaştırabilir."},"answer":"B","explanation":"CMK m.109, tutuklama sebeplerinin varlığı hâlinde tutuklama yerine adli kontrol uygulanabilmesini düzenler. Adli kontrol bir mahkûmiyet veya suç ikrarı değildir.","id":"cmk5271-mixed-pdf-029","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İletişimin denetlenmesi · m.135","question":"Soruşturma sırasında iletişimin dinlenmesi ve kayda alınması talep edilmektedir. CMK m.135 kapsamında temel koşulların birlikte arandığı seçenek hangisidir?","options":{"A":"Mağdurun sözlü talebi tek başına yeterlidir.","B":"Her suçta, suç şüphesi aranmaksızın uygulanabilir.","C":"Kanunda sayılan suç, başka suretle delil elde edilememe ve kuvvetli şüpheyi destekleyen somut delillere ilişkin koşullar ile yetkili merci kararı aranır.","D":"Kararı yalnız telefon operatörü verir."},"answer":"C","explanation":"CMK m.135 iletişimin denetlenmesini sıkı koşullara bağlar. Suç türü, başka suretle delil elde edilememe, kuvvetli şüpheyi destekleyen somut deliller ve kanunda belirtilen karar usulü gözetilir.","id":"cmk5271-mixed-pdf-030","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Gizli soruşturmacı · m.139","question":"Gizli soruşturmacı görevlendirilmesi bakımından aşağıdaki ifadelerden hangisi doğrudur?","options":{"A":"Kanuni şartlar ve katalog suçlarla sınırlı olarak, başka suretle delil elde edilememesi koşulu da gözetilerek hâkim kararıyla görevlendirme yapılabilir.","B":"Her basit şüphede kolluk amiri sözlü emirle görevlendirir.","C":"Gizli soruşturmacı yalnız hüküm kesinleştikten sonra çalışabilir.","D":"Gizli soruşturmacı görevlendirilmesi için suç şüphesi aranmaz."},"answer":"A","explanation":"CMK m.139, gizli soruşturmacı görevlendirilmesini kanuni koşullara, belirli suçlara ve kural olarak hâkim kararına bağlar.","id":"cmk5271-mixed-pdf-031","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Teknik araçlarla izleme · m.140","question":"Teknik araçlarla izleme tedbirinin uygulanması istenmektedir. Hangi yaklaşım CMK m.140'ın sistematiğine uygundur?","options":{"A":"Tedbir bütün suçlarda ve her ortamda sınırsız uygulanabilir.","B":"Sadece mağdurun rızasıyla uygulanır.","C":"Kolluk görevlisi tek başına kesin karar verir.","D":"Kanunda belirtilen suç ve şartlar, başka suretle delil elde edilememe ve yetkili hâkim kararı gibi güvenceler dikkate alınır."},"answer":"D","explanation":"CMK m.140 teknik araçlarla izlemeyi belirli suçlar ve koşullarla sınırlar; karar yetkisi ve tedbirin kapsamı kanundaki güvencelere göre belirlenir.","id":"cmk5271-mixed-pdf-032","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İddianamenin unsurları · m.170","question":"Cumhuriyet savcısı iddianame düzenlerken şüphelinin lehine olan delilleri hiç göstermemiştir. CMK m.170 bakımından hangisi doğrudur?","options":{"A":"İddianamede yalnız aleyhe deliller bulunabilir.","B":"İddianamede yüklenen suç ve deliller gösterilmeli; şüphelinin lehine olan hususlar da belirtilmelidir.","C":"Delillerin iddianamede gösterilmesi yasaktır.","D":"İddianameyi kolluk düzenler ve mahkemeye sunar."},"answer":"B","explanation":"CMK m.170, iddianamenin içeriğini düzenler ve şüphelinin lehine olan hususların da iddianamede gösterilmesini öngörür.","id":"cmk5271-mixed-pdf-033","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Duruşmanın açıklığı · m.182","question":"Bir ceza davasında duruşmanın kapalı yapılması talep edilmiştir. Duruşmanın açıklığı ilkesi ve istisnaları bakımından hangisi doğrudur?","options":{"A":"Ceza duruşmalarının tamamı kendiliğinden kapalıdır.","B":"Duruşmanın açıklığına ilişkin karar verilemez.","C":"Duruşma kural olarak açıktır; kanunda belirtilen koşullarda mahkeme kapalı duruşmaya karar verebilir.","D":"Duruşmayı yalnız taraflardan biri kapatabilir."},"answer":"C","explanation":"CMK m.182 uyarınca duruşma kural olarak herkese açıktır. Genel ahlakın veya kamu güvenliğinin kesin olarak gerekli kıldığı hâllerde kanuni usulle kapalılık kararı verilebilir.","id":"cmk5271-mixed-pdf-034","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Öncüllü soru · Duruşmanın açıklığı · m.182","question":"Duruşmanın açıklığı ilkesiyle ilgili aşağıdaki öncülleri değerlendiriniz.\nI. Duruşma kural olarak herkese açıktır.\nII. Kanunda belirtilen koşullarda mahkeme kapalı duruşmaya karar verebilir.\nIII. Taraflardan birinin istemesi, mahkemeden bağımsız olarak duruşmayı kendiliğinden kapatır.\nYukarıdakilerden hangileri doğrudur?","options":{"A":"Yalnız I","B":"Yalnız III","C":"I ve III","D":"I ve II"},"answer":"D","explanation":"CMK m.182 uyarınca duruşma kural olarak açıktır; kanuni koşullarda mahkeme kapalılık kararı verebilir. Tarafın tek başına talebi duruşmayı kendiliğinden kapatmaz.","id":"cmk5271-mixed-pdf-035","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tanığın yemini · m.54-55","question":"Mahkeme, tanığın yemin vererek dinlenmesi gerekip gerekmediğini değerlendirmektedir. CMK bakımından doğru yaklaşım hangisidir?","options":{"A":"Tanıkların dinlenmesinde yemin kuralı ve yeminden istisna tutulan kişiler ilgili kanun hükümlerine göre belirlenir.","B":"Bütün tanıklar her durumda yeminsiz dinlenir.","C":"Yemin yalnız sanığa verdirilir.","D":"Tanığa yemin verdirilmesi tamamen kolluğun takdirindedir."},"answer":"A","explanation":"CMK m.54 ve devamı tanığa yemin verilmesini ve istisnaları düzenler. Tanığın yaşı ve kanundaki özel durumlar dikkate alınır.","id":"cmk5271-mixed-pdf-036","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Keşif · m.83","question":"Suç yerinin fiziksel koşullarının olayın oluşuna etkisi tartışmalıdır. Mahkeme olay yerinde inceleme yapmayı değerlendirmektedir. Bu işlem hangi kavramla ifade edilir?","options":{"A":"Uzlaştırma","B":"Keşif","C":"İstinaf","D":"İnfaz"},"answer":"B","explanation":"CMK m.83 ve devamında keşif düzenlenir. Hâkim veya mahkeme, olayın aydınlatılması için yerinde inceleme yapabilir; keşif usulü kanuna uygun yürütülür.","id":"cmk5271-mixed-pdf-037","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Arama kararı · m.119","question":"Arama kararında veya yazılı emrinde bulunması gereken unsurlar açısından aşağıdakilerden hangisi doğrudur?","options":{"A":"Aranacak yerin belirtilmesi zorunlu değildir.","B":"Arama emri her durumda sözlü verilebilir.","C":"Karar veya emirde aramanın nedenini oluşturan fiil, aranacak kişi veya yer ve geçerlilik süresi gibi kanuni unsurlar gösterilmelidir.","D":"Arama kararı yalnız arama bittikten sonra hazırlanır."},"answer":"C","explanation":"CMK m.119, arama kararında veya emrinde bulunması gereken unsurları ve yazılılık koşulunu düzenler. Somut işlemde kanundaki zorunlu unsurlar bulunmalıdır.","id":"cmk5271-mixed-pdf-038","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Elkoyma ve iade · m.131","question":"Soruşturma için artık muhafazasına gerek kalmayan ve müsadereye tabi olmayan bir eşya hakkında ilgilisi iade talep etmektedir. Hangisi doğrudur?","options":{"A":"Eşya hiçbir koşulda iade edilemez.","B":"Eşya ancak dava kesinleştikten sonra iade edilebilir.","C":"İade talebini yalnız kolluk amiri karara bağlar.","D":"Kanuni koşullar gerçekleşmişse eşyanın iadesine karar verilebilir."},"answer":"D","explanation":"CMK m.131, elkonulan eşyanın muhafazasına gerek kalmaması ve müsadereye tabi olmaması gibi koşullarda iadesini düzenler.","id":"cmk5271-mixed-pdf-039","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İfade tutanağı · m.147","question":"Şüphelinin ifadesi alınırken tutanağın içeriği ve imzalanmasıyla ilgili hangi işlem usule uygundur?","options":{"A":"Tutanak yalnız kolluk görevlisinin imzasıyla tamamlanır; şüpheliye okunmaz.","B":"İfade işlemi tutanağa bağlanır; tutanakta kanuni unsurlar bulunur ve ilgili kişilerce imzalanır, imzadan kaçınma hâli belirtilir.","C":"Tutanak tutulması isteğe bağlıdır.","D":"Müdafi tutanağı görme hakkına hiçbir zaman sahip değildir."},"answer":"B","explanation":"CMK m.147 ifade alma usulünü ve tutanakta bulunması gereken hususları düzenler. İfade işlemi kayıt altına alınır; imzadan kaçınma gibi durumlar tutanağa geçirilir.","id":"cmk5271-mixed-pdf-040","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Duruşma tutanağı · m.219","question":"Duruşma sırasında tanığın beyanı ve tarafların önemli talepleri kayda geçirilmemiştir. Duruşma tutanağı bakımından hangisi doğrudur?","options":{"A":"Duruşma işlemleri kanunda belirtilen esaslara göre tutanağa geçirilmelidir; tutanak duruşmanın usulüne uygun yürütüldüğünün temel kayıtlarındandır.","B":"Duruşma tutanağı yalnız hüküm kesinleştikten sonra tutulur.","C":"Tutanak yalnız sanık isterse düzenlenir.","D":"Tutanakta duruşmanın yapıldığı tarih yer alamaz."},"answer":"A","explanation":"CMK m.219 ve devamı duruşma tutanağını düzenler. Kanunda gösterilen işlem ve beyanların tutanağa geçirilmesi yargılama sürecinin denetlenebilirliği için önemlidir.","id":"cmk5271-mixed-pdf-041","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Öncüllü soru · Hükmün gerekçesi · m.230","question":"Hükmün gerekçesinde bulunması gereken hususlara ilişkin öncülleri inceleyiniz.\nI. Mahkemenin kabul ettiği ve reddettiği delillerin tartışılması.\nII. Savunmada ileri sürülen ve hükme etkili olan hususların değerlendirilmesi.\nIII. Ulaşılan sonucun gerekçesiz bırakılması.\nHangileri CMK m.230'un gerekçe sistematiğiyle uyumludur?","options":{"A":"Yalnız III","B":"I ve III","C":"I ve II","D":"I, II ve III"},"answer":"C","explanation":"CMK m.230, delillerin tartışılmasını, kabul ve ret nedenlerini ve hükme etkili savunma iddialarının değerlendirilmesini gerektirir. Sonucun gerekçesiz bırakılması bu sistematiğe aykırıdır.","id":"cmk5271-mixed-pdf-042","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Beraat kararı · m.223","question":"Yapılan yargılama sonunda yüklenen fiilin kanunda suç olarak tanımlanmadığı anlaşılmıştır. CMK m.223 bakımından hangi karar verilmelidir?","options":{"A":"Tutuklama kararı","B":"Görevsizlik kararı","C":"Davanın nakli","D":"Beraat kararı"},"answer":"D","explanation":"CMK m.223/2-a uyarınca yüklenen fiilin kanunda suç olarak tanımlanmamış olması beraat nedenidir.","id":"cmk5271-mixed-pdf-043","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · HAGB · m.231","question":"Mahkeme hükmün açıklanmasının geri bırakılması koşullarını değerlendirmektedir. Bu kurumun hukuki niteliği için hangisi doğrudur?","options":{"A":"HAGB, her suçta otomatik olarak uygulanır.","B":"HAGB, kanunda düzenlenen koşullara bağlı özel bir kurumdur; koşullar oluşmadan sırf sanığın talebiyle otomatik uygulanmaz.","C":"HAGB beraat hükmüyle aynı şeydir.","D":"HAGB kararını kolluk verir."},"answer":"B","explanation":"CMK m.231 hükmün açıklanmasının geri bırakılmasını ve koşullarını düzenler. Uygulamada yürürlükteki mevzuat ve ilgili anayasal/yargısal değişiklikler de kontrol edilmelidir.","id":"cmk5271-mixed-pdf-044","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Uzlaştırma · m.253","question":"Uzlaştırma görüşmelerinde taraflar anlaşamamıştır. Bu durumun sonucu bakımından hangisi doğrudur?","options":{"A":"Anlaşamama, tek başına sanığın suçu kabul ettiği anlamına gelmez; soruşturma veya kovuşturma kanuni usule göre devam eder.","B":"Anlaşamama doğrudan mahkûmiyet doğurur.","C":"Uzlaştırmacı mahkûmiyet kararı verir.","D":"Anlaşamama bütün delilleri geçersiz kılar."},"answer":"A","explanation":"CMK m.253 ve devamında uzlaştırma usulü düzenlenir. Uzlaşma sağlanmaması kendiliğinden mahkûmiyet veya suç ikrarı anlamına gelmez; süreç kanuni hükümlere göre devam eder.","id":"cmk5271-mixed-pdf-045","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İtirazın incelenmesi · m.268-271","question":"Bir hâkim kararına karşı süresinde itiraz edilmiştir. İtirazın incelenmesi bakımından hangisi doğrudur?","options":{"A":"İtirazı yalnız kolluk inceler.","B":"İtiraz her durumda doğrudan Yargıtay tarafından incelenir.","C":"İtiraz, kanunda gösterilen usule göre kararı veren merci ve gerektiğinde itirazı incelemeye yetkili merci tarafından değerlendirilir.","D":"İtiraz başvurusu kararın kendiliğinden yok sayılması sonucunu doğurur."},"answer":"C","explanation":"CMK m.268-271 itirazın başvuru ve inceleme usulünü düzenler. İnceleme, kararın niteliğine göre kanunda gösterilen yetkili merci tarafından yapılır.","id":"cmk5271-mixed-pdf-046","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İstinaf başvurusu · m.273","question":"İlk derece mahkemesinin hükmüne karşı istinaf başvurusu yapmak isteyen taraf, genel süre bakımından hangi seçeneği esas almalıdır?","options":{"A":"Hükmün öğrenildiği gün içinde yalnız sözlü başvuru","B":"Her durumda otuz gün","C":"Bir yıl içinde herhangi bir mercie başvuru","D":"CMK m.273'teki yürürlükteki süre ve başvuru usulü; özel düzenlemeler saklı kalmak üzere hükmün gerekçesiyle tebliği esas alınarak değerlendirilir."},"answer":"D","explanation":"CMK m.273 istinaf başvuru süresini ve usulünü düzenler. Süre hesabında yürürlükteki metin ve varsa özel hükümler kontrol edilmelidir.","id":"cmk5271-mixed-pdf-047","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Kanun yararına bozma · m.309","question":"Kesinleşmiş bir karar veya hükümde hukuka aykırılık bulunduğu ileri sürülmektedir ve olağan kanun yolu açık değildir. CMK m.309 kapsamında hangi olağanüstü kanun yolu gündeme gelebilir?","options":{"A":"İstinaf","B":"Kanun yararına bozma","C":"Görevsizlik","D":"Uzlaştırma"},"answer":"B","explanation":"CMK m.309, hâkim veya mahkeme tarafından verilen ve istinaf veya temyiz incelemesinden geçmeksizin kesinleşen karar veya hükümler için kanun yararına bozma yolunu düzenler.","id":"cmk5271-mixed-pdf-048","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Yargılamanın yenilenmesi · m.311","question":"Kesinleşmiş mahkûmiyet hükmünden sonra, hükme esas alınan belgenin sahte olduğu kesinleşmiş bir mahkeme kararıyla ortaya çıkmıştır. Hangi yol gündeme gelebilir?","options":{"A":"Yargılamanın yenilenmesi","B":"İlk kez gözaltı","C":"Görevsizlik itirazı","D":"İddianamenin iadesi"},"answer":"A","explanation":"CMK m.311, kesinleşmiş hükümlere karşı belirli nedenlerle yargılamanın yenilenmesini düzenler. Hükme esas alınan belgenin sahteliğinin ortaya çıkması kanundaki koşullarla yenileme nedeni olabilir.","id":"cmk5271-mixed-pdf-049","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Dava zamanaşımı ve düşme · m.223","question":"Yargılama sırasında dava zamanaşımının gerçekleştiği anlaşılmıştır. CMK m.223 kapsamında hangi karar türü gündeme gelir?","options":{"A":"Her durumda beraat","B":"Zorla getirme","C":"Davanın düşmesi","D":"Tutuklama"},"answer":"C","explanation":"CMK m.223/8 uyarınca Türk Ceza Kanunundaki düşme sebeplerinin varlığı hâlinde davanın düşmesine karar verilir; zamanaşımı ilgili düşme nedenlerindendir.","id":"cmk5271-mixed-pdf-050","pool":"mixed"},{"id":"cmk5271-mixed-pdf-051","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tanımlar · m.2","question":"Soruşturma evresinde suç şüphesi altında bulunan kişiye CMK'da hangi sıfat verilir?","options":{"A":"Sanık","B":"Şüpheli","C":"Hükümlü","D":"Katılan"},"answer":"B","explanation":"CMK m.2'ye göre soruşturma evresindeki kişi şüphelidir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-052","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Görev · m.3-7","question":"Mahkemenin görevli olup olmadığını yargılamanın hangi aşamasında inceleyebilmesi bakımından hangisi doğrudur?","options":{"A":"Yalnız ilk duruşmada","B":"Yalnız sanık isterse","C":"Her zaman re'sen gözetilebilir","D":"Yalnız hüküm kesinleştikten sonra"},"answer":"C","explanation":"Görev kamu düzenine ilişkindir; CMK m.4 ve devamı uyarınca re'sen dikkate alınır.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-053","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Bağlantı · m.8-11","question":"İki suçun birinin diğerini işlemede araç olarak kullanılması, CMK bakımından hangi değerlendirmeyi gündeme getirir?","options":{"A":"Bağlantılı suçlar","B":"Kesin hüküm","C":"Tanıklıktan çekinme","D":"İnfazın ertelenmesi"},"answer":"A","explanation":"CMK m.8 bağlantılı suçları düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-054","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Hâkimin reddi · m.24","question":"Hâkimin tarafsızlığını şüpheye düşüren bir neden bulunduğunda tarafın başvurabileceği kurum hangisidir?","options":{"A":"İddianamenin iadesi","B":"Adli kontrol","C":"Zorla getirme","D":"Hâkimin reddi"},"answer":"D","explanation":"CMK m.24 ve devamında hâkimin reddi düzenlenir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-055","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Savcının görevi · m.160","question":"Cumhuriyet savcısı soruşturmada delilleri toplarken hangi yaklaşımı benimsemelidir?","options":{"A":"Yalnız aleyhe delil toplamalı","B":"Lehe ve aleyhe delilleri toplamalı","C":"Sadece şüphelinin ikrarını esas almalı","D":"Mağdur talep etmedikçe işlem yapmamalı"},"answer":"B","explanation":"CMK m.160 uyarınca lehe ve aleyhe deliller toplanır.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-056","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İfade alma · m.147","question":"Şüphelinin ifadesi alınırken aşağıdakilerden hangisi kendisine bildirilmesi gereken haklardandır?","options":{"A":"Hükmün kesinleştiği","B":"İstinaf başvurusunun sonucu","C":"Susma hakkı", rilir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-231","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Bilirkişi · m.63","question":"Aşağıdakilerden hangisi bilirkişiye başvurulmasının kanuni amacına uygundur?","options":{"A":"Mahkemenin yerine geçerek hüküm kurması","B":"Sanığın suçlu olup olmadığı konusunda bağlayıcı karar vermesi","C":"Duruşma düzenini sağlaması","D":"Çözümü özel veya teknik bilgiyi gerektiren konuda görüş bildirmesi"},"answer":"D","explanation":"CMK m.63 uyarınca özel veya teknik bilgi gereken hâllerde bilirkişiye başvurulur; hukuki hükmü bilirkişi değil mahkeme kurar.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-232","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Keşif · m.83-84","question":"Mahkemenin olayın gerçekleştiği yerde veya ilgili nesne üzerinde doğrudan inceleme yaparak gözlemde bulunması hangi delil elde etme işlemidir?","options":{"A":"Keşif","B":"İstinaf","C":"İtiraz","D":"Uzlaştırma"},"answer":"A","explanation":"CMK m.83 ve 84 keşif işlemini ve keşif sırasında uygulanacak usulü düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-233","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Yakalama · m.90","question":"CMK m.90/1’e göre herkes tarafından geçici yakalama yapılabilecek hâller arasında aşağıdakilerden hangisi yer alır?","options":{"A":"Kişinin daha önce sabıkalı olduğunun duyulması","B":"Mağdurun herhangi bir kişiyi suçlaması","C":"Kişiye suçu işlerken rastlanması","D":"Kişinin duruşmaya katılmak istememesi"},"answer":"C","explanation":"CMK m.90/1-a, kişiye suçu işlerken rastlanmasını herkes tarafından geçici yakalama yapılabilecek hâllerden biri olarak sayar.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-234","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tutuklama · m.100-101","question":"I. Kuvvetli suç şüphesini gösteren somut deliller aranır.\nII. Kanunda belirtilen tutuklama nedenlerinden birinin bulunması gerekir.\nIII. Tutuklama tedbiri ölçülülük yönünden değerlendirilir.\nCMK m.100 bakımından hangileri doğrudur?","options":{"A":"Yalnız I","B":"I ve II","C":"Yalnız III","D":"I, II ve III"},"answer":"D","explanation":"CMK m.100, kuvvetli suç şüphesini gösteren somut delilleri, tutuklama nedenini ve ölçülülük şartını birlikte düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-235","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Arama · m.119","question":"Konut, işyeri veya kamuya açık olmayan kapalı alanlarda arama yapılması bakımından genel karar kuralı hangisidir?","options":{"A":"Hâkim kararı; gecikmesinde sakınca bulunan hâllerde kanunun öngördüğü şartlarla Cumhuriyet savcısının yazılı emri","B":"Her durumda herhangi bir kolluk görevlisinin sözlü talimatı","C":"Yalnız mağdurun telefonla verdiği izin","D":"Yalnız kesinleşmiş mahkûmiyet kararı"},"answer":"A","explanation":"CMK m.119/1 arama kararını ve gecikmesinde sakınca bulunan hâllerde yazılı emir usulünü düzenler; konut ve kapalı alanlar bakımından kanuni yetki sınırları gözetilmelidir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-236","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · El koyma · m.127","question":"Hâkim kararı olmadan yapılan el koyma, CMK m.127’deki sürelerde hâkim onayına sunulmamış veya hâkim süresinde kararını açıklamamışsa hangi sonuç doğabilir?","options":{"A":"El koyma kendiliğinden kesinleşir.","B":"El koyma kendiliğinden kalkar.","C":"Şüpheli otomatik beraat eder.","D":"Kamu davası kendiliğinden düşer."},"answer":"B","explanation":"CMK m.127/3’e göre hâkim kararı olmaksızın yapılan el koyma 24 saat içinde hâkim onayına sunulur; hâkim 48 saat içinde kararını açıklamazsa el koyma kendiliğinden kalkar.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-237","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İfade alma · m.147","question":"Şüphelinin ifadesi alınırken aşağıdakilerden hangisinin hatırlatılması CMK m.147’deki güvenceler arasındadır?","options":{"A":"Mahkemenin vereceği hükmün önceden kesin olduğu","B":"Susma hakkının bulunmadığı","C":"Müdafi yardımından yararlanma ve susma hakkı","D":"İsnadın açıklanmayacağı"},"answer":"C","explanation":"CMK m.147; isnadın bildirilmesi, müdafi yardımından yararlanma ve susma hakkı gibi ifade alma güvencelerini düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-238","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İddianame · m.170-175","question":"I. İddianame düzenlenmesi için suçun işlendiği konusunda yeterli şüphe oluşturacak delil aranır.\nII. İddianamenin kabulüyle kovuşturma evresi başlar.\nIII. İddianamenin kabulü, sanığın suçlu olduğunun kesinleştiği anlamına gelir.\nHangileri doğrudur?","options":{"A":"Yalnız I","B":"I ve III","C":"II ve III","D":"I ve II"},"answer":"D","explanation":"CMK m.170 yeterli şüpheyi, m.175 iddianamenin kabulüyle kamu davasının açılması ve kovuşturmanın başlamasını düzenler. Kabul, mahkûmiyet veya suçluluğun kesinleşmesi değildir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-239","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Duruşma · m.201","question":"Duruşmada doğrudan soru yöneltme yetkisi CMK m.201’de hangi kişiler için açıkça düzenlenmiştir?","options":{"A":"Cumhuriyet savcısı, müdafi ve vekil","B":"Duruşmayı izleyen herkes","C":"Yalnız tanıklar","D":"Yalnız bilirkişi"},"answer":"A","explanation":"CMK m.201’e göre Cumhuriyet savcısı, müdafi ve vekil doğrudan soru yöneltebilir. Diğer kişiler sorularını mahkeme başkanı veya hâkim aracılığıyla yöneltir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-240","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Deliller · m.206-217","question":"Mahkeme, hukuka aykırı elde edildiği belirlenen bir delilin ortaya konulmasını değerlendirmektedir. CMK m.206/2-a’ya göre hangi karar verilir?","options":{"A":"Delil mutlaka kabul edilir.","B":"Delilin ortaya konulması reddedilir.","C":"Sanık doğrudan mahkûm edilir.","D":"Dava başka ülkeye gönderilir."},"answer":"B","explanation":"CMK m.206/2-a, delilin kanuna aykırı elde edilmiş olması hâlinde delilin ortaya konulmasının reddini öngörür.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-241","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Hüküm · m.223","question":"Mahkeme, yüklenen fiilin kanunda suç olarak tanımlanmadığını tespit etmiştir. CMK m.223’e göre hangi hüküm verilmelidir?","options":{"A":"Mahkûmiyet","B":"Tutuklama","C":"Beraat","D":"Görevsizlik her durumda"},"answer":"C","explanation":"CMK m.223/2-a uyarınca yüklenen fiilin kanunda suç olarak tanımlanmamış olması beraat nedenidir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-242","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İtiraz · m.267-268","question":"Özel bir hüküm bulunmadığında, itiraz yoluna başvurmak isteyen kişi CMK m.268’e göre başvurusunu kural olarak nereye yapar?","options":{"A":"Doğrudan kolluk amirine","B":"Yalnızca Adalet Bakanlığına","C":"Her durumda Anayasa Mahkemesine","D":"Kararı veren mercie"},"answer":"D","explanation":"CMK m.268/1’e göre özel kanun hükmü yoksa itiraz, kararı veren mercie dilekçeyle veya tutanağa geçirilmek üzere zabıt kâtibine beyanda bulunularak yapılır; süre yönünden kanundaki düzenleme esas alınır.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-243","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İstinaf · m.272-275","question":"İlk derece mahkemesinin hükmünün bölge adliye mahkemesince incelenmesini sağlayan olağan kanun yolu hangisidir?","options":{"A":"İstinaf","B":"İtiraz","C":"Yargılamanın yenilenmesi","D":"Kanun yararına bozma"},"answer":"A","explanation":"CMK m.272 ve devamı ilk derece mahkemesi hükümlerine karşı istinaf yolunu düzenler; kanuni istisnalar saklıdır.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-244","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Öncüllü soru · m.182, 183, 187","question":"I. Duruşma kural olarak alenidir.\nII. Duruşmanın kayda alınması ve görüntü alınması konusunda kanuni sınırlamalar vardır.\nIII. Duruşmanın açıklığı, salonda her türlü kayıt ve yayının serbest olduğu anlamına gelir.\nHangileri doğrudur?","options":{"A":"Yalnız I","B":"I ve II","C":"II ve III","D":"I, II ve III"},"answer":"B","explanation":"CMK m.182 duruşmanın açıklığını düzenler. m.183 ve ilgili hükümler kayıt ve görüntü alma konusunda sınırlamalar getirir; aleniyet sınırsız yayın hakkı vermez.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-245","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Mağdurun dinlenmesi · m.236","question":"CMK m.236/2’de düzenlenen, suçun etkisiyle psikolojisi bozulmuş çocuk veya mağdurun dinlenmesine ilişkin temel kural hangisidir?","options":{"A":"Her duruşmada tekrar tekrar dinlenmesi zorunludur.","B":"Beyanının hiçbir koşulda alınamaması gerekir.","C":"Kural olarak bir defa dinlenir; maddi gerçeğin ortaya çıkarılması bakımından zorunluluk hâli saklıdır.","D":"Yalnız sanığın izniyle dinlenebilir."},"answer":"C","explanation":"CMK m.236/2 bir defa dinleme kuralını getirir; maddi gerçeğin ortaya çıkarılması açısından zorunluluk hâlleri saklı tutulur.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-246","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Uzlaştırma · m.253","question":"Uzlaştırma bakımından aşağıdaki ifadelerden hangisi doğrudur?","options":{"A":"Bütün suçlarda zorunlu olarak uygulanır.","B":"Yalnız kesinleşmiş mahkûmiyet sonrasında mümkündür.","C":"Uzlaştırmayı kolluk kesin hüküm şeklinde karara bağlar.","D":"Kapsama giren suçlar ve uzlaştırma usulü CMK m.253 ve devamındaki hükümlere göre belirlenir."},"answer":"D","explanation":"CMK m.253 ve devamı uzlaştırmanın kapsamını ve usulünü düzenler. Her suç otomatik olarak uzlaştırma kapsamında değildir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-247","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Öncüllü soru · m.2, 147, 217","question":"I. Sorgu, şüpheli veya sanığın hâkim ya da mahkeme tarafından dinlenmesidir.\nII. Şüphelinin susma hakkı ifade alma güvenceleri arasındadır.\nIII. Hüküm, yalnızca hukuka uygun elde edilmiş ve duruşmada ortaya konularak tartışılmış delillere dayanabilir.\nHangileri doğrudur?","options":{"A":"I, II ve III","B":"Yalnız I","C":"I ve III","D":"II ve III"},"answer":"A","explanation":"I, CMK m.2’deki sorgu tanımına; II, m.147’deki ifade alma güvencelerine; III, m.217’deki delillerin değerlendirilmesi ilkesine uygundur.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-248","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İddianamenin iadesi · m.174","question":"Mahkeme, iddianameyi incelerken CMK m.174’te sayılan bir iade nedeninin bulunduğunu saptamıştır. Bu aşamada hangi karar gündeme gelebilir?","options":{"A":"Sanık hakkında doğrudan mahkûmiyet","B":"İddianamenin iadesi","C":"Kesinleşmiş hükmün infazı","D":"Tanığın beraatine karar verilmesi"},"answer":"B","explanation":"CMK m.174, kanunda sayılan iade nedenlerinin bulunması hâlinde iddianamenin iadesi usulünü düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-249","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Duruşma düzeni · m.203","question":"Duruşma sırasında düzeni bozan bir kişinin davranışları devam etmektedir. CMK m.203 çerçevesinde mahkeme başkanı veya hâkim ne yapabilir?","options":{"A":"Her durumda kamu davasını düşürür.","B":"İddianameyi kolluğa devreder.","C":"Duruşma düzenini sağlamak için kanuni tedbirleri uygular.","D":"Hükmü tanığa kurdurur."},"answer":"C","explanation":"CMK m.203 duruşma düzeninin sağlanması için mahkeme başkanına veya hâkime kanuni yetkiler tanır.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-250","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Karma öncüllü soru · m.12, 100, 170, 175","question":"I. Genel yetki kuralında suçun işlendiği yer mahkemesi esas alınır.\nII. Tutuklama için kanundaki koşulların birlikte değerlendirilmesi gerekir.\nIII. İddianamenin kabulü kovuşturma evresini başlatır.\nIV. İddianamenin kabul edilmesi tek başına mahkûmiyet anlamına gelir.\nYukarıdaki ifadelerden hangileri doğrudur?","options":{"A":"I ve IV","B":"II ve IV","C":"I, II ve IV","D":"I, II ve III"},"answer":"D","explanation":"I, CMK m.12’deki genel yetki kuralına; II, m.100’deki tutuklama koşullarına; III, m.175’e uygundur. İddianamenin kabulü mahkûmiyet anlamına gelmez.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-251","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tanımlar · m.2","question":"CMK m.2’deki tanımlara göre, şüpheli veya sanığın ceza muhakemesinde savunmasını yapan avukata ne ad verilir?","options":{"A":"Vekil","B":"Malen sorumlu","C":"Müdafi","D":"Bilirkişi"},"answer":"C","explanation":"CMK m.2/1-c, müdafiyi şüpheli veya sanığın ceza muhakemesinde savunmasını yapan avukat olarak tanımlar.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-252","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Davaların birleştirilmesi · m.8-11","question":"Aşağıdakilerden hangisi CMK’de davalar arasında bağlantı bulunmasına ilişkin düzenlemelerden biridir?","options":{"A":"Bağlantılı davaların kanuni şartlarla birlikte görülmesi veya birleştirilmesi","B":"Bağlantı bulunan her davanın kendiliğinden düşmesi","C":"Birleştirme kararının yalnız kolluk tarafından verilmesi","D":"Bağlantı için mutlaka aynı sanığın bulunmasının şart olması"},"answer":"A","explanation":"CMK m.8-11 bağlantı kavramını ve bağlantılı davaların birleştirilmesi veya birlikte görülmesine ilişkin kuralları düzenler. Bağlantı her durumda otomatik birleştirme anlamına gelmez.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-253","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Yetki · m.18","question":"CMK m.18 kapsamında yetkisizlik iddiasının ileri sürülmesi ve incelenmesi bakımından aşağıdakilerden hangisi doğrudur?","options":{"A":"Yetkisizlik iddiası yalnız soruşturma başlamadan önce ileri sürülebilir.","B":"Yetkisizlik iddiasını sadece tanık ileri sürebilir.","C":"Yetki itirazı hiçbir zaman karara bağlanmaz.","D":"Yetkisizlik iddiası kanunda belirtilen süre ve usule uygun ileri sürülür; mahkeme iddiayı kanuna göre değerlendirir."},"answer":"D","explanation":"CMK m.18 yetkisizlik iddiasının ileri sürülme zamanı ve usulünü düzenler. Başvurunun zamanı ve koşulları madde hükümlerine göre belirlenir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-254","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Hâkimin davaya bakamaması · m.22","question":"CMK m.22’de sayılan hâllerden birinin bulunması hâlinde hâkim bakımından hangi sonuç gündeme gelir?","options":{"A":"Hâkim yalnız taraflar kabul ederse davaya bakamaz.","B":"Hâkim davaya bakamaz; yasaklılık hâli kanuna göre değerlendirilir.","C":"Hâkim aynı davada her aşamada sınırsız görev alabilir.","D":"Dava kendiliğinden beraatle sonuçlanır."},"answer":"B","explanation":"CMK m.22 hâkimin davaya bakamayacağı hâlleri düzenler. Bu hâller tarafların tercihine bırakılmış basit bir usul itirazı değildir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-255","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Süreler · m.39-40","question":"I. Günle belirlenen süre, tebliğ gününü izleyen gün işlemeye başlar.\nII. Son gün tatile rastlarsa süre, tatili izleyen gün sona erer.\nIII. Kusuru olmaksızın bir süreyi kaçıran kişinin eski hâle getirme istemi, kanuni koşullardan bağımsız olarak her durumda kabul edilir.\nHangileri doğrudur?","options":{"A":"Yalnız I","B":"I ve III","C":"I ve II","D":"II ve III"},"answer":"C","explanation":"CMK m.39 sürelerin hesaplanmasını düzenler. Eski hâle getirme m.40 ve devamındaki koşullara bağlıdır; istem her durumda otomatik kabul edilmez.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-256","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tanıklıktan çekinme · m.45-46","question":"Tanığın kanunda sayılan bir yakınlık ilişkisi nedeniyle tanıklıktan çekinme hakkı bulunduğu anlaşılmıştır. Mahkemenin yaklaşımı nasıl olmalıdır?","options":{"A":"Çekinme hakkını ve varsa kanuni istisnaları ilgili maddelere göre değerlendirmek","B":"Tanığı her durumda zorla konuşturmak","C":"Tanığın beyanını otomatik olarak doğru kabul etmek","D":"Kamu davasını kendiliğinden düşürmek"},"answer":"A","explanation":"CMK m.45-46 tanıklıktan çekinme hakkının kapsamını ve ilgili kişileri düzenler. Hakkın varlığı somut ilişki ve kanun hükümlerine göre belirlenir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-257","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tanıklıktan sebepsiz çekinme · m.60","question":"Yasal bir sebep olmaksızın tanıklık yapmaktan çekinen tanık bakımından CMK m.60’ta hangi tedbir öngörülmüştür?","options":{"A":"Her durumda doğrudan mahkûmiyet","B":"Kamu davasının düşürülmesi","C":"Tanığın sanık sıfatını alması","D":"Kanundaki koşullarla, tanıklığın yapılmasını sağlamak amacıyla en çok üç ayı geçmemek üzere disiplin hapsi"},"answer":"D","explanation":"CMK m.60, yasal sebep olmaksızın tanıklıktan veya yeminden çekinme hâlinde, tanıklığın yerine getirilmesini sağlamak için koşulları belirtilen disiplin hapsini düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-258","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Bilirkişilik · m.63","question":"Aşağıdaki konulardan hangisinde CMK m.63 anlamında bilirkişiye başvurulması kural olarak uygun olur?","options":{"A":"Hâkimin yerine hukuki hüküm kurmak","B":"Çözümü özel veya teknik bilgi gerektiren bir konuda uzman görüşü almak","C":"Sanığın suçlu olduğuna dair bağlayıcı karar verdirmek","D":"Duruşma salonunda düzeni sağlatmak"},"answer":"B","explanation":"CMK m.63 özel veya teknik bilgi gerektiren konularda bilirkişiye başvurulmasını düzenler. Bilirkişi mahkemenin yerine geçerek hüküm kuramaz.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-259","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Bilirkişi raporu · m.67","question":"Bilirkişi raporu mahkemeye sunulmuştur. Raporun yargılamadaki işlevi bakımından hangisi doğrudur?","options":{"A":"Bilirkişinin uzmanlık konusundaki değerlendirmesini içerir; delillerin değerlendirilmesi ve hüküm kurma görevi mahkemeye aittir.","B":"Sanığın savunma hakkını ortadan kaldırır.","C":"Mahkemeyi her durumda bağlar ve başka delil incelenemez.","D":"Rapor sunulunca dava kendiliğinden sona erer."},"answer":"A","explanation":"CMK m.67 bilirkişi raporuna ilişkin düzenlemeleri içerir. Bilirkişi görüşü mahkemenin delilleri değerlendirme ve hüküm kurma görevini ortadan kaldırmaz.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-260","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Keşif · m.83-84","question":"Keşif sırasında tanık veya bilirkişinin dinlenmesi gündeme gelirse hangi yaklaşım doğrudur?","options":{"A":"Keşif sırasında hiçbir kimse dinlenemez.","B":"Keşif yalnız sanığın yazılı izniyle yapılır.","C":"Keşif hükmün kesinleşmesinden sonra yapılabilir.","D":"Keşif ve bu sırada tanık veya bilirkişinin dinlenmesi CMK m.83-84’teki usule göre yürütülür."},"answer":"D","explanation":"CMK m.83 keşfi, m.84 ise keşif sırasında tanık veya bilirkişinin dinlenmesine ilişkin usulü düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-261","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Beden muayenesi · m.75-76","question":"Şüpheli veya sanığın beden muayenesi ve vücudundan örnek alınması bakımından aşağıdakilerden hangisi doğrudur?","options":{"A":"İşlem, kişinin rızası olmasa da hiçbir koşul aranmadan yapılabilir.","B":"İşlemin türüne göre CMK’de öngörülen karar, koşul ve güvencelere uyulmalıdır.","C":"Bu işlemler yalnız mağdurun sözlü talebiyle yapılır.","D":"Beden muayenesi ancak hüküm kesinleştikten sonra mümkündür."},"answer":"B","explanation":"CMK m.75-76 şüpheli, sanık ve diğer kişiler bakımından beden muayenesi ile örnek alınmasının koşul ve usullerini düzenler. Somut işlem için ilgili fıkra ve güvenceler dikkate alınmalıdır.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-262","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Genetik inceleme · m.78-80","question":"Moleküler genetik inceleme sonuçlarının kullanılması ve saklanması konusunda hangi ifade doğrudur?","options":{"A":"İnceleme sonuçları her amaçla sınırsız biçimde kullanılabilir.","B":"Genetik veriler yalnız kolluğun takdirine göre yayımlanabilir.","C":"İnceleme, sonuçların değerlendirilmesi ve verilerin kullanımı CMK m.78-80’deki sınır ve güvencelere tabidir.","D":"Genetik inceleme sonucunda mahkeme kararı olmadan kesin mahkûmiyet oluşur."},"answer":"C","explanation":"CMK m.78-80 moleküler genetik inceleme, inceleme sonuçlarının değerlendirilmesi ve verilerin kullanılmasına ilişkin sınırlamaları düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-263","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Yakalama · m.90","question":"Bir kişi, suçüstü bir fiilden dolayı izlenirken kaçma olasılığı bulunması nedeniyle geçici olarak yakalanmıştır. CMK m.90 bakımından hangisi doğrudur?","options":{"A":"Kanunda sayılan şartlar gerçekleşmişse herkes tarafından geçici yakalama yapılabilir.","B":"Geçici yakalamayı yalnız hüküm mahkemesi yapabilir.","C":"Yakalanan kişi doğrudan hükümlü sayılır.","D":"Yakalama için her durumda kesinleşmiş mahkûmiyet gerekir."},"answer":"A","explanation":"CMK m.90/1-b, suçüstü bir fiilden dolayı izlenen kişinin kaçması olasılığı bulunması veya kimliğinin hemen belirlenememesi hâlinde herkes tarafından geçici yakalama yapılabilmesini düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-264","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Gözaltı · m.91","question":"Gözaltı tedbirine ilişkin karar verilirken hangi ilke esas alınmalıdır?","options":{"A":"Gözaltı her suç isnadında otomatik uygulanır.","B":"Gözaltı süresi hiçbir kanuni sınıra tabi değildir.","C":"Gözaltı kararını mağdur verir.","D":"Kanuni koşulların varlığı ve süre sınırları gözetilmelidir; gözaltı kesinleşmiş cezanın infazı değildir."},"answer":"D","explanation":"CMK m.91 gözaltı koşullarını, yetkili makamı ve süreleri düzenler. Gözaltı bir koruma tedbiridir; kesinleşmiş cezanın infazı değildir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-265","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tutuklama · m.100","question":"I. Kuvvetli suç şüphesini gösteren somut deliller bulunmalıdır.\nII. Kanunda öngörülen bir tutuklama nedeni bulunmalıdır.\nIII. Tedbirin ölçülü olup olmadığı değerlendirilmelidir.\nIV. Suç isnadının bulunması, diğer koşullar aranmaksızın tutuklamayı zorunlu kılar.\nCMK m.100 bakımından hangileri doğrudur?","options":{"A":"I ve IV","B":"I, II ve III","C":"II ve IV","D":"I, III ve IV"},"answer":"B","explanation":"CMK m.100 kuvvetli suç şüphesini gösteren somut delil, tutuklama nedeni ve ölçülülük şartlarını düzenler. Suç isnadı tek başına otomatik tutuklama için yeterli değildir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-266","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Arama · m.119","question":"Cumhuriyet savcısına ulaşılabilen bir durumda, konutta arama yapılması için kolluk amirinin tek başına yazılı emir vermesinin yeterli olduğu ileri sürülmüştür. Hangisi doğrudur?","options":{"A":"Her aramada kolluk amirinin emri tek başına yeterlidir.","B":"Konut araması için herhangi bir karar veya emir gerekmez.","C":"Konutta arama bakımından hâkim kararı veya gecikmesinde sakınca bulunan hâllerde kanunun yetkilendirdiği merciin emri gerekir; kolluk amirinin yetkisi kanuni şartlara bağlıdır.","D":"Arama ancak mahkûmiyet kesinleşince yapılabilir."},"answer":"C","explanation":"CMK m.119 arama kararı ve emir yetkisini düzenler. Konut aramasında karar/emir yetkisi ve gecikmesinde sakınca koşulları kanun metnine göre değerlendirilmelidir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-267","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · El koyma · m.123","question":"İspat aracı olarak yararlı görülen veya müsadereye tabi olabilecek bir eşya bakımından, rıza ile teslim gerçekleşmezse hangi koruma tedbiri gündeme gelebilir?","options":{"A":"Eşyaya el koyma","B":"İddianamenin iadesi","C":"Tanıklıktan çekinme","D":"Duruşmanın nakli"},"answer":"A","explanation":"CMK m.123, ispat aracı olarak yararlı görülen veya müsadereye tabi olan eşya bakımından muhafaza altına alma ve el koyma düzenlemesinin temelini oluşturur.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-268","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İletişimin denetlenmesi · m.135","question":"İletişimin denetlenmesi tedbiri için yalnızca suç şüphesinin bulunması yeterli midir?","options":{"A":"Evet, her suçta otomatik uygulanır.","B":"Evet, karar usulü aranmaz.","C":"Evet, yalnız mağdurun talebi yeterlidir.","D":"Hayır; suçun kanuni kapsama girmesi, diğer şartlar ve yetkili merciin karar usulü birlikte değerlendirilir."},"answer":"D","explanation":"CMK m.135 iletişimin denetlenmesini belirli suçlar ve kanuni koşullarla sınırlandırır; yalnızca genel şüphe bulunması tedbir için tek başına yeterli değildir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-269","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İfade alma ve sorgu · m.147","question":"Aşağıdakilerden hangisi şüphelinin ifade alınması sırasında CMK m.147’de düzenlenen haklarından biridir?","options":{"A":"Hükmü kendisinin vermesi","B":"Susma hakkının bulunması ve müdafi yardımından yararlanabilmesi","C":"İsnadın kendisine açıklanmaması","D":"Savunma delili sunmasının yasaklanması"},"answer":"B","explanation":"CMK m.147, şüpheliye isnadın bildirilmesi, müdafi yardımından yararlanma ve susma hakkı gibi güvenceler tanır.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-270","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İddianamenin iadesi · m.174","question":"Mahkeme iddianameyi incelediğinde, kanunda sayılan iade nedenlerinden birinin bulunduğunu tespit etmiştir. Aşağıdakilerden hangisi bu aşamada verilebilecek karardır?","options":{"A":"Sanığın doğrudan mahkûmiyeti","B":"Kesinleşmiş cezanın infazı","C":"İddianamenin iadesi","D":"Tanığın sanık olarak kaydedilmesi"},"answer":"C","explanation":"CMK m.174, kanunda sayılan nedenler varsa iddianamenin iadesini düzenler. İade kararı mahkûmiyet veya cezanın infazı değildir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-271","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Duruşmanın açıklığı · m.182-183","question":"I. Duruşma kural olarak alenidir.\nII. Duruşmada görüntü ve ses kaydı alınması konusunda kanuni sınırlamalar vardır.\nIII. Duruşmanın aleni olması, herkesin duruşmayı sınırsız biçimde kaydedip yayımlayabileceği anlamına gelir.\nHangileri doğrudur?","options":{"A":"Yalnız I","B":"I ve III","C":"II ve III","D":"I ve II"},"answer":"D","explanation":"CMK m.182 duruşmanın açıklığı ilkesini, m.183 ise duruşmada ses ve görüntü kaydına ilişkin sınırlamaları düzenler. Aleniyet sınırsız kayıt ve yayın hakkı vermez.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-272","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Delillerin değerlendirilmesi · m.217","question":"Mahkeme, hüküm kurarken yalnız soruşturma evresinde dosyaya giren ancak duruşmada ortaya konulup tartışılmayan bir belgeye dayanmak istemektedir. CMK m.217 bakımından hangisi doğrudur?","options":{"A":"Hüküm, duruşmada ortaya konulup tartışılan delillere dayanmalıdır; deliller hukuka uygun elde edilmiş olmalıdır.","B":"Dosyaya girmiş her belge tartışılmadan hükme esas alınır.","C":"Delilin hukuka aykırı elde edilmesi önemsizdir.","D":"Hüküm yalnız tarafların kişisel kanaatine dayanır."},"answer":"A","explanation":"CMK m.217/1 hükmün duruşmada ortaya konulup tartışılan delillere dayanmasını; m.217/2 ise suçun hukuka uygun elde edilmiş delillerle ispatını düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-273","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Hüküm çeşitleri · m.223","question":"Mahkeme, yüklenen suçun sanık tarafından işlendiğinin sabit olmadığı sonucuna varmıştır. CMK m.223’e göre hangi hüküm verilir?","options":{"A":"Mahkûmiyet","B":"Beraat","C":"Tutuklama","D":"İddianamenin iadesi"},"answer":"B","explanation":"CMK m.223/2-e, yüklenen suçun sanık tarafından işlendiğinin sabit olmamasını beraat nedenlerinden biri olarak düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-274","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Kanun yolları · m.267-268","question":"Kanunun başka bir kanun yolu öngörmediği ve kararın itiraza açık olduğu durumda, itiraz başvurusunun yapılacağı merci bakımından genel kural hangisidir?","options":{"A":"Her durumda doğrudan Anayasa Mahkemesi","B":"Yalnız kolluk amiri","C":"Kural olarak kararı veren merci","D":"Yalnız infaz kurumu müdürü"},"answer":"C","explanation":"CMK m.268/1’e göre özel düzenleme yoksa itiraz, kararı veren mercie dilekçeyle veya tutanağa geçirilmek üzere beyanda bulunularak yapılır.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-275","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Karma öncüllü soru · m.2, 63, 90, 217, 223","question":"I. Şüpheli, soruşturma evresinde suç şüphesi altında bulunan kişidir.\nII. Bilirkişi, özel veya teknik bilgi gerektiren konuda görüş bildirir; mahkeme yerine hüküm kurmaz.\nIII. Herkes tarafından geçici yakalama, CMK m.90’da sayılan hâllerde ve kanuni koşullarla mümkündür.\nIV. Yüklenen suçun sanık tarafından işlendiği sabit değilse mahkûmiyet kararı verilmesi zorunludur.\nYukarıdaki ifadelerden hangileri doğrudur?","options":{"A":"I ve IV","B":"I, II ve IV","C":"II, III ve IV","D":"I, II ve III"},"answer":"D","explanation":"I, CMK m.2’deki tanıma; II, m.63’teki bilirkişilik amacına; III, m.90’daki geçici yakalama hâllerine uygundur. IV yanlıştır; suçun sanık tarafından işlendiği sabit değilse m.223/2-e uyarınca beraat kararı verilir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-276","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Görev m.4-7","question":"İddianamenin kabulünden sonra mahkeme davanın görev alanı dışında kaldığını fark ederse hangisi doğrudur?","options":{"A":"Görevsizlik kararıyla işi görevli mahkemeye gönderir; adlî yargı içindeki karara itiraz edilebilir.","B":"Görevi yalnız sanık ileri sürerse inceleyebilir.","C":"Hukuki nitelik değişince dosya mutlaka alt dereceye gönderilir.","D":"Görevsizlik kararı kesin olup kanun yolu yoktur."},"answer":"A","explanation":"CMK m.4-5 görev konusunun re’sen incelenmesini ve görevsizlik kararını düzenler; m.6 hukuki nitelik değişti diye dosyanın alt dereceye gönderilmesini yasaklar.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-277","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Bağlantı m.8-11","question":"Bir kişi iki suçtan sanık, başka biri suç delillerini gizlemekle suçlanıyor. Hangisi doğrudur?","options":{"A":"Bağlantı için ortak suç işleme iradesi şarttır.","B":"Bir kişinin birden fazla suçtan sanık olması ve delilleri gizleme fiilleri bağlantı kapsamında olabilir.","C":"Bağlantı yalnız aynı gün işlenen suçlarda vardır.","D":"Bağlantılı davalar birleştirilemez."},"answer":"B","expl
