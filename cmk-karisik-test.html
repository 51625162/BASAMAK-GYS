const questions=[{"id":"cmk5271-mixed-001","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tanımlar · Madde 2","question":"I. Şüpheli, soruşturma evresinde suç şüphesi altındaki kişidir.\nII. Sanık, kovuşturmanın başlamasından hükmün kesinleşmesine kadar suç şüphesi altındaki kişidir.\nIII. Müdafi, mağduru temsil eden avukattır.\nHangileri doğrudur?","options":{"A":"I ve II","B":"Yalnız I","C":"II ve III","D":"I, II ve III"},"answer":"A","explanation":"I ve II doğrudur. Müdafi şüpheli veya sanığın savunmasını yapan avukattır; mağdurun avukatı vekildir.","pool":"mixed"},{"id":"cmk5271-mixed-002","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Soruşturma ve kovuşturma · Madde 2","question":"Soruşturma evresinin sona erdiği sınır aşağıdakilerden hangisidir?","options":{"A":"İddianamenin kabulü","B":"İlk ifade alma","C":"Suçun işlendiği an","D":"Hükmün kesinleşmesi"},"answer":"A","explanation":"CMK m. 2'ye göre soruşturma, suç şüphesinin öğrenilmesinden iddianamenin kabulüne kadar sürer.","pool":"mixed"},{"id":"cmk5271-mixed-003","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Görev · Madde 3-7","question":"Mahkemenin görevine ilişkin aşağıdakilerden hangisi yanlıştır?","options":{"A":"Görev kanunla belirlenir.","B":"Görev uyuşmazlığı kanundaki usulle çözülür.","C":"Görev kuralları ceza muhakemesinin parçasıdır.","D":"Mahkeme hiçbir aşamada görevini değerlendiremez."},"answer":"D","explanation":"CMK m. 4 ve devamı görev konusundaki karar ve uyuşmazlıkları düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-004","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Bağlantı · Madde 8-11","question":"Bağlantılı ceza davaları hakkında hangi ifade doğrudur?","options":{"A":"Birleştirme veya ayırma kanuni koşullara göre değerlendirilebilir.","B":"Her bağlantılı dava mutlaka birleştirilir.","C":"Bağlantı yalnız hukuk davalarında olur.","D":"Bağlantı mahkemenin görevini kendiliğinden kaldırır."},"answer":"A","explanation":"CMK m. 8-11 bağlantıyı ve bağlantılı davaların birleştirilmesi veya ayrılmasını düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-005","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Yetki · Madde 12","question":"Genel yetki kuralına göre davaya bakmakla yetkili mahkeme kural olarak hangisidir?","options":{"A":"Şüphelinin doğduğu yer","B":"Mağdurun seçtiği yer","C":"Suçun işlendiği yer","D":"Her durumda Yargıtay"},"answer":"C","explanation":"CMK m. 12'de genel yetki kuralı suçun işlendiği yer mahkemesidir; özel yetki hükümleri saklıdır.","pool":"mixed"},{"id":"cmk5271-mixed-006","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Hâkimin reddi · Madde 22-31","question":"Tarafsızlık konusunda kanuni ret sebebi bulunması hâlinde hangi kurum gündeme gelir?","options":{"A":"İddianamenin kabulü","B":"Hâkimin reddi istemi","C":"Davanın otomatik düşmesi","D":"Hükmün infazı"},"answer":"B","explanation":"CMK m. 22-31 hâkimin davaya bakamayacağı hâlleri, reddini ve ilgili usulü düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-007","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Yakalama · Madde 90","question":"Suçüstü hâlinde geçici yakalamaya ilişkin doğru ifade hangisidir?","options":{"A":"Yalnız mahkeme başkanı yapabilir.","B":"Önceden kesinleşmiş mahkûmiyet gerekir.","C":"Yalnız mağdur yazılı talepte bulunabilir.","D":"Kanunda belirtilen hâllerde herkes geçici yakalama yapabilir."},"answer":"D","explanation":"CMK m. 90/1, kanunda belirtilen suçüstü hâllerinde herkes tarafından geçici yakalamaya imkân tanır.","pool":"mixed"},{"id":"cmk5271-mixed-008","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tutuklama · Madde 100","question":"Tutuklama tedbiri için aşağıdakilerden hangisi gereklidir?","options":{"A":"Kanuni koşulların ve tutuklama nedeninin bulunması","B":"Her suç şüphesinde otomatik tutuklama","C":"Kesinleşmiş mahkûmiyet","D":"Mağdurun karar vermesi"},"answer":"A","explanation":"CMK m. 100 tutuklama nedenlerini ve koşullarını düzenler; tutuklama otomatik değildir.","pool":"mixed"},{"id":"cmk5271-mixed-009","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Arama · Madde 116-119","question":"Arama kararı veya emri bakımından genel kurala uygun ifade hangisidir?","options":{"A":"Her koşulda sözlü talimat yeterlidir.","B":"Hiçbir zaman hâkim kararı aranmaz.","C":"Hâkim kararı; gecikmesinde sakınca bulunan hâllerde kanundaki yetkililerin yazılı emri söz konusu olabilir.","D":"Kararı yalnız şikâyetçi verir."},"answer":"C","explanation":"CMK m. 119, hâkim kararı ve kanunda belirtilen hâllerde yazılı emirle arama yapılmasını düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-010","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İfade ve sorgu · Madde 147","question":"Şüpheli veya sanığın ifade ve sorgudaki haklarından biri hangisidir?","options":{"A":"Susma hakkının bulunmaması","B":"Müdafi yardımından yararlanma","C":"Suçu kabul etmeye zorlanma","D":"Lehine delil gösterememe"},"answer":"B","explanation":"CMK m. 147, müdafi yardımından yararlanma ve susma hakkı gibi güvenceleri içerir.","pool":"mixed"},{"id":"cmk5271-mixed-011","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Cumhuriyet savcısı · Madde 160","question":"Cumhuriyet savcısı suç işlendiği izlenimini veren hâli öğrenince ne yapmalıdır?","options":{"A":"Yalnız aleyhe delil toplamalıdır.","B":"Mahkûmiyet hükmü kurmalıdır.","C":"Soruşturma yapmadan dosyayı kapatmalıdır.","D":"Lehe ve aleyhe delilleri toplayarak maddi gerçeği araştırmalıdır."},"answer":"D","explanation":"CMK m. 160 uyarınca savcı, şüphelinin lehine ve aleyhine delilleri toplar.","pool":"mixed"},{"id":"cmk5271-mixed-012","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İddianame · Madde 170","question":"İddianame düzenlenmesi için hangi koşul aranır?","options":{"A":"Toplanan delillerin yeterli şüphe oluşturması","B":"Şüphelinin mutlaka ikrar etmesi","C":"Mahkûmiyetin önceden kesinleşmesi","D":"Mağdurun hâkim ataması"},"answer":"A","explanation":"CMK m. 170, toplanan deliller suçun işlendiği hususunda yeterli şüphe oluşturduğunda iddianame düzenlenmesini öngörür.","pool":"mixed"},{"id":"cmk5271-mixed-013","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İddianamenin iadesi · Madde 174","question":"İddianamenin iadesiyle ilgili doğru ifade hangisidir?","options":{"A":"Her yazım hatasında zorunludur.","B":"Mahkeme inceleme yapmadan kabul eder.","C":"Kanunda belirtilen nedenler varsa iade gündeme gelebilir.","D":"İade, mahkûmiyet anlamına gelir."},"answer":"C","explanation":"CMK m. 174 iddianamenin iadesi nedenlerini ve usulünü düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-014","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Savunma delilleri · Madde 177-178","question":"I. Sanık savunma delillerinin toplanmasını isteyebilir.\nII. Kanundaki koşullarda çağrılması reddedilen tanık doğrudan mahkemeye getirilebilir.\nIII. Savunma delilleri hiçbir zaman dikkate alınmaz.\nHangileri doğrudur?","options":{"A":"Yalnız I","B":"Yalnız III","C":"I ve III","D":"I ve II"},"answer":"D","explanation":"I ve II doğrudur. CMK m. 177-178 savunma delilleri ve tanığın doğrudan mahkemeye getirilmesini düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-015","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Duruşmanın kapalılığı · Madde 185","question":"Sanığın on sekiz yaşını doldurmamış olması hâlinde duruşma nasıl yapılır?","options":{"A":"Her durumda canlı yayımlanır.","B":"Kapalı yapılır.","C":"Yalnız kolluk katılır.","D":"Duruşmasız hüküm kurulur."},"answer":"B","explanation":"CMK m. 185, sanık on sekiz yaşını doldurmamışsa duruşmanın kapalı yapılmasını öngörür.","pool":"mixed"},{"id":"cmk5271-mixed-016","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Deliller · Madde 206","question":"Duruşmada delillerin ortaya konulması bakımından doğru ifade hangisidir?","options":{"A":"Her delil incelemesiz kabul edilir.","B":"Delilleri yalnız sanık değerlendirir.","C":"Kanunda belirtilen hâllerde delilin ortaya konulması reddedilebilir.","D":"Deliller yalnız hüküm kesinleştikten sonra sunulur."},"answer":"C","explanation":"CMK m. 206 delillerin ortaya konulmasının reddedilebileceği hâlleri düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-017","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Delillerin değerlendirilmesi · Madde 217","question":"Hâkim hükmünü hangi delillere dayandırabilir?","options":{"A":"Duruşmaya getirilmiş ve huzurunda tartışılmış delillere","B":"Yalnız söylentiye","C":"Yalnız kolluk kanaatine","D":"Tartışılmamış her belgeye"},"answer":"A","explanation":"CMK m. 217 uyarınca hüküm, duruşmaya getirilmiş ve huzurunda tartışılmış delillere dayandırılır.","pool":"mixed"},{"id":"cmk5271-mixed-018","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Hüküm türleri · Madde 223","question":"Yüklenen suçun sanık tarafından işlendiği sabit olmazsa hangi hüküm verilir?","options":{"A":"Tutuklama","B":"İddianamenin iadesi","C":"Yakalama","D":"Beraat"},"answer":"D","explanation":"CMK m. 223 kapsamında suçun sanık tarafından işlendiğinin sabit olmaması beraat nedenidir.","pool":"mixed"},{"id":"cmk5271-mixed-019","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · HAGB · Madde 231","question":"Hükmün açıklanmasının geri bırakılması için hangi yaklaşım doğrudur?","options":{"A":"Her dosyada otomatik uygulanır.","B":"Kanuni koşullar somut olayda değerlendirilir.","C":"Savunma hakkını kaldırır.","D":"Kolluk tarafından kararlaştırılır."},"answer":"B","explanation":"CMK m. 231 koşul ve sonuçları düzenler; uygulama yürürlükteki kanuni düzenleme çerçevesinde değerlendirilmelidir.","pool":"mixed"},{"id":"cmk5271-mixed-020","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İtiraz · Madde 267","question":"Hâkim kararları ile kanunun gösterdiği hâllerde mahkeme kararlarına karşı başvurulan olağan kanun yolu hangisidir?","options":{"A":"Yargılamanın yenilenmesi","B":"Temyiz","C":"İtiraz","D":"Kanun yararına bozma"},"answer":"C","explanation":"CMK m. 267 ve devamı itiraz kanun yolunu düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-021","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İstinaf · Madde 272","question":"İlk derece mahkemesi hükmüne karşı kanuni koşullarda bölge adliye mahkemesine yapılan başvuru hangisidir?","options":{"A":"İstinaf","B":"İtiraz","C":"Yargılamanın yenilenmesi","D":"Kanun yararına bozma"},"answer":"A","explanation":"CMK m. 272 ve devamı istinaf kanun yolunu düzenler; kanuni istisnalar saklıdır.","pool":"mixed"},{"id":"cmk5271-mixed-022","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Temyiz · Madde 286","question":"Bölge adliye mahkemesi kararlarının temyize açıklığı nasıl belirlenir?","options":{"A":"Taraf isterse tüm kararlar temyiz edilir.","B":"Kararın başlığı tek başına yeterlidir.","C":"Yalnız mağdur kabul ederse temyiz mümkündür.","D":"CMK'daki temyize açıklık ve istisna hükümleri esas alınır."},"answer":"D","explanation":"CMK m. 286 ve devamı temyiz edilebilecek kararları ve istisnaları belirler.","pool":"mixed"},{"id":"cmk5271-mixed-023","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Yargıtay Cumhuriyet Başsavcısının itirazı · Madde 308","question":"Yargıtay Cumhuriyet Başsavcısının itiraz yetkisi hangi maddede düzenlenir?","options":{"A":"Madde 100","B":"Madde 170","C":"Madde 308","D":"Madde 267"},"answer":"C","explanation":"CMK m. 308, Yargıtay Cumhuriyet Başsavcısının itirazını düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-024","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Yargılamanın yenilenmesi · Madde 311","question":"Kesinleşmiş hüküm hakkında kanunda sayılan yenileme nedenlerinden biri varsa hangi olağanüstü kanun yolu gündeme gelebilir?","options":{"A":"İfade alma","B":"Yargılamanın yenilenmesi","C":"Yakalama","D":"Görevsizlik"},"answer":"B","explanation":"CMK m. 311 ve devamı, kesinleşmiş hükümlere karşı yargılamanın yenilenmesini düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-025","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Önermeli soru · Madde 2 ve 160","question":"I. Müdafi, şüpheli veya sanığın savunmasını yapan avukattır.\nII. Cumhuriyet savcısı yalnız aleyhe delilleri toplar.\nIII. Soruşturma iddianamenin kabulüne kadar sürer.\nHangileri doğrudur?","options":{"A":"Yalnız II","B":"I ve III","C":"I ve II","D":"I, II ve III"},"answer":"B","explanation":"I ve III doğrudur. CMK m. 160 savcının lehe ve aleyhe delilleri toplamasını gerektirir.","pool":"mixed"},{"id":"cmk5271-mixed-026","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Müdafiin dosyayı incelemesi · Madde 153","question":"Müdafiin soruşturma dosyasını incelemesiyle ilgili doğru ifade hangisidir?","options":{"A":"Müdafi dosyayı hiçbir koşulda inceleyemez.","B":"Dosyayı inceleme hakkı kanunda düzenlenmiş, bazı hâllerde kısıtlamaya tabi tutulmuştur.","C":"Dosyayı yalnız mağdur inceleyebilir.","D":"Dosya inceleme hakkı sadece hüküm kesinleştikten sonra doğar."},"answer":"B","explanation":"CMK m. 153, müdafiin soruşturma evrakını incelemesini ve kanunda öngörülen koşullardaki kısıtlama kararını düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-027","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Mağdurun hakları · Madde 234","question":"Mağdurun soruşturma ve kovuşturmadaki haklarına ilişkin aşağıdaki önermelerden hangisi doğrudur?","options":{"A":"Mağdurun hiçbir bilgi alma hakkı yoktur.","B":"Mağdur her durumda hükmü tek başına belirler.","C":"Kanundaki koşullarla delil toplanmasını isteme ve davaya katılma gibi hakları bulunabilir.","D":"Mağdur yalnız sanık sıfatıyla dinlenebilir."},"answer":"C","explanation":"CMK m. 234 mağdur ve şikâyetçinin haklarını düzenler; hakların kapsamı evreye ve kanuni koşullara göre belirlenir.","pool":"mixed"},{"id":"cmk5271-mixed-028","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tanıklık · Madde 45-46","question":"Tanıklıktan çekinme bakımından doğru yaklaşım hangisidir?","options":{"A":"Kanun, belirli yakınlık ilişkileri ve meslek sırları bakımından çekinme hükümleri öngörür.","B":"Hiç kimse tanıklıktan çekinemez.","C":"Tanıklıktan çekinme yalnız sanığın kararına bağlıdır.","D":"Tanık her durumda cevap vermek zorundadır."},"answer":"A","explanation":"CMK m. 45 ve devamında kişisel yakınlık ve meslek sırrı gibi nedenlerle tanıklıktan çekinme hükümleri yer alır.","pool":"mixed"},{"id":"cmk5271-mixed-029","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Bilirkişi · Madde 63","question":"Çözümü özel veya teknik bilgiyi gerektiren konularda mahkeme hangi kuruma başvurabilir?","options":{"A":"Yalnız mağdura","B":"Her durumda kolluk amirine","C":"Yalnız sanığın yakınına","D":"Bilirkişiye"},"answer":"D","explanation":"CMK m. 63 uyarınca çözümü uzmanlığı, özel veya teknik bilgiyi gerektiren konularda bilirkişinin oy ve görüşüne başvurulabilir.","pool":"mixed"},{"id":"cmk5271-mixed-030","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İfade alma · Madde 147","question":"İfade veya sorgu sırasında şüpheliye/sanığa hatırlatılması gereken güvenceler arasında hangisi bulunur?","options":{"A":"Suçu kabul etme zorunluluğu","B":"Susma hakkı ve müdafi yardımından yararlanma hakkı","C":"Lehe delil gösterememe","D":"İsnadı öğrenememe"},"answer":"B","explanation":"CMK m. 147; isnadın bildirilmesi, müdafi yardımından yararlanma ve susma hakkı gibi güvenceleri düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-031","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Cumhuriyet savcısının görevleri · Madde 160-161","question":"Cumhuriyet savcısının soruşturmadaki rolünü en doğru anlatan seçenek hangisidir?","options":{"A":"Yalnız sanık lehine delil toplar.","B":"Mahkeme yerine mahkûmiyet kararı verir.","C":"Maddi gerçeği araştırır; leh ve aleyhe delilleri toplar ve muhafaza eder.","D":"Sadece şikâyetçinin talimatıyla işlem yapar."},"answer":"C","explanation":"CMK m. 160-161 savcının maddi gerçeği araştırma ve delilleri toplama görevleriyle soruşturma yetkilerini düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-032","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İddianame · Madde 170","question":"Aşağıdakilerden hangisi iddianamenin düzenlenmesine ilişkin genel ölçüttür?","options":{"A":"Toplanan delillerin suçun işlendiği hususunda yeterli şüphe oluşturması","B":"Şüphelinin suçu mutlaka ikrar etmesi","C":"Mahkûmiyet hükmünün önceden kesinleşmesi","D":"Mağdurun cezayı belirlemesi"},"answer":"A","ex ğrudur?","options":{"A":"Hiçbir şekilde soramaz.","B":"Yalnız sanık sorabilir.","C":"Yalnız duruşma bittikten sonra sorabilir.","D":"Kanundaki usule göre doğrudan soru yöneltebilir; diğer kişiler hâkim aracılığıyla sorar."},"answer":"D","explanation":"CMK m.201 savcı, müdafi ve vekile doğrudan soru yöneltme olanağı tanır.","pool":"mixed"},{"id":"cmk5271-mixed-218","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Deliller m.217","question":"Mahkeme duruşmada tartışılmamış bir belgeye dayanmak istemektedir. Hangisi doğrudur?","options":{"A":"Dosyadaki her belge esas alınır.","B":"Yalnız kolluk tutanağı delildir.","C":"Hüküm, duruşmada ortaya konulup tartışılan hukuka uygun delillere dayanmalıdır.","D":"Hâkim tarafların kabulüyle bağlıdır."},"answer":"C","explanation":"CMK m.217 hükmün duruşmada ortaya konulup tartışılan ve hukuka uygun elde edilmiş delillere dayanmasını öngörür.","pool":"mixed"},{"id":"cmk5271-mixed-219","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Beraat m.223","question":"Yüklenen fiilin sanık tarafından işlendiği sabit değilse hangi hüküm gündeme gelir?","options":{"A":"Tutuklama","B":"Görevsizlik","C":"Zorla getirme","D":"Beraat"},"answer":"D","explanation":"CMK m.223 kapsamında yüklenen fiilin sanık tarafından işlendiğinin sabit olmaması beraat nedenidir.","pool":"mixed"},{"id":"cmk5271-mixed-220","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Kanun yolu m.260","question":"Cumhuriyet savcısı sanık lehine kanun yoluna başvurabilir mi?","options":{"A":"Yalnız aleyhe başvurabilir.","B":"Evet, sanık lehine de başvurabilir.","C":"Hiçbir karara başvuramaz.","D":"Yalnız kesinleşmeden sonra başvurabilir."},"answer":"B","explanation":"CMK m.260/3 savcının sanık lehine de kanun yoluna başvurabileceğini açıkça düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-221","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İtiraz m.267","question":"Kanunda başka yol öngörülmeyen hâkim kararına karşı hangi olağan kanun yolu gündeme gelebilir?","options":{"A":"Yargılamanın yenilenmesi","B":"Her durumda temyiz","C":"İtiraz","D":"Kanun yararına bozma"},"answer":"C","explanation":"CMK m.267 hâkim kararlarına ve kanunun gösterdiği hâllerde mahkeme kararlarına karşı itirazı düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-222","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Bağlantı m.8-11","question":"İki dava arasında bağlantı bulunduğunda hangisi doğrudur?","options":{"A":"Kanuni koşullarla birleştirme veya ayırma değerlendirilebilir.","B":"Tüm davalar otomatik düşer.","C":"Bağlantı yalnız kesinleşmiş hükümler arasında kurulur.","D":"Birlikte görülmeleri yasaktır."},"answer":"A","explanation":"CMK m.8-11 bağlantı ve buna bağlı birleştirme-ayırma usulünü düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-223","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Hâkimin reddi m.24-31","question":"Sanık, tarafsızlık konusunda somut bir nedenle hâkimin reddini istemektedir. Hangisi doğrudur?","options":{"A":"İstem yapılamaz.","B":"Her istem gerekçesiz kabul edilir.","C":"Yalnız hüküm kesinleşince istenir.","D":"İstem kanuni usul ve sürede yapılmalı; sebep ve delil gösterilmelidir."},"answer":"D","explanation":"CMK m.24 ve devamı hâkimin reddini, m.26 ve m.31 ise istemin usulünü ve geri çevrilmesini düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-224","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Eski hâle getirme m.40-42","question":"Kişi kusuru olmaksızın bir süreyi kaçırmıştır. Hangi kurum gündeme gelebilir?","options":{"A":"El koyma","B":"Eski hâle getirme","C":"Gözlem altına alma","D":"Birleştirme"},"answer":"B","explanation":"CMK m.40 ve devamı kusuru olmaksızın süreyi kaçıran kişinin eski hâle getirme istemini düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-225","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tanımlar m.2","question":"I. Şüpheli soruşturmada suç şüphesi altındaki kişidir. II. Sanık kovuşturmanın başlamasından hükmün kesinleşmesine kadar suç şüphesi altındaki kişidir. III. Müdafi suçtan zarar görenin avukatıdır. Hangileri doğrudur?","options":{"A":"Yalnız I","B":"I ve III","C":"Yalnız II","D":"I ve II"},"answer":"D","explanation":"CMK m.2'de I ve II doğrudur. Müdafi şüpheli veya sanığın savunmasını yapar; suçtan zarar göreni temsil eden avukat vekildir.","pool":"mixed"}];const app=document.getElementById("app");let order=questions.slice().sort(()=>Math.random()-.5),index=0,answers={},showAnswer={};

function render(){if(index>=order.length){finish();return;}const q=order[index],pick=answers[q.id],done=pick!==undefined;

function finish(){const answered=order.filter(q=>answers[q.id]!==undefined),correct=answered.filter(q=>answers[q.id]===q.answer).length;app.innerHTML='<div class="summary"><h2>Test tamamlandı</h2><p>Toplam soru: <b>'+order.length+'</b></p><p>Cevaplanan: <b>'+answered.length+'</b></p><p>Doğru: <b>'+correct+'</b> · Yanlış: <b>'+(answered.length-correct)+'</b></p><p>Başarı oranı: <b>'+Math.round(correct/Math.max(1,answered.length)*100)+'%</b></p><button class="restart" id="restart">Yeni karışık test</button><p><a class="back" href="soru-coz.html">Soru Çöz bölümüne dön</a></p></div>';document.getElementById("restart").onclick=()=>{order=questions.slice().sort(()=>Math.random()-.5);index=0;answers={};showAnswer={};render();};}render();
