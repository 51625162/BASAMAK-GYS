*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#18334d;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.top{background:#122943;color:white;padding:18px 16px;font-weight:800;font-size:19px}.wrap{max-width:760px;margin:0 auto;padding:16px}.back{display:inline-block;color:#1768c5;text-decoration:none;font-weight:700;margin:3px 0 14px}.shell{background:white;border:1px solid #dce5ee;border-radius:18px;padding:16px;box-shadow:0 8px 24px #20364d0b}.head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:750}.progress{height:8px;background:#e3eaf1;border-radius:20px;overflow:hidden;margin:13px 0}.progress span{display:block;height:100%;background:#129d96}.subject{background:#e8f8f1;color:#176d58;border-radius:12px;padding:11px;margin:12px 0;font-size:14px}.card{border:1px solid #e0e8f0;border-radius:15px;padding:15px}.card h2{font-size:18px;line-height:1.55;margin:6px 0 17px}.option{display:flex;align-items:flex-start;gap:10px;padding:13px;border:1px solid #dbe4ee;border-radius:12px;margin:9px 0;cursor:pointer;line-height:1.45}.option:has(input:checked){border-color:#1684f8;background:#eaf3ff}.option.correct-option{border-color:#35a875;background:#e2f6ec}.option.wrong-option{border-color:#e85e67;background:#fff0f0}.option input{margin-top:4px;accent-color:#1684f8}.nav{display:flex;gap:10px;margin-top:15px}.nav button,.finish,.restart{flex:1;border:0;border-radius:11px;padding:13px 9px;font-weight:750;cursor:pointer;background:#129d96;color:white}.nav button:disabled{background:#e0e5eb;color:#78899a}.finish{background:#e85e67;flex:0}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin-top:14px}.grid button{padding:10px 0;border:1px solid #d7e1eb;border-radius:9px;background:white;color:#24415d}.grid button.current{background:#1768c5;color:white}.grid button.done{background:#e2f6ec;border-color:#9ed9bb}.feedback{margin-top:10px;line-height:1.5}.good{background:#e2f6ec;padding:12px;border-radius:10px}.bad{background:#fff0f0;padding:12px;border-radius:10px}.note{font-size:13px;color:#63778c;margin-bottom:0}.summary{text-align:center}.summary h2{font-size:25px}@media(max-width:430px){.wrap{padding:11px}.shell{padding:12px}.card{padding:12px}.card h2{font-size:17px}}
</style></head><body><header class="top">BASAMAK GYS · CMK Karışık Test</header><main class="wrap"><a class="back" href="soru-coz.html">← Soru Çöz bölümüne dön</a><div class="shell" id="app"></div></main><script>
const questions=[{"id":"cmk5271-mixed-001","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tanımlar · Madde 2","question":"I. Şüpheli, soruşturma evresinde suç şüphesi altındaki kişidir.\nII. Sanık, kovuşturmanın başlamasından hükmün kesinleşmesine kadar suç şüphesi altındaki kişidir.\nIII. Müdafi, mağduru temsil eden avukattır.\nHangileri doğrudur?","options":{"A":"I ve II","B":"Yalnız I","C":"II ve III","D":"I, II ve III"},"answer":"A","explanation":"I ve II doğrudur. Müdafi şüpheli veya sanığın savunmasını yapan avukattır; mağdurun avukatı vekildir.","pool":"mixed"},{"id":"cmk5271-mixed-002","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Soruşturma ve kovuşturma · Madde 2","question":"Soruşturma evresinin sona erdiği sınır aşağıdakilerden hangisidir?","options":{"A":"İddianamenin kabulü","B":"İlk ifade alma","C":"Suçun işlendiği an","D":"Hükmün kesinleşmesi"},"answer":"A","explanation":"CMK m. 2'ye göre soruşturma, suç şüphesinin öğrenilmesinden iddianamenin kabulüne kadar sürer.","pool":"mixed"},{"id":"cmk5271-mixed-003","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Görev · Madde 3-7","question":"Mahkemenin görevine ilişkin aşağıdakilerden hangisi yanlıştır?","options":{"A":"Görev kanunla belirlenir.","B":"Görev uyuşmazlığı kanundaki usulle çözülür.","C":"Görev kuralları ceza muhakemesinin parçasıdır.","D":"Mahkeme hiçbir aşamada görevini değerlendiremez."},"answer":"D","explanation":"CMK m. 4 ve devamı görev konusundaki karar ve uyuşmazlıkları düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-004","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Bağlantı · Madde 8-11","question":"Bağlantılı ceza davaları hakkında hangi ifade doğrudur?","options":{"A":"Birleştirme veya ayırma kanuni koşullara göre değerlendirilebilir.","B":"Her bağlantılı dava mutlaka birleştirilir.","C":"Bağlantı yalnız hukuk davalarında olur.","D":"Bağlantı mahkemenin görevini kendiliğinden kaldırır."},"answer":"A","explanation":"CMK m. 8-11 bağlantıyı ve bağlantılı davaların birleştirilmesi veya ayrılmasını düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-005","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Yetki · Madde 12","question":"Genel yetki kuralına göre davaya bakmakla yetkili mahkeme kural olarak hangisidir?","options":{"A":"Şüphelinin doğduğu yer","B":"Mağdurun seçtiği yer","C":"Suçun işlendiği yer","D":"Her durumda Yargıtay"},"answer":"C","explanation":"CMK m. 12'de genel yetki kuralı suçun işlendiği yer mahkemesidir; özel yetki hükümleri saklıdır.","pool":"mixed"},{"id":"cmk5271-mixed-006","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Hâkimin reddi · Madde 22-31","question":"Tarafsızlık konusunda kanuni ret sebebi bulunması hâlinde hangi kurum gündeme gelir?","options":{"A":"İddianamenin kabulü","B":"Hâkimin reddi istemi","C":"Davanın otomatik düşmesi","D":"Hükmün infazı"},"answer":"B","explanation":"CMK m. 22-31 hâkimin davaya bakamayacağı hâlleri, reddini ve ilgili usulü düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-007","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Yakalama · Madde 90","question":"Suçüstü hâlinde geçici yakalamaya ilişkin doğru ifade hangisidir?","options":{"A":"Yalnız mahkeme başkanı yapabilir.","B":"Önceden kesinleşmiş mahkûmiyet gerekir.","C":"Yalnız mağdur yazılı talepte bulunabilir.","D":"Kanunda belirtilen hâllerde herkes geçici yakalama yapabilir."},"answer":"D","explanation":"CMK m. 90/1, kanunda belirtilen suçüstü hâllerinde herkes tarafından geçici yakalamaya imkân tanır.","pool":"mixed"},{"id":"cmk5271-mixed-008","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tutuklama · Madde 100","question":"Tutuklama tedbiri için aşağıdakilerden hangisi gereklidir?","options":{"A":"Kanuni koşulların ve tutuklama nedeninin bulunması","B":"Her suç şüphesinde otomatik tutuklama","C":"Kesinleşmiş mahkûmiyet","D":"Mağdurun karar vermesi"},"answer":"A","explanation":"CMK m. 100 tutuklama nedenlerini ve koşullarını düzenler; tutuklama otomatik değildir.","pool":"mixed"},{"id":"cmk5271-mixed-009","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Arama · Madde 116-119","question":"Arama kararı veya emri bakımından genel kurala uygun ifade hangisidir?","options":{"A":"Her koşulda sözlü talimat yeterlidir.","B":"Hiçbir zaman hâkim kararı aranmaz.","C":"Hâkim kararı; gecikmesinde sakınca bulunan hâllerde kanundaki yetkililerin yazılı emri söz konusu olabilir.","D":"Kararı yalnız şikâyetçi verir."},"answer":"C","explanation":"CMK m. 119, hâkim kararı ve kanunda belirtilen hâllerde yazılı emirle arama yapılmasını düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-010","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İfade ve sorgu · Madde 147","question":"Şüpheli veya sanığın ifade ve sorgudaki haklarından biri hangisidir?","options":{"A":"Susma hakkının bulunmaması","B":"Müdafi yardımından yararlanma","C":"Suçu kabul etmeye zorlanma","D":"Lehine delil gösterememe"},"answer":"B","explanation":"CMK m. 147, müdafi yardımından yararlanma ve susma hakkı gibi güvenceleri içerir.","pool":"mixed"},{"id":"cmk5271-mixed-011","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Cumhuriyet savcısı · Madde 160","question":"Cumhuriyet savcısı suç işlendiği izlenimini veren hâli öğrenince ne yapmalıdır?","options":{"A":"Yalnız aleyhe delil toplamalıdır.","B":"Mahkûmiyet hükmü kurmalıdır.","C":"Soruşturma yapmadan dosyayı kapatmalıdır.","D":"Lehe ve aleyhe delilleri toplayarak maddi gerçeği araştırmalıdır."},"answer":"D","explanation":"CMK m. 160 uyarınca savcı, şüphelinin lehine ve aleyhine delilleri toplar.","pool":"mixed"},{"id":"cmk5271-mixed-012","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İddianame · Madde 170","question":"İddianame düzenlenmesi için hangi koşul aranır?","options":{"A":"Toplanan delillerin yeterli şüphe oluşturması","B":"Şüphelinin mutlaka ikrar etmesi","C":"Mahkûmiyetin önceden kesinleşmesi","D":"Mağdurun hâkim ataması"},"answer":"A","explanation":"CMK m. 170, toplanan deliller suçun işlendiği hususunda yeterli şüphe oluşturduğunda iddianame düzenlenmesini öngörür.","pool":"mixed"},{"id":"cmk5271-mixed-013","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İddianamenin iadesi · Madde 174","question":"İddianamenin iadesiyle ilgili doğru ifade hangisidir?","options":{"A":"Her yazım hatasında zorunludur.","B":"Mahkeme inceleme yapmadan kabul eder.","C":"Kanunda belirtilen nedenler varsa iade gündeme gelebilir.","D":"İade, mahkûmiyet anlamına gelir."},"answer":"C","explanation":"CMK m. 174 iddianamenin iadesi nedenlerini ve usulünü düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-014","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Savunma delilleri · Madde 177-178","question":"I. Sanık savunma delillerinin toplanmasını isteyebilir.\nII. Kanundaki koşullarda çağrılması reddedilen tanık doğrudan mahkemeye getirilebilir.\nIII. Savunma delilleri hiçbir zaman dikkate alınmaz.\nHangileri doğrudur?","options":{"A":"Yalnız I","B":"Yalnız III","C":"I ve III","D":"I ve II"},"answer":"D","explanation":"I ve II doğrudur. CMK m. 177-178 savunma delilleri ve tanığın doğrudan mahkemeye getirilmesini düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-015","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Duruşmanın kapalılığı · Madde 185","question":"Sanığın on sekiz yaşını doldurmamış olması hâlinde duruşma nasıl yapılır?","options":{"A":"Her durumda canlı yayımlanır.","B":"Kapalı yapılır.","C":"Yalnız kolluk katılır.","D":"Duruşmasız hüküm kurulur."},"answer":"B","explanation":"CMK m. 185, sanık on sekiz yaşını doldurmamışsa duruşmanın kapalı yapılmasını öngörür.","pool":"mixed"},{"id":"cmk5271-mixed-016","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Deliller · Madde 206","question":"Duruşmada delillerin ortaya konulması bakımından doğru ifade hangisidir?","options":{"A":"Her delil incelemesiz kabul edilir.","B":"Delilleri yalnız sanık değerlendirir.","C":"Kanunda belirtilen hâllerde delilin ortaya konulması reddedilebilir.","D":"Deliller yalnız hüküm kesinleştikten sonra sunulur."},"answer":"C","explanation":"CMK m. 206 delillerin ortaya konulmasının reddedilebileceği hâlleri düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-017","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Delillerin değerlendirilmesi · Madde 217","question":"Hâkim hükmünü hangi delillere dayandırabilir?","options":{"A":"Duruşmaya getirilmiş ve huzurunda tartışılmış delillere","B":"Yalnız söylentiye","C":"Yalnız kolluk kanaatine","D":"Tartışılmamış her belgeye"},"answer":"A","explanation":"CMK m. 217 uyarınca hüküm, duruşmaya getirilmiş ve huzurunda tartışılmış delillere dayandırılır.","pool":"mixed"},{"id":"cmk5271-mixed-018","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Hüküm türleri · Madde 223","question":"Yüklenen suçun sanık tarafından işlendiği sabit olmazsa hangi hüküm verilir?","options":{"A":"Tutuklama","B":"İddianamenin iadesi","C":"Yakalama","D":"Beraat"},"answer":"D","explanation":"CMK m. 223 kapsamında suçun sanık tarafından işlendiğinin sabit olmaması beraat nedenidir.","pool":"mixed"},{"id":"cmk5271-mixed-019","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · HAGB · Madde 231","question":"Hükmün açıklanmasının geri bırakılması için hangi yaklaşım doğrudur?","options":{"A":"Her dosyada otomatik uygulanır.","B":"Kanuni koşullar somut olayda değerlendirilir.","C":"Savunma hakkını kaldırır.","D":"Kolluk tarafından kararlaştırılır."},"answer":"B","explanation":"CMK m. 231 koşul ve sonuçları düzenler; uygulama yürürlükteki kanuni düzenleme çerçevesinde değerlendirilmelidir.","pool":"mixed"},{"id":"cmk5271-mixed-020","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İtiraz · Madde 267","question":"Hâkim kararları ile kanunun gösterdiği hâllerde mahkeme kararlarına karşı başvurulan olağan kanun yolu hangisidir?","options":{"A":"Yargılamanın yenilenmesi","B":"Temyiz","C":"İtiraz","D":"Kanun yararına bozma"},"answer":"C","explanation":"CMK m. 267 ve devamı itiraz kanun yolunu düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-021","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İstinaf · Madde 272","question":"İlk derece mahkemesi hükmüne karşı kanuni koşullarda bölge adliye mahkemesine yapılan başvuru hangisidir?","options":{"A":"İstinaf","B":"İtiraz","C":"Yargılamanın yenilenmesi","D":"Kanun yararına bozma"},"answer":"A","explanation":"CMK m. 272 ve devamı istinaf kanun yolunu düzenler; kanuni istisnalar saklıdır.","pool":"mixed"},{"id":"cmk5271-mixed-022","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Temyiz · Madde 286","question":"Bölge adliye mahkemesi kararlarının temyize açıklığı nasıl belirlenir?","options":{"A":"Taraf isterse tüm kararlar temyiz edilir.","B":"Kararın başlığı tek başına yeterlidir.","C":"Yalnız mağdur kabul ederse temyiz mümkündür.","D":"CMK'daki temyize açıklık ve istisna hükümleri esas alınır."},"answer":"D","explanation":"CMK m. 286 ve devamı temyiz edilebilecek kararları ve istisnaları belirler.","pool":"mixed"},{"id":"cmk5271-mixed-023","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Yargıtay Cumhuriyet Başsavcısının itirazı · Madde 308","question":"Yargıtay Cumhuriyet Başsavcısının itiraz yetkisi hangi maddede düzenlenir?","options":{"A":"Madde 100","B":"Madde 170","C":"Madde 308","D":"Madde 267"},"answer":"C","explanation":"CMK m. 308, Yargıtay Cumhuriyet Başsavcısının itirazını düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-024","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Yargılamanın yenilenmesi · Madde 311","question":"Kesinleşmiş hüküm hakkında kanunda sayılan yenileme nedenlerinden biri varsa hangi olağanüstü kanun yolu gündeme gelebilir?","options":{"A":"İfade alma","B":"Yargılamanın yenilenmesi","C":"Yakalama","D":"Görevsizlik"},"answer":"B","explanation":"CMK m. 311 ve devamı, kesinleşmiş hükümlere karşı yargılamanın yenilenmesini düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-025","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Önermeli soru · Madde 2 ve 160","question":"I. Müdafi, şüpheli veya sanığın savunmasını yapan avukattır.\nII. Cumhuriyet savcısı yalnız aleyhe delilleri toplar.\nIII. Soruşturma iddianamenin kabulüne kadar sürer.\nHangileri doğrudur?","options":{"A":"Yalnız II","B":"I ve III","C":"I ve II","D":"I, II ve III"},"answer":"B","explanation":"I ve III doğrudur. CMK m. 160 savcının lehe ve aleyhe delilleri toplamasını gerektirir.","pool":"mixed"}];const app=document.getElementById("app");let order=questions.slice().sort(()=>Math.random()-.5),index=0,answers={};
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function render(){if(index>=order.length){finish();return;}const q=order[index],pick=answers[q.id],done=pick!==undefined;
app.innerHTML='<div class="head"><span>CMK Karışık Test · Soru '+(index+1)+' / '+order.length+'</span><button class="finish" id="finish">Testi bitir</button></div><div class="progress"><span style="width:'+((index+1)/order.length*100)+'%"></span></div><div class="subject">'+esc(q.topic)+'</div><section class="card"><h2>'+esc(q.question).replace(/\n/g,"<br>")+'</h2>'+["A","B","C","D","E"].filter(k=>q.options[k]!==undefined).map(k=>'<label class="option '+(done&&k===q.answer?'correct-option':'')+' '+(done&&pick===k&&pick!==q.answer?'wrong-option':'')+'"><input type="radio" name="answer" value="'+k+'" '+(pick===k?'checked':'')+'><b>'+k+'</b><span>'+esc(q.options[k])+'</span></label>').join("")+'<div class="feedback">'+(done?'<div class="'+(pick===q.answer?'good':'bad')+'"><b>'+(pick===q.answer?'Doğru cevap!':'Yanlış cevap.')+'</b><br><b>Cevap anahtarı: '+esc(q.answer)+' — '+esc(q.options[q.answer])+'</b><br><br><b>Çözüm:</b> '+esc(q.explanation||"Bu soru için ayrıntılı çözüm eklenmemiş.")+'</div>':'')+'</div><div class="nav"><button id="prev" '+(index===0?'disabled':'')+'>← Önceki</button><button id="next">'+(index===order.length-1?'Bitir':'Sonraki →')+'</button></div></section><div class="grid">'+order.map((x,n)=>'<button data-index="'+n+'" class="'+(n===index?'current ':'')+(answers[x.id]!==undefined?'done':'')+'">'+(n+1)+'</button>').join("")+'</div><p class="note">Süre sınırı yoktur. Yanıtını işaretleyip Sonraki düğmesine bas. Yeşil numaralar cevaplanan soruları gösterir.</p>';
app.querySelectorAll('input[name="answer"]').forEach(el=>el.onchange=()=>{answers[q.id]=el.value;render();});document.getElementById("prev").onclick=()=>{if(index>0){index--;render();}};document.getElementById("next").onclick=()=>{if(answers[q.id]===undefined){app.querySelector(".feedback").innerHTML='<div class="bad">Devam etmeden önce bir seçenek işaretle.</div>';return;}if(index<order.length-1){index++;render();}else finish();};document.getElementById("finish").onclick=finish;app.querySelectorAll("[data-index]").forEach(b=>b.onclick=()=>{index=Number(b.dataset.index);render();});}
function finish(){const answered=order.filter(q=>answers[q.id]!==undefined),correct=answered.filter(q=>answers[q.id]===q.answer).length;app.innerHTML='<div class="summary"><h2>Test tamamlandı</h2><p>Toplam soru: <b>'+order.length+'</b></p><p>Cevaplanan: <b>'+answered.length+'</b></p><p>Doğru: <b>'+correct+'</b> · Yanlış: <b>'+(answered.length-correct)+'</b></p><p>Başarı oranı: <b>'+Math.round(correct/Math.max(1,answered.length)*100)+'%</b></p><button class="restart" id="restart">Yeni karışık test</button><p><a class="back" href="soru-coz.html">Soru Çöz bölümüne dön</a></p></div>';document.getElementById("restart").onclick=()=>{order=questions.slice().sort(()=>Math.random()-.5);index=0;answers={};render();};}render();
</script></body></html>
