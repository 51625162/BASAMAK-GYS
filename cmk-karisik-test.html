*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#18334d;font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:960px;margin:0 auto;padding:20px 16px 48px}.back{display:inline-block;color:#1767c8;text-decoration:none;font-weight:700;margin:4px 0 16px}.panel{background:#fff;border:1px solid #e0e8f1;border-radius:20px;padding:clamp(18px,4vw,32px);box-shadow:0 10px 28px #1229430c}.top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#55738f}.title{font-size:clamp(22px,4vw,30px);line-height:1.2;margin:5px 0 8px;color:#122943}.sub{margin:0;color:#61778b;font-size:14px}.finish{border:0;border-radius:12px;padding:11px 15px;background:#e45151;color:#fff;font-weight:800;cursor:pointer}.track{height:8px;background:#e8eef5;border-radius:20px;overflow:hidden;margin:22px 0 12px}.track span{display:block;height:100%;width:0;background:#1674e8;transition:width .2s}.meta{font-size:13px;color:#637b92;margin-bottom:12px}.topic{display:inline-block;background:#eaf4ff;color:#205b9a;padding:5px 10px;border-radius:9px;font-size:12px;font-weight:800;margin-bottom:12px}.question{font-size:clamp(18px,2.5vw,22px);line-height:1.55;font-weight:750;margin:4px 0 20px;white-space:pre-line}.options{display:grid;gap:10px}.option{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1px solid #dbe5ef;border-radius:13px;cursor:pointer}.option:hover{border-color:#8dbaf0;background:#f8fbff}.option input{margin-top:5px;accent-color:#176fe5;flex:0 0 auto}.letter{font-weight:900;color:#1767c8;min-width:22px}.option.correct{border-color:#15945c;background:#effaf4}.option.wrong{border-color:#d94a4a;background:#fff4f4}.feedback{display:none;margin-top:14px;border-radius:12px;padding:14px;background:#f1f6fb;border:1px solid #dce7f1}.feedback.show{display:block}.feedback strong{display:block;margin-bottom:4px}.controls{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px;margin-top:18px}.btn{border:1px solid #d6e2ee;background:#fff;border-radius:12px;min-height:46px;padding:10px 14px;color:#1c456b;font-weight:800;cursor:pointer}.btn.primary{background:#176fe5;border-color:#176fe5;color:#fff}.btn:disabled{opacity:.4;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:7px;margin-top:24px}.num{border:1px solid #dbe5ef;background:#fff;border-radius:9px;min-height:36px;font-weight:750;color:#536e87;cursor:pointer}.num.active{background:#176fe5;color:#fff;border-color:#176fe5}.num.done{box-shadow:inset 0 -3px #1d9c65}.hint{color:#6a8094;font-size:12px;margin:12px 0 0}.result{display:none;margin-top:22px;padding:22px;border-radius:16px;background:#eff6ff;border:1px solid #cfe2fb}.result.show{display:block}.score{font-size:34px;font-weight:900;color:#145ab0}.restart{margin-top:12px}@media(max-width:560px){.wrap{padding:12px 10px 30px}.panel{border-radius:16px;padding:16px}.top{gap:8px}.finish{padding:9px 10px;font-size:13px}.grid{grid-template-columns:repeat(5,minmax(0,1fr))}.controls{grid-template-columns:1fr 1fr}.controls .show-answer{grid-column:1/-1;grid-row:1}.question{font-size:18px}.option{padding:12px;gap:8px}}
</style></head><body><main class="wrap"><a class="back" href="soru-coz.html">← Soru Çöz bölümüne dön</a><section class="panel"><div class="top"><div><div class="eyebrow">5271 Sayılı Ceza Muhakemesi Kanunu</div><h1 class="title">CMK Karışık Test</h1><p class="sub">50 sınav formatında soru · dört seçenek · gerekçeli cevaplar · <a href="https://www.mevzuat.gov.tr/mevzuatmetin/1.5.5271.pdf" target="_blank" rel="noopener">5271 sayılı Kanun PDF kaynağını aç</a></p></div><button class="finish" id="finish">Testi bitir</button></div><div class="track"><span id="progress"></span></div><div class="meta" id="meta"></div><div id="topic" class="topic"></div><div id="question" class="question"></div><div id="options" class="options"></div><div id="feedback" class="feedback"></div><div class="controls"><button class="btn" id="prev">← Önceki</button><button class="btn show-answer" id="show">Cevabı göster +</button><button class="btn primary" id="next">Sonraki →</button></div><div class="grid" id="grid" aria-label="Soru seçimi"></div><p class="hint">Cevabı işaretle, açıklamayı aç ve numara kutularıyla sorular arasında geçiş yap. Testi bitirerek sonucunu görebilirsin.</p><div class="result" id="result"></div></section></main>
<script>
const questions=[{"id":"cmk5271-mixed-pdf-001","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tanımlar · m.2","question":"Savcı suç şüphesini öğrenmiş, delilleri toplamış ve iddianameyi mahkemeye sunmuştur. Mahkeme henüz iddianameyi kabul etmemiştir. Kişinin sıfatı ve muhakeme evresi bakımından hangisi doğrudur?","options":{"A":"Kişi şüphelidir; soruşturma iddianamenin kabulüne kadar sürer.","B":"Kişi sanıktır; kovuşturma iddianamenin düzenlenmesiyle başlar.","C":"Kişi hükümlüdür; kovuşturma hükmün kesinleşmesiyle başlar.","D":"Kişi mağdurdur; soruşturma ilk duruşmada sona erer."},"answer":"A","explanation":"CMK m.2'ye göre şüpheli soruşturma evresinde suç şüphesi altındaki kişidir. Soruşturma iddianamenin kabulüne kadar sürer; kovuşturma kabul ile başlar.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-002","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Görev · m.4-7","question":"İddianame kabul edildikten sonra mahkeme, duruşmada yalnız suçun hukuki niteliğinin değiştiğini belirterek dosyayı alt dereceli mahkemeye göndermek istemektedir. Hangisi doğrudur?","options":{"A":"Mahkeme görev konusunu yalnız taraflar isterse inceler.","B":"Mahkeme kovuşturmanın her aşamasında görevini re'sen değerlendirebilir; ancak yalnız hukuki nitelik değişikliğiyle dosyayı alt mahkemeye gönderemez.","C":"Görevli olmayan mahkemenin tüm işlemleri her durumda geçerlidir.","D":"Görevsizlik kararına karşı kanun yolu yoktur."},"answer":"B","explanation":"CMK m.4 görev konusunun kovuşturmanın her aşamasında re'sen değerlendirilmesini; m.6 ise duruşmada suçun hukuki niteliğinin değişmesi nedeniyle alt mahkemeye gönderme yapılamamasını düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-003","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Yetki · m.12-13","question":"Suçun işlendiği yer belirlenememiştir. Şüpheli Türkiye'de yakalanmıştır ve Türkiye'de yerleşim yeri yoktur. CMK m.13'e göre öncelikle hangi yer mahkemesi yetkilidir?","options":{"A":"Her durumda Ankara mahkemesi","B":"İlk ihbarın yapıldığı yer","C":"Şüphelinin yakalandığı yer mahkemesi","D":"Mağdurun seçtiği yer"},"answer":"C","explanation":"CMK m.13/1'e göre suçun işlendiği yer belli değilse öncelikle yakalandığı yer mahkemesi yetkilidir; yakalanmamışsa yerleşim yeri esas alınır.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-004","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Hâkimin reddi · m.25, 31","question":"Sanık, tarafsızlığı şüpheye düşüren olguyu duruşma başladıktan sonra öğrenmiş ve ret istemini sebebi öğrendiği tarihten itibaren sekizinci gün yapmıştır. Hangisi doğrudur?","options":{"A":"Ret istemi her zaman kabul edilir.","B":"Ret istemini yalnız savcı yapabilir.","C":"Sonradan öğrenilen sebeplerde süre sınırlaması yoktur.","D":"Sonradan öğrenilen sebep için yedi günlük süre öngörüldüğünden istem süresinde değildir ve kanuni koşullarla geri çevrilebilir."},"answer":"D","explanation":"CMK m.25/2, sonradan öğrenilen ret sebebi için öğrenmeden itibaren yedi gün içinde başvuru yapılmasını öngörür. Süreye uyulmaması m.31 kapsamında geri çevirme nedeni olabilir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-005","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Sürelerin hesaplanması · m.39","question":"Bir karar tebliğ edilmiştir. Günle belirlenen sürelerin başlaması ve son günün tatile rastlaması hakkında hangi ifade doğrudur?","options":{"A":"Süre tebliği izleyen gün işlemeye başlar; son gün tatile rastlarsa tatili izleyen gün sona erer.","B":"Süre tebliğ anında başlar ve tatiller her zaman düşülür.","C":"Süre karar kesinleşince başlar.","D":"Süre yalnız ilk iş gününde başlar ve son gün değişmez."},"answer":"A","explanation":"CMK m.39/1'e göre günle belirlenen süreler tebliğ gününü izleyen gün işlemeye başlar. Son gün tatile rastlarsa süre tatilin ertesi günü biter.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-006","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tanıklıktan çekinme · m.45","question":"Sanığın kardeşi tanık olarak dinlenirken çekinme hakkını kullanmak istediğini açıklamıştır. CMK'ye göre hangisi doğrudur?","options":{"A":"Kardeşler hiçbir koşulda çekinemez.","B":"Kanundaki hısımlık kapsamında çekinme hakkı vardır; kişi dinlenirken de bu hakkını kullanabilir.","C":"Tanıklığa başladıktan sonra çekinme hakkı sona erer.","D":"Hak yalnız yargılama bittikten sonra kullanılır."},"answer":"B","explanation":"CMK m.45/1, üçüncü derece dâhil kan hısımlarına tanıklıktan çekinme hakkı tanır. m.45/3 uyarınca kişi dinlenirken de her zaman çekinebilir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-007","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Bilirkişi · m.63","question":"Mahkeme, yalnız genel bilgiyle ve hâkimlik mesleğinin gerektirdiği hukuk bilgisiyle çözülebilecek bir konuda bilirkişi atanmasını istemektedir. Hangisi doğrudur?","options":{"A":"Bilirkişi her uyuşmazlıkta zorunludur.","B":"Bilirkişi raporu hâkimin hukuki değerlendirmesinin yerini alır.","C":"Bu nitelikteki konularda bilirkişiye başvurulamaz.","D":"Taraf isterse mutlaka bilirkişi atanır."},"answer":"C","explanation":"CMK m.63'e göre bilirkişiye uzmanlık, özel veya teknik bilgi gereken hâllerde başvurulur; genel bilgi veya hâkimlik mesleğinin gerektirdiği hukuk bilgisiyle çözülebilen konularda başvurulamaz.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-008","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Bilirkişi süresi · m.66","question":"Bilirkişiye üç aylık inceleme süresi verilmiştir. Özel sebepler nedeniyle ek süre istemektedir. CMK m.66'ya göre hangisi doğrudur?","options":{"A":"Süre altı aydır ve uzatılamaz.","B":"Süre bilirkişinin talebiyle otomatik uzar.","C":"Rapor gecikirse dava kendiliğinden düşer.","D":"Bilirkişinin istemi üzerine atayan merciin gerekçeli kararıyla en çok üç ay ek süre verilebilir."},"answer":"D","explanation":"CMK m.66/1'e göre süre kural olarak üç ayı geçemez; özel sebepler zorunlu kıldığında gerekçeli kararla en çok üç ay uzatılabilir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-009","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Gözlem altına alma · m.74","question":"Şüphelinin akıl hastalığı ve bunun davranışlarına etkisi araştırılacaktır. Soruşturmada karar mercii ve süre bakımından hangisi doğrudur?","options":{"A":"Uzman hekim önerisi ve savcı ile müdafi dinlendikten sonra sulh ceza hâkimi karar verebilir; ilk süre üç hafta, toplam süre en çok üç aydır.","B":"Kolluk amiri karar verir; süre sınırsızdır.","C":"Yalnız ağır ceza mahkemesi karar verir; ilk süre altı aydır.","D":"Müdafiin dinlenmesi yasaktır."},"answer":"A","explanation":"CMK m.74'e göre soruşturmada sulh ceza hâkimi, kovuşturmada mahkeme karar verir. İlk gözlem süresi üç haftayı geçemez; ek sürelerle toplam süre üç ayı aşamaz.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-010","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Yakalama · m.90","question":"Gecikmesinde sakınca bulunan ve yakalama emri düzenlenmesini gerektiren bir hâlde kolluk görevlisi savcıya veya amirine derhâl ulaşamamaktadır. Hangisi doğrudur?","options":{"A":"Kolluk hiçbir durumda yakalama yapamaz.","B":"Kanuni koşullar varsa kolluk görevlisi yakalama yetkisini kullanabilir.","C":"Yakalama yalnız mağdurun yazılı talebiyle olur.","D":"Kişi yalnız kesinleşmiş mahkûmiyetle yakalanır."},"answer":"B","explanation":"CMK m.90/2, gecikmesinde sakınca bulunan hâllerde savcıya veya amire derhâl başvurma olanağı yoksa kolluğa yakalama yetkisi tanır.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-011","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tutuklama · m.100","question":"Dosyada kuvvetli suç şüphesini gösteren somut deliller bulunduğu ileri sürülmekte; ancak herhangi bir tutuklama nedeni gösterilememektedir. Hangisi doğrudur?","options":{"A":"Suç şüphesi tek başına her durumda yeterlidir.","B":"Katalog suç isnadı varsa diğer koşullar incelenmez.","C":"Somut deliller yanında tutuklama nedeni bulunmalı ve tedbir ölçülü olmalıdır.","D":"Tutuklama kararını kolluk verir."},"answer":"C","explanation":"CMK m.100/1, kuvvetli suç şüphesini gösteren somut delillerin yanında bir tutuklama nedeni bulunmasını ve ölçülülüğü arar.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-012","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Adli kontrolün ihlali · m.112","question":"Şüpheli, adli kontrol kapsamında belirlenen yere başvurma yükümlülüğünü mazeretsiz ve isteyerek yerine getirmemiştir. Hangisi gündeme gelebilir?","options":{"A":"Kamu davası kendiliğinden düşer.","B":"Şüpheli otomatik beraat eder.","C":"Adli kontrol kesin hükme dönüşür.","D":"Yetkili yargı mercii, hükmedilebilecek hapis cezasının süresine bakılmaksızın tutuklama kararı verebilir."},"answer":"D","explanation":"CMK m.112/1'e göre adli kontrol hükümlerini isteyerek yerine getirmeyen kişi hakkında, hükmedilebilecek hapis cezasının süresine bakılmaksızın tutuklama kararı verilebilir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-013","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Arama · m.119","question":"Kolluk, gecikmesinde sakınca olduğunu ileri sürerek konutta arama yapmak istemektedir. Savcıya ulaşılabilmektedir; kolluk amiri de yazılı emir vermek istemektedir. Hangisi doğrudur?","options":{"A":"Konutta arama hâkim kararı veya gecikmede sakınca varsa savcının yazılı emriyle yapılabilir; kolluk amirinin emri yeterli değildir.","B":"Konutta arama her zaman kolluk amirinin sözlü emriyle yapılır.","C":"Arama için hâkim kararı verilemez.","D":"Karar veya emirde aranacak yerin belirtilmesi gerekmez."},"answer":"A","explanation":"CMK m.119/1'e göre konut, işyeri ve kamuya açık olmayan kapalı alanlarda hâkim kararı veya gecikmede sakınca varsa savcının yazılı emri gerekir; kolluk amirinin emri yeterli değildir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-014","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · El koyma · m.127","question":"Hâkim kararı olmaksızın yapılan el koyma işlemi 10.00'da gerçekleştirilmiştir. Kanuni sürelerde hâkim onayı alınmazsa hangi kural uygulanır?","options":{"A":"El koyma yedi gün sonra kalkar.","B":"İşlem 24 saat içinde hâkim onayına sunulur; hâkim 48 saat içinde kararını açıklamazsa el koyma kendiliğinden kalkar.","C":"Hâkim onayı hiçbir zaman gerekmez.","D":"El koyma yalnız sanığın rızasıyla sona erer."},"answer":"B","explanation":"CMK m.127/3'e göre hâkim kararı olmadan yapılan el koyma 24 saat içinde hâkim onayına sunulur; hâkim 48 saat içinde kararını açıklamazsa el koyma kendiliğinden kalkar.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-015","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İfade alma · m.147","question":"Şüpheliye isnat edilen suç anlatılmış, ancak susma hakkı ile lehine somut delil toplanmasını isteme imkânı hatırlatılmamıştır. Hangisi doğrudur?","options":{"A":"Bu haklar yalnız hükümden sonra bildirilir.","B":"Şüphelinin ifade sırasında usul güvencesi yoktur.","C":"Susma hakkı ve lehine delil toplanmasını isteme olanağı ifade alma sırasında bildirilmesi gereken güvencelerdendir.","D":"Kimlik dışında hiçbir soru sorulamaz."},"answer":"C","explanation":"CMK m.147; isnadın bildirilmesi, müdafi yardımı, susma hakkı ve şüpheden kurtulmak için somut delil toplanmasını isteme olanağının hatırlatılmasını öngörür.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-016","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İddianamenin iadesi · m.170,174","question":"Deliller suçun işlendiği konusunda yeterli şüphe oluşturmuş ve savcı iddianame düzenlemiştir. Mahkeme kanunda sayılan bir iade nedeni tespit ederse ne yapabilir?","options":{"A":"Şüpheli hakkında doğrudan mahkûmiyet kurar.","B":"İddianameyi her durumda kabul eder.","C":"İade kararı kamu davasını kesin olarak düşürür.","D":"İddianameyi kanuni usul ve süre içinde başsavcılığa iade edebilir."},"answer":"D","explanation":"CMK m.170 yeterli şüphe varsa iddianame düzenlenmesini; m.174 ise kanunda sayılan nedenlerle iade usulünü düzenler. İade beraat veya kendiliğinden düşme değildir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-017","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Kovuşturmanın başlaması · m.175","question":"Mahkeme iddianameyi kabul etmiştir. Bu kabulün doğrudan sonucu nedir?","options":{"A":"Kovuşturma evresi başlar ve kamu davası açılmış olur.","B":"Soruşturma yeniden başlar.","C":"Sanık otomatik tutuklanır.","D":"Hüküm kesinleşmiş sayılır."},"answer":"A","explanation":"CMK m.175/1'e göre iddianamenin kabulüyle kamu davası açılmış olur ve kovuşturma evresi başlar.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-018","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Duruşmada soru yöneltme · m.201","question":"Duruşmada savcı ve sanık müdafii tanığa soru sormak ister. Salondaki mağdur yakını da doğrudan soru yöneltmek ister. Hangisi doğrudur?","options":{"A":"Duruşmada kimse soru soramaz.","B":"Savcı, müdafi ve vekil doğrudan soru yöneltebilir; diğer kişiler sorularını hâkim aracılığıyla yöneltir.","C":"Yalnız mağdur yakını doğrudan soru sorabilir.","D":"Sorular ancak hüküm açıklandıktan sonra sorulur."},"answer":"B","explanation":"CMK m.201 savcıya, müdafiye ve vekile doğrudan soru yöneltme hakkı tanır. Diğer kişiler sorularını mahkeme başkanı veya hâkim aracılığıyla yöneltir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-019","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Delillerin değerlendirilmesi · m.217","question":"Mahkeme, dosyaya girmiş bir belgeyi duruşmada açıklamadan ve tartışmaya açmadan hükme esas almak istemektedir. Hangisi doğrudur?","options":{"A":"Dosyadaki her belge tartışılmadan hükme alınır.","B":"Yalnız sanığın kabul ettiği deliller kullanılabilir.","C":"Hüküm duruşmaya getirilmiş ve huzurda tartışılmış delillere dayanmalı; suç hukuka uygun elde edilen her türlü delille ispatlanabilir.","D":"Delilin hukuka uygun olması tartışılma şartını ortadan kaldırır."},"answer":"C","explanation":"CMK m.217/1 hükmün duruşmada ortaya konulup tartışılan delillere dayanmasını, m.217/2 suçun hukuka uygun elde edilen her türlü delille ispatını düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-020","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Hüküm çeşitleri · m.223","question":"Mahkeme, yüklenen fiilin sanık tarafından işlendiğinin sabit olmadığı kanaatine ulaşmıştır. Hangi hüküm verilmelidir?","options":{"A":"Tutuklama","B":"Görevsizlik","C":"Zorla getirme","D":"Beraat"},"answer":"D","explanation":"CMK m.223/2-e'ye göre yüklenen suçun sanık tarafından işlendiğinin sabit olmaması beraat nedenidir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-021","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Mağdurun dinlenmesi · m.236","question":"Suçun etkisiyle psikolojisi bozulmuş çocuk mağdurun aynı olay hakkında tekrar tekrar dinlenmesi planlanmaktadır. Hangisi doğrudur?","options":{"A":"Kural olarak bir defa dinlenir; maddi gerçeğin ortaya çıkarılması bakımından zorunluluk hâli saklıdır.","B":"Çocuk mağdur her duruşmada mutlaka dinlenir.","C":"Çocuğun beyanı hiçbir koşulda alınamaz.","D":"Mağdur yalnız yemin ettirilerek dinlenebilir."},"answer":"A","explanation":"CMK m.236/2, suçun etkisiyle psikolojisi bozulmuş çocuk veya mağdurun bir defa dinlenmesini öngörür; maddi gerçeğin ortaya çıkarılması açısından zorunluluk hâlleri saklıdır.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-022","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Uzlaştırma · m.253","question":"Soruşturulan suçun CMK m.253 kapsamında olduğu belirlenmiştir. Uzlaştırma sürecine ilişkin doğru ifade hangisidir?","options":{"A":"Uzlaştırma yalnız hüküm kesinleştikten sonra gündeme gelir.","B":"Kanunda sayılan suçlarda şüpheli ile mağdur veya suçtan zarar gören arasında uzlaştırma girişiminde bulunulur; kapsam ve usul m.253 ve devamına göre belirlenir.","C":"Uzlaştırma kararı kolluk tarafından kesin hüküm gibi verilir.","D":"Uzlaştırma her suçta zorunludur ve mağdurun iradesi önemsizdir."},"answer":"B","explanation":"CMK m.253 uzlaştırma girişiminde bulunulacak suçları ve usulü düzenler. Kapsam, ilgili kanun hükümlerine göre belirlenir.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-023","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İtiraz · m.267-268","question":"Kanunda özel bir düzenleme bulunmadığı varsayımında, hâkim kararına itiraz etmek isteyen kişi hangi usulle başvurur?","options":{"A":"Yalnız kolluğa sözlü bildirimle.","B":"Yalnız hüküm kesinleştikten sonra Yargıtaya.","C":"Kural olarak kararı öğrendiği günden itibaren iki hafta içinde kararı veren mercie dilekçeyle veya tutanağa geçirilen beyanla.","D":"Kararı veren hâkime hiçbir şekilde başvuramaz."},"answer":"C","explanation":"CMK m.267 itiraz yolunu düzenler. m.268/1'e göre özel hüküm yoksa başvuru, kararın öğrenildiği günden itibaren iki hafta içinde kararı veren mercie yapılır.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-024","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İstinaf · m.272-275","question":"İlk derece mahkemesi hükmüne karşı süresi içinde istinaf başvurusu yapılmıştır. CMK m.275'in genel kuralına göre başvurunun etkisi nedir?","options":{"A":"Hüküm aynı anda kesinleşir.","B":"Dosya soruşturma evresine döner.","C":"Başvuru yalnız para cezasının ödenmesini durdurur.","D":"Süresinde yapılan istinaf başvurusu hükmün kesinleşmesini engeller."},"answer":"D","explanation":"CMK m.275/1'e göre süresi içinde yapılan istinaf başvurusu hükmün kesinleşmesini engeller.","pool":"mixed"},{"id":"cmk5271-mixed-pdf-025","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Temyiz · m.291","question":"Gerekçeli hüküm tebliğ edilmiştir. CMK m.291'deki genel temyiz süresi ve başvuru yeri hangisidir?","options":{"A":"Yedi gün içinde savcılığa sözlü başvuru","B":"Bir ay içinde doğrudan Anayasa Mahkemesine","C":"Yalnız hüküm kesinleştikten sonra","D":"İki hafta içinde hükmü veren mahkemeye dilekçeyle veya zabıt kâtibine tutanağa geçirilen beyanla"},"answer":"D","explanation":"CMK m.291/1'e göre temyiz istemi gerekçeli hükmün tebliğinden itibaren iki hafta içinde hükmü veren mahkemeye dilekçe veya tutanağa geçirilen beyanla yapılır.","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Müdafi görevlendirilmesi · m.150","question":"Şüpheli, müdafi seçebilecek durumda olduğunu ancak müdafi istemediğini belirtmiştir. İsnat edilen suçun alt sınırı beş yıldan fazla hapis cezasını gerektirmektedir. CMK m.150 bakımından hangisi doğrudur?","options":{"A":"Müdafi görevlendirilmesi yalnız mahkûmiyetten sonra yapılabilir.","B":"Şüphelinin istememesi her durumda müdafi görevlendirilmesini engeller.","C":"Kanunun zorunlu müdafilik öngördüğü hâllerde istemese de müdafi görevlendirilir.","D":"Müdafi ancak mağdur talep ederse görevlendirilir."},"answer":"C","explanation":"CMK m.150, zorunlu müdafilik hâllerini düzenler. Kanunda öngörülen durumlarda kişinin istemi bulunmasa da müdafi görevlendirilmesi gerekir.","id":"cmk5271-mixed-pdf-026","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Yakalama ve gözaltı · m.91","question":"Yakalanan kişi, Cumhuriyet savcısının kararıyla gözaltına alınmıştır. Bireysel suçlarda gözaltı süresinin başlangıcı ve genel azami süre bakımından hangisi doğrudur?","options":{"A":"Yakalama yerine en yakın hâkimliğe gönderilme için gereken süre hariç, yakalama anından itibaren genel kural olarak 24 saati geçemez.","B":"Gözaltı süresi her durumda yedi gündür.","C":"Süre yalnız ifade işlemi bittikten sonra başlar.","D":"Gözaltı süresini kolluk amiri sınırsız olarak belirler."},"answer":"A","explanation":"CMK m.91'de gözaltı süresi ve uzatma koşulları düzenlenir. Genel kural bireysel suçlarda yakalama yerine en yakın hâkim veya mahkemeye gönderilme için zorunlu süre hariç 24 saattir; kanuni istisnalar ayrıca değerlendirilir.","id":"cmk5271-mixed-pdf-027","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tutuklulukta süre · m.102","question":"Ağır ceza mahkemesinin görevine girmeyen bir suç nedeniyle yürütülen kovuşturmada tutukluluk süresi değerlendirilirken aşağıdakilerden hangisi esas alınır?","options":{"A":"Tutukluluk süresinin sınırı bulunmaz.","B":"Her suç için otomatik olarak beş yıl uygulanır.","C":"Süreyi yalnız kolluk belirler.","D":"CMK m.102'deki suç türüne ve kanuni koşullara göre belirlenen azami süre dikkate alınır."},"answer":"D","explanation":"CMK m.102, tutuklulukta geçecek sürelerin üst sınırlarını suçun niteliğine ve yargılama evresine göre düzenler; somut dosyada ilgili fıkra ve istisnalar birlikte incelenmelidir.","id":"cmk5271-mixed-pdf-028","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Adli kontrol · m.109","question":"Tutuklama nedenleri bulunmakla birlikte tutuklama yerine adli kontrol uygulanmasına karar verilmiştir. Adli kontrolün hukuki niteliği bakımından hangisi doğrudur?","options":{"A":"Adli kontrol yalnız kesin hükümden sonra uygulanabilir.","B":"Adli kontrol, kanuni koşulları varsa tutuklama yerine uygulanabilen bir koruma tedbiridir.","C":"Adli kontrol kararı sanığın suçunu kabul ettiği anlamına gelir.","D":"Adli kontrolü yalnız kolluk amiri kararlaştırabilir."},"answer":"B","explanation":"CMK m.109, tutuklama sebeplerinin varlığı hâlinde tutuklama yerine adli kontrol uygulanabilmesini düzenler. Adli kontrol bir mahkûmiyet veya suç ikrarı değildir.","id":"cmk5271-mixed-pdf-029","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İletişimin denetlenmesi · m.135","question":"Soruşturma sırasında iletişimin dinlenmesi ve kayda alınması talep edilmektedir. CMK m.135 kapsamında temel koşulların birlikte arandığı seçenek hangisidir?","options":{"A":"Mağdurun sözlü talebi tek başına yeterlidir.","B":"Her suçta, suç şüphesi aranmaksızın uygulanabilir.","C":"Kanunda sayılan suç, başka suretle delil elde edilememe ve kuvvetli şüpheyi destekleyen somut delillere ilişkin koşullar ile yetkili merci kararı aranır.","D":"Kararı yalnız telefon operatörü verir."},"answer":"C","explanation":"CMK m.135 iletişimin denetlenmesini sıkı koşullara bağlar. Suç türü, başka suretle delil elde edilememe, kuvvetli şüpheyi destekleyen somut deliller ve kanunda belirtilen karar usulü gözetilir.","id":"cmk5271-mixed-pdf-030","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Gizli soruşturmacı · m.139","question":"Gizli soruşturmacı görevlendirilmesi bakımından aşağıdaki ifadelerden hangisi doğrudur?","options":{"A":"Kanuni şartlar ve katalog suçlarla sınırlı olarak, başka suretle delil elde edilememesi koşulu da gözetilerek hâkim kararıyla görevlendirme yapılabilir.","B":"Her basit şüphede kolluk amiri sözlü emirle görevlendirir.","C":"Gizli soruşturmacı yalnız hüküm kesinleştikten sonra çalışabilir.","D":"Gizli soruşturmacı görevlendirilmesi için suç şüphesi aranmaz."},"answer":"A","explanation":"CMK m.139, gizli soruşturmacı görevlendirilmesini kanuni koşullara, belirli suçlara ve kural olarak hâkim kararına bağlar.","id":"cmk5271-mixed-pdf-031","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Teknik araçlarla izleme · m.140","question":"Teknik araçlarla izleme tedbirinin uygulanması istenmektedir. Hangi yaklaşım CMK m.140'ın sistematiğine uygundur?","options":{"A":"Tedbir bütün suçlarda ve her ortamda sınırsız uygulanabilir.","B":"Sadece mağdurun rızasıyla uygulanır.","C":"Kolluk görevlisi tek başına kesin karar verir.","D":"Kanunda belirtilen suç ve şartlar, başka suretle delil elde edilememe ve yetkili hâkim kararı gibi güvenceler dikkate alınır."},"answer":"D","explanation":"CMK m.140 teknik araçlarla izlemeyi belirli suçlar ve koşullarla sınırlar; karar yetkisi ve tedbirin kapsamı kanundaki güvencelere göre belirlenir.","id":"cmk5271-mixed-pdf-032","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İddianamenin unsurları · m.170","question":"Cumhuriyet savcısı iddianame düzenlerken şüphelinin lehine olan delilleri hiç göstermemiştir. CMK m.170 bakımından hangisi doğrudur?","options":{"A":"İddianamede yalnız aleyhe deliller bulunabilir.","B":"İddianamede yüklenen suç ve deliller gösterilmeli; şüphelinin lehine olan hususlar da belirtilmelidir.","C":"Delillerin iddianamede gösterilmesi yasaktır.","D":"İddianameyi kolluk düzenler ve mahkemeye sunar."},"answer":"B","explanation":"CMK m.170, iddianamenin içeriğini düzenler ve şüphelinin lehine olan hususların da iddianamede gösterilmesini öngörür.","id":"cmk5271-mixed-pdf-033","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Duruşmanın açıklığı · m.182","question":"Bir ceza davasında duruşmanın kapalı yapılması talep edilmiştir. Duruşmanın açıklığı ilkesi ve istisnaları bakımından hangisi doğrudur?","options":{"A":"Ceza duruşmalarının tamamı kendiliğinden kapalıdır.","B":"Duruşmanın açıklığına ilişkin karar verilemez.","C":"Duruşma kural olarak açıktır; kanunda belirtilen koşullarda mahkeme kapalı duruşmaya karar verebilir.","D":"Duruşmayı yalnız taraflardan biri kapatabilir."},"answer":"C","explanation":"CMK m.182 uyarınca duruşma kural olarak herkese açıktır. Genel ahlakın veya kamu güvenliğinin kesin olarak gerekli kıldığı hâllerde kanuni usulle kapalılık kararı verilebilir.","id":"cmk5271-mixed-pdf-034","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Duruşmada hazır bulunma · m.193","question":"Sanık usulüne uygun çağrıldığı hâlde duruşmaya gelmemiştir. Duruşmanın yapılması bakımından hangi ifade doğrudur?","options":{"A":"Sanığın yokluğunda yargılama hiçbir istisna olmaksızın yapılamaz.","B":"Sanık gelmezse dava otomatik düşer.","C":"Mahkeme sanık yokken her durumda mahkûmiyet kurar.","D":"Kural sanığın hazır bulunmasıdır; ancak kanunda belirtilen istisnalar varsa yokluğunda duruşma yapılabilir."},"answer":"D","explanation":"CMK m.193 sanığın hazır bulunması kuralını ve istisnalarını düzenler. Yoklukta yargılama, kanunun öngördüğü koşullara bağlıdır.","id":"cmk5271-mixed-pdf-035","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tanığın yemini · m.54-55","question":"Mahkeme, tanığın yemin vererek dinlenmesi gerekip gerekmediğini değerlendirmektedir. CMK bakımından doğru yaklaşım hangisidir?","options":{"A":"Tanıkların dinlenmesinde yemin kuralı ve yeminden istisna tutulan kişiler ilgili kanun hükümlerine göre belirlenir.","B":"Bütün tanıklar her durumda yeminsiz dinlenir.","C":"Yemin yalnız sanığa verdirilir.","D":"Tanığa yemin verdirilmesi tamamen kolluğun takdirindedir."},"answer":"A","explanation":"CMK m.54 ve devamı tanığa yemin verilmesini ve istisnaları düzenler. Tanığın yaşı ve kanundaki özel durumlar dikkate alınır.","id":"cmk5271-mixed-pdf-036","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Keşif · m.83","question":"Suç yerinin fiziksel koşullarının olayın oluşuna etkisi tartışmalıdır. Mahkeme olay yerinde inceleme yapmayı değerlendirmektedir. Bu işlem hangi kavramla ifade edilir?","options":{"A":"Uzlaştırma","B":"Keşif","C":"İstinaf","D":"İnfaz"},"answer":"B","explanation":"CMK m.83 ve devamında keşif düzenlenir. Hâkim veya mahkeme, olayın aydınlatılması için yerinde inceleme yapabilir; keşif usulü kanuna uygun yürütülür.","id":"cmk5271-mixed-pdf-037","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Arama kararı · m.119","question":"Arama kararında veya yazılı emrinde bulunması gereken unsurlar açısından aşağıdakilerden hangisi doğrudur?","options":{"A":"Aranacak yerin belirtilmesi zorunlu değildir.","B":"Arama emri her durumda sözlü verilebilir.","C":"Karar veya emirde aramanın nedenini oluşturan fiil, aranacak kişi veya yer ve geçerlilik süresi gibi kanuni unsurlar gösterilmelidir.","D":"Arama kararı yalnız arama bittikten sonra hazırlanır."},"answer":"C","explanation":"CMK m.119, arama kararında veya emrinde bulunması gereken unsurları ve yazılılık koşulunu düzenler. Somut işlemde kanundaki zorunlu unsurlar bulunmalıdır.","id":"cmk5271-mixed-pdf-038","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Elkoyma ve iade · m.131","question":"Soruşturma için artık muhafazasına gerek kalmayan ve müsadereye tabi olmayan bir eşya hakkında ilgilisi iade talep etmektedir. Hangisi doğrudur?","options":{"A":"Eşya hiçbir koşulda iade edilemez.","B":"Eşya ancak dava kesinleştikten sonra iade edilebilir.","C":"İade talebini yalnız kolluk amiri karara bağlar.","D":"Kanuni koşullar gerçekleşmişse eşyanın iadesine karar verilebilir."},"answer":"D","explanation":"CMK m.131, elkonulan eşyanın muhafazasına gerek kalmaması ve müsadereye tabi olmaması gibi koşullarda iadesini düzenler.","id":"cmk5271-mixed-pdf-039","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İfade tutanağı · m.147","question":"Şüphelinin ifadesi alınırken tutanağın içeriği ve imzalanmasıyla ilgili hangi işlem usule uygundur?","options":{"A":"Tutanak yalnız kolluk görevlisinin imzasıyla tamamlanır; şüpheliye okunmaz.","B":"İfade işlemi tutanağa bağlanır; tutanakta kanuni unsurlar bulunur ve ilgili kişilerce imzalanır, imzadan kaçınma hâli belirtilir.","C":"Tutanak tutulması isteğe bağlıdır.","D":"Müdafi tutanağı görme hakkına hiçbir zaman sahip değildir."},"answer":"B","explanation":"CMK m.147 ifade alma usulünü ve tutanakta bulunması gereken hususları düzenler. İfade işlemi kayıt altına alınır; imzadan kaçınma gibi durumlar tutanağa geçirilir.","id":"cmk5271-mixed-pdf-040","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Duruşma tutanağı · m.219","question":"Duruşma sırasında tanığın beyanı ve tarafların önemli talepleri kayda geçirilmemiştir. Duruşma tutanağı bakımından hangisi doğrudur?","options":{"A":"Duruşma işlemleri kanunda belirtilen esaslara göre tutanağa geçirilmelidir; tutanak duruşmanın usulüne uygun yürütüldüğünün temel kayıtlarındandır.","B":"Duruşma tutanağı yalnız hüküm kesinleştikten sonra tutulur.","C":"Tutanak yalnız sanık isterse düzenlenir.","D":"Tutanakta duruşmanın yapıldığı tarih yer alamaz."},"answer":"A","explanation":"CMK m.219 ve devamı duruşma tutanağını düzenler. Kanunda gösterilen işlem ve beyanların tutanağa geçirilmesi yargılama sürecinin denetlenebilirliği için önemlidir.","id":"cmk5271-mixed-pdf-041","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Hükmün gerekçesi · m.230","question":"Mahkeme mahkûmiyet hükmü kurmuş ancak delilleri neden kabul ettiğini ve savunmayı neden reddettiğini gerekçede açıklamamıştır. Hangisi doğrudur?","options":{"A":"Hüküm gerekçesiz de olsa her durumda geçerlidir.","B":"Gerekçe yalnız beraat hükümlerinde gerekir.","C":"Hükmün gerekçesinde delillerin tartışılması, kabul ve ret nedenleri ile ulaşılan sonucun açıklanması gerekir.","D":"Gerekçeyi savcı yazar."},"answer":"C","explanation":"CMK m.230, hükmün gerekçesinde yer alması gereken hususları düzenler. Delillerin değerlendirilmesi ve mahkemenin ulaştığı sonucun gerekçelendirilmesi gerekir.","id":"cmk5271-mixed-pdf-042","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Beraat kararı · m.223","question":"Yapılan yargılama sonunda yüklenen fiilin kanunda suç olarak tanımlanmadığı anlaşılmıştır. CMK m.223 bakımından hangi karar verilmelidir?","options":{"A":"Tutuklama kararı","B":"Görevsizlik kararı","C":"Davanın nakli","D":"Beraat kararı"},"answer":"D","explanation":"CMK m.223/2-a uyarınca yüklenen fiilin kanunda suç olarak tanımlanmamış olması beraat nedenidir.","id":"cmk5271-mixed-pdf-043","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · HAGB · m.231","question":"Mahkeme hükmün açıklanmasının geri bırakılması koşullarını değerlendirmektedir. Bu kurumun hukuki niteliği için hangisi doğrudur?","options":{"A":"HAGB, her suçta otomatik olarak uygulanır.","B":"HAGB, kanunda düzenlenen koşullara bağlı özel bir kurumdur; koşullar oluşmadan sırf sanığın talebiyle otomatik uygulanmaz.","C":"HAGB beraat hükmüyle aynı şeydir.","D":"HAGB kararını kolluk verir."},"answer":"B","explanation":"CMK m.231 hükmün açıklanmasının geri bırakılmasını ve koşullarını düzenler. Uygulamada yürürlükteki mevzuat ve ilgili anayasal/yargısal değişiklikler de kontrol edilmelidir.","id":"cmk5271-mixed-pdf-044","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Uzlaştırma · m.253","question":"Uzlaştırma görüşmelerinde taraflar anlaşamamıştır. Bu durumun sonucu bakımından hangisi doğrudur?","options":{"A":"Anlaşamama, tek başına sanığın suçu kabul ettiği anlamına gelmez; soruşturma veya kovuşturma kanuni usule göre devam eder.","B":"Anlaşamama doğrudan mahkûmiyet doğurur.","C":"Uzlaştırmacı mahkûmiyet kararı verir.","D":"Anlaşamama bütün delilleri geçersiz kılar."},"answer":"A","explanation":"CMK m.253 ve devamında uzlaştırma usulü düzenlenir. Uzlaşma sağlanmaması kendiliğinden mahkûmiyet veya suç ikrarı anlamına gelmez; süreç kanuni hükümlere göre devam eder.","id":"cmk5271-mixed-pdf-045","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İtirazın incelenmesi · m.268-271","question":"Bir hâkim kararına karşı süresinde itiraz edilmiştir. İtirazın incelenmesi bakımından hangisi doğrudur?","options":{"A":"İtirazı yalnız kolluk inceler.","B":"İtiraz her durumda doğrudan Yargıtay tarafından incelenir.","C":"İtiraz, kanunda gösterilen usule göre kararı veren merci ve gerektiğinde itirazı incelemeye yetkili merci tarafından değerlendirilir.","D":"İtiraz başvurusu kararın kendiliğinden yok sayılması sonucunu doğurur."},"answer":"C","explanation":"CMK m.268-271 itirazın başvuru ve inceleme usulünü düzenler. İnceleme, kararın niteliğine göre kanunda gösterilen yetkili merci tarafından yapılır.","id":"cmk5271-mixed-pdf-046","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İstinaf başvurusu · m.273","question":"İlk derece mahkemesinin hükmüne karşı istinaf başvurusu yapmak isteyen taraf, genel süre bakımından hangi seçeneği esas almalıdır?","options":{"A":"Hükmün öğrenildiği gün içinde yalnız sözlü başvuru","B":"Her durumda otuz gün","C":"Bir yıl içinde herhangi bir mercie başvuru","D":"CMK m.273'teki yürürlükteki süre ve başvuru usulü; özel düzenlemeler saklı kalmak üzere hükmün gerekçesiyle tebliği esas alınarak değerlendirilir."},"answer":"D","explanation":"CMK m.273 istinaf başvuru süresini ve usulünü düzenler. Süre hesabında yürürlükteki metin ve varsa özel hükümler kontrol edilmelidir.","id":"cmk5271-mixed-pdf-047","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Kanun yararına bozma · m.309","question":"Kesinleşmiş bir karar veya hükümde hukuka aykırılık bulunduğu ileri sürülmektedir ve olağan kanun yolu açık değildir. CMK m.309 kapsamında hangi olağanüstü kanun yolu gündeme gelebilir?","options":{"A":"İstinaf","B":"Kanun yararına bozma","C":"Görevsizlik","D":"Uzlaştırma"},"answer":"B","explanation":"CMK m.309, hâkim veya mahkeme tarafından verilen ve istinaf veya temyiz incelemesinden geçmeksizin kesinleşen karar veya hükümler için kanun yararına bozma yolunu düzenler.","id":"cmk5271-mixed-pdf-048","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Yargılamanın yenilenmesi · m.311","question":"Kesinleşmiş mahkûmiyet hükmünden sonra, hükme esas alınan belgenin sahte olduğu kesinleşmiş bir mahkeme kararıyla ortaya çıkmıştır. Hangi yol gündeme gelebilir?","options":{"A":"Yargılamanın yenilenmesi","B":"İlk kez gözaltı","C":"Görevsizlik itirazı","D":"İddianamenin iadesi"},"answer":"A","explanation":"CMK m.311, kesinleşmiş hükümlere karşı belirli nedenlerle yargılamanın yenilenmesini düzenler. Hükme esas alınan belgenin sahteliğinin ortaya çıkması kanundaki koşullarla yenileme nedeni olabilir.","id":"cmk5271-mixed-pdf-049","pool":"mixed"},{"topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Dava zamanaşımı ve düşme · m.223","question":"Yargılama sırasında dava zamanaşımının gerçekleştiği anlaşılmıştır. CMK m.223 kapsamında hangi karar türü gündeme gelir?","options":{"A":"Her durumda beraat","B":"Zorla getirme","C":"Davanın düşmesi","D":"Tutuklama"},"answer":"C","explanation":"CMK m.223/8 uyarınca Türk Ceza Kanunundaki düşme sebeplerinin varlığı hâlinde davanın düşmesine karar verilir; zamanaşımı ilgili düşme nedenlerindendir.","id":"cmk5271-mixed-pdf-050","pool":"mixed"}];const letters=["A","B","C","D"];let index=0,answers={},revealed={},finished=false;const $=id=>document.getElementById(id);
function render(){const q=questions[index];$("meta").textContent="Soru "+(index+1)+" / "+questions.length;$("progress").style.width=((index+1)/questions.length*100)+"%";$("topic").textContent=q.topic;$("question").textContent=q.question;$("options").innerHTML="";letters.forEach(k=>{const label=document.createElement("label");label.className="option";if(revealed[index])label.classList.add(k===q.answer?"correct":(answers[index]===k?"wrong":""));const input=document.createElement("input");input.type="radio";input.name="answer";input.value=k;input.checked=answers[index]===k;input.disabled=finished;input.addEventListener("change",()=>{answers[index]=k;render();});const letter=document.createElement("span");letter.className="letter";letter.textContent=k;const txt=document.createElement("span");txt.textContent=q.options[k];label.append(input,letter,txt);$("options").append(label);});$("feedback").className="feedback"+(revealed[index]?" show":"");$("feedback").innerHTML=revealed[index]?"<strong>"+(answers[index]===q.answer?"Doğru cevap.":"Doğru cevap: "+q.answer)+"</strong>"+q.explanation:"";$("show").textContent=revealed[index]?"Cevap açıklaması açık":"Cevabı göster +";$("prev").disabled=index===0;$("next").disabled=index===questions.length-1||finished;$("show").disabled=finished;$("grid").innerHTML="";questions.forEach((_,i)=>{const b=document.createElement("button");b.className="num"+(i===index?" active":"")+(answers[i]?" done":"");b.textContent=i+1;b.setAttribute("aria-label","Soru "+(i+1));b.onclick=()=>{index=i;render();};$("grid").append(b);});}
$("prev").onclick=()=>{if(index>0){index--;render();}};$("next").onclick=()=>{if(index<questions.length-1){index++;render();}};$("show").onclick=()=>{revealed[index]=!revealed[index];render();};$("finish").onclick=()=>{finished=true;const answered=Object.keys(answers).length;const correct=questions.filter((q,i)=>answers[i]===q.answer).length;const unanswered=questions.length-answered;$("result").className="result show";$("result").innerHTML='<div class="eyebrow">Test sonucu</div><div class="score">'+correct+' / '+questions.length+'</div><p><b>Doğru:</b> '+correct+' · <b>Yanlış:</b> '+(answered-correct)+' · <b>Boş:</b> '+unanswered+'</p><button class="btn restart" id="restart">Yeni karışık test</button>';$("restart").onclick=()=>{index=0;answers={};revealed={};finished=false;$("result").className="result";render();};render();$("result").scrollIntoView({behavior:"smooth",block:"nearest"});};render();
