kkı da açıklanmamıştır. Hangi ilke dikkate alınmalıdır?","options":{"A":"CMK m.147'deki hakların bildirilmesi ve usule uygun tutanak düzenlenmesi güvencelerine uyulmalıdır.","B":"Şüpheli kolluğa geldiği için bütün haklarından vazgeçmiş sayılır.","C":"Haklar yalnız duruşmada bildirilir.","D":"Tutanaktaki imza her usulsüzlüğü giderir."},"answer":"A","explanation":"CMK m.147, ifade alma ve sorguda şüpheli veya sanığa haklarının bildirilmesini ve işlemin usule uygun yürütülmesini öngörür.","pool":"mixed"},{"id":"cmk5271-mixed-extra-332","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Yasak ifade yöntemleri · m.148","question":"Şüpheliye suçunu kabul etmesi hâlinde ailesinin serbest bırakılacağı söylenmiş ve bu baskı altında ifade alınmıştır. Hangisi doğrudur?","options":{"A":"İfade imzalanmışsa yöntem ne olursa olsun geçerlidir.","B":"Yasak usullerle elde edilen ifade, rıza bulunsa dahi delil olarak değerlendirilemez.","C":"Aileye ilişkin vaatler her durumda hukuka uygundur.","D":"Yasak yöntem yalnız mahkeme huzurunda önem taşır."},"answer":"B","explanation":"CMK m.148 yasak ifade yöntemlerini düzenler; bu yöntemlerle elde edilen ifadeler rıza gösterilmiş olsa bile delil olarak değerlendirilemez.","pool":"mixed"},{"id":"cmk5271-mixed-extra-333","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Müdafi görevlendirilmesi · m.150","question":"Şüpheli, müdafi seçebilecek durumda olmadığını bildirerek müdafi yardımından yararlanmak istemiştir. Hangisi doğrudur?","options":{"A":"Müdafi yalnız mahkûmiyet hükmünden sonra atanabilir.","B":"Müdafi istemi soruşturmayı otomatik sona erdirir.","C":"Müdafi görevlendirilmesi mümkün değildir.","D":"CMK m.150'deki koşullar ve zorunlu müdafilik hâlleri değerlendirilerek müdafi görevlendirilmelidir."},"answer":"D","explanation":"CMK m.150, müdafi seçemeyecek durumda olanlara istemleri üzerine müdafi görevlendirilmesini ve zorunlu müdafilik hâllerini düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-extra-334","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İddianamenin iadesi · m.170, 174","question":"Mahkeme, kabul için sunulan iddianamede kanunda sayılan zorunlu unsurlardan birinin eksik olduğunu belirlemiştir. Hangisi doğrudur?","options":{"A":"Mahkeme iddianameyi incelemeden kabul etmek zorundadır.","B":"Eksiklik yalnız hüküm kesinleştikten sonra giderilebilir.","C":"CMK m.174'teki iade nedenleri ve süre çerçevesinde iddianamenin iadesi gündeme gelebilir.","D":"İddianameyi yalnız kolluk iade edebilir."},"answer":"C","explanation":"CMK m.174, iddianamenin iadesi nedenlerini ve usulünü düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-extra-335","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Duruşmaya çağrı · m.176","question":"Sanığa duruşma günü bildirilirken savunmasını hazırlayabilmesi için kanuni süreye uyulmadığı anlaşılmıştır. Hangisi doğrudur?","options":{"A":"Savunma hazırlığı ve CMK m.176'daki çağrı/tebliğ güvenceleri gözetilmelidir.","B":"Duruşma günü bildirimi gerekli değildir.","C":"Sanığın duruşmaya gelmesi her süre ihlalini otomatik önemsiz kılar.","D":"Çağrı yalnız mağdura yapılır."},"answer":"A","explanation":"CMK m.176 iddianamenin sanığa tebliği ve duruşmaya çağrıya ilişkin güvenceleri düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-extra-336","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Doğrudan soru yöneltme · m.201","question":"Duruşmada sanık müdafii tanığa doğrudan soru yöneltmek istemiş, mahkeme tarafların böyle bir hakkı bulunmadığını söylemiştir. Hangisi doğrudur?","options":{"A":"Tanığa yalnız mahkeme başkanı soru sorabilir.","B":"CMK m.201'de belirtilen kişiler, kanundaki usul ve sınırlar içinde doğrudan soru yöneltebilir.","C":"Doğrudan soru yalnız soruşturmada mümkündür.","D":"Sanık ve müdafii hiçbir koşulda tanığa soru soramaz."},"answer":"B","explanation":"CMK m.201, duruşmada doğrudan soru yöneltme usulünü ve bu hakkı kullanabilecek kişileri düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-extra-337","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Delillerin ortaya konulması · m.206","question":"Taraflardan biri, olayla ilgisiz ve hukuka aykırı elde edildiği ileri sürülen bir belgenin delil olarak okunmasını istemiştir. Mahkeme ne yapmalıdır?","options":{"A":"Taraflardan biri istediğinde delil mutlaka kabul edilir.","B":"Hukuka uygunluk yalnız hüküm kesinleştikten sonra incelenir.","C":"Belge yazılı olduğu için her durumda hükme esas alınır.","D":"CMK m.206'daki delilin ortaya konulmasının reddi nedenleri değerlendirilmelidir."},"answer":"D","explanation":"CMK m.206, delilin ortaya konulmasının reddedilebileceği hâlleri düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-extra-338","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Delillerin değerlendirilmesi · m.217","question":"Mahkeme, hükmünü duruşmada ortaya konulmamış ve tartışılmamış bir bilgiye dayandırmayı düşünmektedir. Hangisi doğrudur?","options":{"A":"Dosyadaki her bilgi tartışılmasa da otomatik hükme esas alınır.","B":"Hâkim yalnız kolluğun kanaatine göre karar verir.","C":"Hüküm, duruşmaya getirilmiş ve huzurda tartışılmış delillere dayandırılır; deliller vicdani kanaatle değerlendirilir.","D":"Sanığın savunması hiçbir zaman dikkate alınmaz."},"answer":"C","explanation":"CMK m.217 uyarınca hâkim hükmünü ancak duruşmaya getirilmiş ve huzurunda tartışılmış delillere dayandırır.","pool":"mixed"},{"id":"cmk5271-mixed-extra-339","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Hüküm türleri · m.223","question":"Yargılama sonunda yüklenen fiilin sanık tarafından işlendiği sabit görülmemiştir. Hangi hüküm türü değerlendirilmelidir?","options":{"A":"CMK m.223'teki beraat nedenleri ve diğer hüküm türleri somut olaya göre değerlendirilmelidir.","B":"Fiil sabit değilse mutlaka mahkûmiyet verilir.","C":"Mahkeme gerekçesiz erteleme kararı verir.","D":"Sanığın suçsuzluğunu ispatlayamaması tek başına mahkûmiyet için yeterlidir."},"answer":"A","explanation":"CMK m.223 hüküm türlerini düzenler; yüklenen fiilin sanık tarafından işlendiğinin sabit olmaması beraat nedenleri arasında değerlendirilir.","pool":"mixed"},{"id":"cmk5271-mixed-extra-340","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İstinaf · m.272-273","question":"İlk derece mahkemesi hükmüne karşı istinaf başvurusu yapılması düşünülmektedir. Süre ve yöntem bakımından hangisi doğrudur?","options":{"A":"İstinaf her zaman sözlü ve süresiz yapılabilir.","B":"İstinaf yalnız hüküm kesinleştikten sonra mümkündür.","C":"Karşı tarafın önceden izin vermesi gerekir.","D":"CMK m.272 ve devamındaki kapsam ile m.273'teki başvuru usulü ve süresi dikkate alınmalıdır."},"answer":"D","explanation":"CMK m.272 ve devamı istinaf yolunu, m.273 ise başvuru usulünü ve süresini düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-extra-341","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İtiraz · m.267-268","question":"Bir hâkim kararına karşı başvuru yapılacaktır. Kararın itiraz yoluna tabi olduğu anlaşılmıştır. Hangisi doğrudur?","options":{"A":"Bütün hâkim kararlarına yalnız temyiz yoluyla başvurulur.","B":"CMK m.267 ve devamındaki itiraz yolunun kapsamı, mercii ve süresi kararın niteliğine göre belirlenir.","C":"İtirazı yalnız Cumhuriyet savcısı yapabilir.","D":"İtiraz başvurusu hiçbir şekilde kararı veren makama sunulamaz."},"answer":"B","explanation":"CMK m.267-271 itiraz kanun yolunu ve usulünü düzenler; başvuru mercii ve süresi ilgili hükümlere göre belirlenir.","pool":"mixed"},{"id":"cmk5271-mixed-extra-342","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Yargıtay Cumhuriyet Başsavcısının itirazı · m.308","question":"Yargıtay ceza dairesi kararında hukuka aykırılık bulunduğunu düşünen Cumhuriyet Başsavcılığı özel bir başvuru yolunu değerlendirmektedir. Hangisi doğrudur?","options":{"A":"CMK m.308, Yargıtay Cumhuriyet Başsavcısının ceza dairesi kararına itirazına ilişkin özel usulü düzenler.","B":"CMK m.308 yalnız ilk derece ara kararlarına uygulanır.","C":"Bu yolu her vatandaş aynı adla kullanabilir.","D":"Yargıtay kararları için özel başvuru mekanizması yoktur."},"answer":"A","explanation":"CMK m.308, Yargıtay Cumhuriyet Başsavcısının ceza dairesi kararlarına itiraz yetkisini düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-extra-343","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Kanun yararına bozma · m.309","question":"Kesinleşmiş bir kararın olağan kanun yolu incelemesinden geçmediği ve hukuka aykırı olduğu ileri sürülmektedir. Kanunda belirtilen koşullarda başvurulabilecek olağanüstü yol hangisidir?","options":{"A":"Her kesinleşmiş kararın kendiliğinden yeniden yargılanması.","B":"Sanığın temyiz süresini sınırsız uzatması.","C":"CMK m.309'da düzenlenen kanun yararına bozma yolu.","D":"CMK m.201'deki doğrudan soru yöneltme."},"answer":"C","explanation":"CMK m.309, kesinleşmiş bazı karar veya hükümler bakımından kanun yararına bozma yolunu düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-extra-344","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Yargılamanın yenilenmesi · m.311","question":"Kesinleşmiş mahkûmiyet hükmünden sonra hükme esas alınan belgenin sahte olduğuna ilişkin hükmü etkileyebilecek yeni bir olgu ortaya çıkmıştır. Hangisi doğrudur?","options":{"A":"Kesinleşme hiçbir olağanüstü başvuru yoluna izin vermez.","B":"Yeni olgu otomatik olarak beraat kararı doğurur.","C":"Yargılamanın yenilenmesi her durumda ve yalnız savcı tarafından yapılabilir.","D":"CMK m.311'deki nedenler ve usul koşulları varsa yenileme talebi değerlendirilebilir."},"answer":"D","explanation":"CMK m.311 kesinleşmiş hükümlere karşı yargılamanın yenilenmesi nedenlerini düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-extra-345","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Uzlaştırma · m.253","question":"Uzlaştırma kapsamına girip girmediği henüz belirlenmemiş bir suçta taraflardan biri uzlaşmak istediğini bildirmiştir. Görevli makam nasıl hareket etmelidir?","options":{"A":"Bir taraf isterse her suçta uzlaştırma zorunludur.","B":"Suçun niteliği ve olay CMK m.253 ve devamındaki kapsam ve usul hükümlerine göre incelenmelidir.","C":"Uzlaştırma yalnız hüküm kesinleştikten sonra yapılabilir.","D":"Uzlaşma teklifi san questions.push([{"id":"cmk5271-mixed-extra-376","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Yasak ifade alma yöntemleri · m.148","question":"Şüpheli, gözaltında kendisine kötü davranıldığı ve ifade vermesi için tehdit edildiği yönünde beyanda bulunmuştur. Bu koşullarda alınan ifade bakımından CMK'nin yaklaşımı hangisidir?","options":{"A":"İfade, şüpheli sonradan imzalarsa her durumda geçerli olur.","B":"Yalnız müdafi itiraz ederse dikkate alınmaz.","C":"Yasak yöntemlerle alınan ifade, rıza gösterilmiş olsa bile delil olarak değerlendirilemez.","D":"İfade yalnız mahkûmiyet için yeterli değilse geçersiz sayılır."},"answer":"C","explanation":"CMK m.148, ifade alma ve sorguda yasak yöntemleri düzenler; bu yöntemlerle alınan ifadeler, rıza gösterilmiş olsa da delil olarak değerlendirilemez.","pool":"mixed"},{"id":"cmk5271-mixed-extra-377","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Müdafiin dosyayı incelemesi · m.153","question":"Müdafi, soruşturma dosyasındaki belgeleri incelemek ve el konulan eşyayı görmek istemiştir. Soruşturmanın amacını tehlikeye düşürme gerekçesiyle kısıtlama kararı verilebileceği belirtilmiştir. Hangisi doğrudur?","options":{"A":"Dosyayı inceleme hakkı yalnız kovuşturma başlayınca doğar.","B":"Kısıtlama ancak kanundaki koşullarla ve hâkim kararıyla uygulanabilir; şüphelinin ifadesini içeren tutanak gibi kanunda belirtilen belgelere erişim ayrıca korunur.","C":"Müdafi dosyayı hiçbir koşulda inceleyemez.","D":"Kısıtlama kararını yalnız kolluk amiri verir."},"answer":"B","explanation":"CMK m.153 müdafiin dosyayı inceleme ve belgelerden örnek alma hakkını, soruşturmanın amacını tehlikeye düşürme hâlindeki kanuni kısıtlamayı ve kısıtlanamayacak belge kategorilerini düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-extra-378","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İddianamenin iadesi · m.174","question":"Mahkeme, iddianameyi aldıktan sonra kanunda sayılan bir iade nedeni bulunduğunu tespit etmiştir. CMK m.174 bakımından aşağıdakilerden hangisi r.","pool":"mixed"},{"id":"cmk5271-mixed-extra-381","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Delillerin ortaya konulması ve tartışılması · m.217","question":"Mahkeme, duruşmada ortaya konulup tarafların huzurunda tartışılmamış bir belgeye dayanarak mahkûmiyet kurmayı düşünmektedir. CMK m.217 bakımından hangisi doğrudur?","options":{"A":"Mahkeme dosyadaki her belgeye tartışılmadan dayanabilir.","B":"Hüküm, ancak duruşmaya getirilmiş ve huzurda tartışılmış delillere dayanabilir; deliller hâkimin vicdani kanaatiyle serbestçe değerlendirilir.","C":"Yalnız sanığın kabul ettiği deliller kullanılabilir.","D":"Delillerin değerlendirilmesi yalnız bilirkişiye aittir."},"answer":"B","explanation":"CMK m.217, hükmün duruşmada ortaya konulup tartışılan delillere dayanmasını ve hâkimin delilleri vicdani kanaatine göre serbestçe değerlendirmesini öngörür.","pool":"mixed"},{"id":"cmk5271-mixed-extra-382","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Hüküm çeşitleri · m.223","question":"Yapılan yargılama sonunda yüklenen fiilin sanık tarafından işlendiği sabit değildir. Mahkemenin verebileceği karar türü bakımından hangisi doğrudur?","options":{"A":"Her durumda davanın nakli kararı verilir.","B":"Yalnız görevsizlik kararı verilebilir.","C":"Sanığın yokluğunda otomatik düşme kararı verilir.","D":"CMK m.223'teki koşullar çerçevesinde beraat kararı verilebilir."},"answer":"D","explanation":"CMK m.223 hüküm türlerini düzenler. Yüklenen suçun sanık tarafından işlendiğinin sabit olmaması, maddede sayılan beraat nedenleri kapsamındadır.","pool":"mixed"},{"id":"cmk5271-mixed-extra-383","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İtiraz · m.267","question":"Hâkimlik tarafından verilen ve kanunda itiraza tabi olduğu belirtilen bir karara karşı başvurulacak kanun yolu hangisidir?","options":{"A":"İtiraz; CMK m.267 ve devamındaki usule göre yapılır.","B":"Yalnız temyiz yoluna başvurulur.","C":"Karar kesinleşinceye kadar hiçbir başvuru yapılamaz.","D":"Yalnız Cumhuriyet savcısı başvurabilir."},"answer":"A","explanation":"CMK m.267, hâkim kararları ile kanunun gösterdiği mahkeme kararlarına karşı itiraz yolunu düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-extra-384","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İstinaf başvurusu · m.273","question":"İlk derece mahkemesinin hükmüne karşı istinaf başvurusu yapılması değerlendirilmektedir. Süre ve başvuru usulü bakımından hangi yaklaşım doğrudur?","options":{"A":"İstinaf başvurusu yalnız hüküm kesinleştikten sonra yapılabilir.","B":"Başvuru süresi bütün kararlar için altı aydır.","C":"CMK m.273'te düzenlenen süre ve başvuru usulü ile hükmün tabi olduğu kanun yolu birlikte incelenmelidir.","D":"İstinaf başvurusunu yalnız tanık yapabilir."},"answer":"C","explanation":"CMK m.273 istinaf isteminin süresini ve başvuru usulünü düzenler. Somut olayda kararın türü ve yürürlükteki metin dikkate alınmalıdır.","pool":"mixed"},{"id":"cmk5271-mixed-extra-385","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Kanun yolu başvurusu ve süre · m.39","question":"Gün olarak belirlenen bir kanun yolu süresinin son günü resmî tatile rastlamıştır. CMK m.39'a göre süre ne zaman sona erer?","options":{"A":"Tatil gününde, mesai saati sonunda.","B":"Tatil gününden önceki iş gününde.","C":"Süre otomatik olarak bir ay uzar.","D":"Tatili izleyen gün sona erer."},"answer":"D","explanation":"CMK m.39 uyarınca günle belirlenen süreler tebliği izleyen gün işlemeye başlar; son gün tatile rastlarsa süre tatili izleyen gün sona erer.","pool":"mixed"},{"id":"cmk5271-mixed-extra-386","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Eski hâle getirme · m.40-41","question":"Kişi, kendi kusuru olmaksızın kanuni süresi içinde bir usul işlemini yapamamıştır. Sürenin kaçırılmasına ilişkin başvuruda hangi kurum gündeme gelir?","options":{"A":"Kanun yararına bozma.","B":"Koşulları varsa eski hâle getirme istemi.","C":"Hükmün açıklanmasının geri bırakılması.","D":"Davaların birleştirilmesi."},"answer":"B","explanation":"CMK m.40 ve devamı, kusuru olmaksızın bir süreyi geçirmiş kişiye belirli koşullarla eski hâle getirme isteminde bulunma imkânı tanır.","pool":"mixed"},{"id":"cmk5271-mixed-extra-387","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tanığın kendisini suçlama tehlikesi · m.48","question":"Tanığa yöneltilen bir soru, kendisinin veya kanunda belirtilen yakınlarının ceza kovuşturmasına uğramasına neden olabilecek niteliktedir. Tanığın hakkı bakımından hangisi doğrudur?","options":{"A":"CMK m.48 kapsamında cevap vermekten çekinebilir.","B":"Tanık her soruya koşulsuz cevap vermek zorundadır.","C":"Tanık yalnız mahkeme başkanının izniyle salondan ayrılabilir.","D":"Tanığın susması otomatik olarak suç ikrarıdır."},"answer":"A","explanation":"CMK m.48, kendisini veya kanunda belirtilen yakınlarını ceza kovuşturmasına uğratabilecek sorulara cevap vermekten çekinme hakkını düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-extra-388","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tanığa yemin verilmeyen hâller · m.50","question":"Tanık, kanunda yemin verilmeyecek kişiler arasında yer almaktadır. Mahkeme bu durumu nasıl ele almalıdır?","options":{"A":"CMK m.50'de belirtilen kişilere yemin verilmeyeceği kuralını uygular.","B":"Tanık her durumda yemin etmek zorundadır.","C":"Tanığın beyanı hiçbir şekilde alınamaz.","D":"Yemin yerine sanığın beyanı otomatik olarak geçer."},"answer":"A","explanation":"CMK m.50, yemin verilmeyecek tanıkları belirler. Tanığın dinlenmesi ile yemin verilip verilmeyeceği ayrı konulardır.","pool":"mixed"},{"id":"cmk5271-mixed-extra-389","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Bilirkişi raporuna itiraz · m.67","question":"Bilirkişi raporu taraflara bildirilmiş; müdafi raporun eksik ve çelişkili olduğunu ileri sürmüştür. CMK m.67 kapsamında hangisi doğrudur?","options":{"A":"Rapor mahkemeyi her durumda bağlar ve tartışılamaz.","B":"Taraflar rapora karşı görüş sunabilir; gerekli görülürse bilirkişiden açıklama veya yeni inceleme istenebilir.","C":"Rapor yalnız hüküm kesinleştikten sonra incelenebilir.","D":"Bilirkişi raporuna karşı görüş bildirmek yasaktır."},"answer":"B","explanation":"CMK m.67 bilirkişi raporunun içeriğini ve tarafların rapora karşı açıklama yapabilmesini düzenler; rapor hâkimin hukuki değerlendirmesinin yerine geçmez.","pool":"mixed"},{"id":"cmk5271-mixed-extra-390","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Beden muayenesi · m.75","question":"Bir şüpheliden delil elde etmek amacıyla vücudundan kan örneği alınması düşünülmektedir. Bu işlem bakımından hangi değerlendirme doğrudur?","options":{"A":"Her kolluk görevlisi tek başına ve yazılı kayıt olmadan karar verebilir.","B":"Şüphelinin rızası varsa CMK hükümleri hiçbir durumda uygulanmaz.","C":"İşlem yalnız mahkûmiyetten sonra yapılabilir.","D":"İşlemin türüne göre CMK m.75'teki karar mercii, tıbbi gereklilik ve uygulama koşulları gözetilmelidir."},"answer":"D","explanation":"CMK m.75 şüpheli veya sanığın beden muayenesi ve vücudundan örnek alınmasına ilişkin koşulları düzenler; işlem kanundaki güvencelere uygun yürütülmelidir.","pool":"mixed"},{"id":"cmk5271-mixed-extra-391","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Konutta arama · m.119","question":"Soruşturma sırasında şüphelinin konutunda delil bulunduğu düşünülmektedir. Gecikmesinde sakınca bulunmadığı hâlde yalnız kolluk amirinin sözlü talimatıyla arama yapılması planlanmıştır. Hangisi doğrudur?","options":{"A":"Konut araması her durumda sözlü talimatla yapılabilir.","B":"Şüphelinin komşusunun rızası yeterlidir.","C":"Konut aramasında kural olarak hâkim kararı gerekir; kanundaki istisna koşulları ve yetkili merciin yazılı emri dikkate alınmalıdır.","D":"Arama kararı yalnız mahkûmiyet kararından sonra alınabilir."},"answer":"C","explanation":"CMK m.119 arama kararını ve emrini düzenler. Konut aramasında hâkim kararı esastır; gecikmesinde sakınca bulunan hâllerde kanunda öngörülen istisna usulü uygulanır.","pool":"mixed"},{"id":"cmk5271-mixed-extra-392","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Eşya veya kazançlara el koyma · m.123","question":"Soruşturmayla bağlantılı olduğu düşünülen bir eşyanın delil olarak korunması gerekmektedir. CMK m.123 bakımından hangi ifade doğrudur?","options":{"A":"Eşyanın delil olarak yararlı görülmesi veya müsadereye tabi olması hâlinde kanuni koşullarla muhafaza altına alınması ya da el konulması gündeme gelebilir.","B":"Eşyaya yalnız sahibi izin verirse el konulabilir.","C":"Eşya ancak hüküm kesinleştikten sonra korunabilir.","D":"El koyma ile müsadere aynı işlem olup her durumda kalıcıdır."},"answer":"A","explanation":"CMK m.123, ispat aracı olarak yararlı görülen veya müsadereye tabi eşya bakımından muhafaza altına alma ve el koyma hükümlerini düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-extra-393","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İletişimin denetlenmesi · m.135","question":"Soruşturma makamı, başka yöntemlerle delil elde etmenin mümkün olup olmadığını değerlendirmeden iletişimin dinlenmesine karar verilmesini istemektedir. CMK m.135 bakımından hangisi doğrudur?","options":{"A":"İletişimin denetlenmesi her suçta rutin olarak uygulanır.","B":"Mağdurun sözlü talebi tek başına yeterlidir.","C":"Tedbir için suç şüphesi bulunması dışında hiçbir koşul aranmaz.","D":"Kanunda sayılan suç, kuvvetli şüphe, başka suretle delil elde edilememe ve yetkili karar koşulları birlikte değerlendirilmelidir."},"answer":"D","explanation":"CMK m.135 iletişimin tespiti, dinlenmesi, kayda alınması ve sinyal bilgilerinin değerlendirilmesi için özel koşullar öngörür; tedbir genel ve sınırsız bir yetki değildir.","pool":"mixed"},{"id":"cmk5271-mixed-extra-394","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İhbar ve şikâyet · m.158","question":"Bir kişi, işlendiğini düşündüğü suçu Cumhuriyet başsavcılığına veya kolluk makamına bildirmek istemektedir. CMK m.158 bakımından hangisi doğrudur?","options":{"A":"İhbar yalnız noter aracılığıyla yapılabilir.","B":"İhbar veya şikâyet kanunda belirtilen makamlara yapılabilir; başvurunun sözlü yapılması hâlinde tutanağa geçirilmesi gerekir.","C":"Şikâyet sadece mahkeme hüküm verdikten sonra yapılabilir.","D":"Kolluk hiçbir şekilde ihbar alamaz."},"answer":"B","explanation":"CMK m.158 ihbar ve şikâyetin yapılabileceği makamları ve başvurunun tutanağa geçirilmesine ilişkin kuralları düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-extra-395","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İddianamenin düzenlenmesi · m.170","question":"Soruşturma sonunda toplanan deliller, suçun işlendiği konusunda yeterli şüphe oluşturmuştur. Cumhuriyet savcısının yapması gereken işlem bakımından hangisi doğrudur?","options":{"A":"Savcı doğrudan mahkûmiyet hükmü verir.","B":"Savcı soruşturma dosyasını hiçbir karar vermeden kapatır.","C":"CMK m.170'teki unsurlara uygun iddianame düzenleyerek kamu davası açılması için mahkemeye sunar.","D":"Savcı yalnız tanıklara ceza verebilir."},"answer":"C","explanation":"CMK m.170, yeterli şüphe oluştuğunda iddianame düzenlenmesini ve iddianamede bulunması gereken hususları düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-extra-396","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Hâkimin davaya bakamayacağı hâller · m.22-23","question":"Bir hâkim, aynı davada daha önce kararın kanun yolu incelemesine katılmıştır ve dosya yeniden önüne gelmiştir. Hâkimin davaya katılması bakımından hangi hüküm grubu öncelikle incelenmelidir?","options":{"A":"CMK m.22 ve m.23'teki yasaklılık ve yargılamaya katılamama hükümleri.","B":"Yalnız tanıklık hükümleri.","C":"Yalnız arama ve el koyma hükümleri.","D":"Hâkim hiçbir durumda aynı dosyada görev yapamaz; ayrıntılı inceleme gerekmez."},"answer":"A","explanation":"CMK m.22 ve m.23, hâkimin davaya bakamayacağı hâlleri ve önceki yargılama işlemlerine katılma nedeniyle doğan yasakları düzenler; somut durum bu hükümler çerçevesinde değerlendirilir.","pool":"mixed"},{"id":"cmk5271-mixed-extra-397","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tutuklama kararı · m.101","question":"Mahkeme tutuklama kararı vermeyi değerlendirmektedir. Kararın gerekçesi ve içerik bakımından CMK m.101'e uygun yaklaşım hangisidir?","options":{"A":"Tutuklama kararı gerekçesiz verilebilir.","B":"Kararda yalnız suçun adı yazılır; delillere değinilmez.","C":"Tutuklama kararı kollukça verilir ve mahkemeye bildirilmez.","D":"Kararda kuvvetli suç şüphesini, tutuklama nedenlerini ve ölçülülüğü destekleyen olgular somutlaştırılmalı; adli kontrolün neden yetersiz kalacağı açıklanmalıdır."},"answer":"D","explanation":"CMK m.101 tutuklama kararının gerekçeli olmasını ve kararda kuvvetli suç şüphesini, tutuklama nedenlerini, ölçülülüğü ve adli kontrolün yetersizliğini gösteren hususların belirtilmesini öngörür.","pool":"mixed"},{"id":"cmk5271-mixed-extra-398","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Şüphelinin serbest bırakılması · m.103","question":"Soruşturma sırasında tutuklama talebiyle sulh ceza hâkimliğine sevk edilen şüpheli hakkında tutuklama koşullarının oluşmadığı kanaatine varılmıştır. CMK m.103 kapsamında hangi sonuç mümkündür?","options":{"A":"Şüpheli mutlaka mahkûm edilir.","B":"Cumhuriyet savcısı şüpheliyi serbest bırakabilir; hâkim önüne çıkarılmışsa hâkim tutuklama talebini reddedip serbest bırakılmasına karar verebilir.","C":"Şüpheli hakkında kendiliğinden yakalama emri çıkarılır.","D":"Dosya otomatik olarak temyize gönderilir."},"answer":"B","explanation":"CMK m.103 soruşturma evresinde şüphelinin serbest bırakılması ve tutuklama talebinin reddi hâllerini düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-extra-399","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tutukluluğun incelenmesi · m.108","question":"Tutuklu şüphelinin soruşturma aşamasındaki tutukluluk durumu düzenli olarak gözden geçirilmelidir. CMK m.108 bakımından hangisi doğrudur?","options":{"A":"Tutukluluk ancak sanık talep ederse incelenebilir.","B":"İnceleme sadece hüküm kesinleştikten sonra yapılır.","C":"Tutukluluk durumu soruşturmada kanunda öngörülen aralıklarla incelenir; şüpheli veya müdafii de inceleme talebinde bulunabilir.","D":"Tutukluluk kararı verildikten sonra hiçbir inceleme yapılamaz."},"answer":"C","explanation":"CMK m.108, soruşturma evresinde tutukluluğun belirli aralıklarla incelenmesini ve şüpheli ya da müdafiinin istemi üzerine inceleme yapılabilmesini düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-extra-400","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Hükmün gerekçesi · m.230","question":"Mahkeme sanık hakkında mahkûmiyet hükmü kurmuş; ancak kabul ettiği ve reddettiği delilleri, ulaştığı kanaati ve cezanın belirlenmesine ilişkin değerlendirmeyi kararda göstermemiştir. Hangi sonuç doğrudur?","options":{"A":"Hükümde gerekçe bulunması isteğe bağlıdır.","B":"Suç adının yazılması gerekçe için yeterlidir.","C":"Gerekçe yalnız beraat kararlarında aranır.","D":"CMK m.230 uyarınca hükmün gerekçesinde bulunması gereken hususlar gösterilmelidir; eksik gerekçe kanun yolu denetiminde önem taşıyabilir."},"answer":"D","explanation":"CMK m.230 hükmün gerekçesinde delillerin tartışılması ve değerlendirilmesi ile mahkemenin ulaştığı sonuçların açıklanmasını öngörür.","pool":"mixed"}]);
questions.push([{"id":"cmk5271-mixed-extra-401","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Mağdur ve şikâyetçinin hakları · m.234","question":"Bir suçun mağduru, kovuşturma aşamasında duruşma gününden haberdar edilmek, davaya katılma talebinde bulunmak ve tanıkların davetini istemek istemektedir. CMK m.234 bakımından hangisi doğrudur?","options":{"A":"Mağdur ve şikâyetçinin kanunda sayılan hakları vardır; bu hakların kullandırılması için kendisine gerekli bilgilendirme yapılmalıdır.","B":"Bu haklar yalnız hüküm kesinleştikten sonra kullanılabilir.","C":"Mağdurun duruşmadan haberdar edilmesi yasaktır.","D":"Tanıkların dinlenmesini isteme hakkı yalnız sanığa aittir."},"answer":"A","explanation":"CMK m.234, mağdur ile şikâyetçinin soruşturma ve kovuşturmadaki haklarını düzenler. Duruşmadan haberdar edilme, davaya katılma ve tanıkların davetini isteme kanundaki koşullarla kullanılabilen haklardandır.","pool":"mixed"},{"id":"cmk5271-mixed-extra-402","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Zorunlu müdafilik · m.150","question":"Şüpheli, müdafi seçebilecek durumda olmadığını belirterek müdafi yardımından yararlanmak istediğini bildirir. Ayrıca isnat edilen suç ve şüphelinin kişisel durumu nedeniyle kanunda zorunlu müdafilik öngörülmüş olabileceği anlaşılır. Hangi yaklaşım doğrudur?","options":{"A":"Müdafi yalnız hüküm açıklandıktan sonra görevlendirilebilir.","B":"CMK m.150'deki koşullar değerlendirilir; gerekli hâllerde istem üzerine veya kanun gereği müdafi görevlendirilir.","C":"Şüpheli müdafi istemiş olsa da soruşturma boyunca avukat yardımından yararlanamaz.","D":"Müdafi görevlendirme yetkisi yalnız tanığa aittir."},"answer":"B","explanation":"CMK m.150, müdafi seçemeyecek durumda olan kişinin istemi ve kanunda belirtilen zorunlu müdafilik hâllerini düzenler. Somut olayda ilgili fıkralardaki koşullar birlikte değerlendirilir.","pool":"mixed"},{"id":"cmk5271-mixed-extra-403","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İfade alma · m.147","question":"Şüpheliye isnat edilen suç açıklanmış, ancak müdafi seçme ve hukuki yardım alma hakkı hatırlatılmadan ifadesine geçilmiştir. CMK m.147 yönünden doğru değerlendirme hangisidir?","options":{"A":"Müdafi hakkı yalnız kovuşturma başladıktan sonra doğar.","B":"Şüpheli susma hakkından yararlanamaz.","C":"İfade alma sırasında müdafi yardımından yararlanma hakkı bildirilmesi gereken usul güvencelerindendir.","D":"İfade alma tutanağı düzenlenmesine gerek yoktur."},"answer":"C","explanation":"CMK m.147, ifade alma ve sorguda uyulacak usulü düzenler. Müdafi seçme ve hukuki yardım alma hakkı, susma hakkı ve isnadın bildirilmesi bu güvenceler arasındadır.","pool":"mixed"},{"id":"cmk5271-mixed-extra-404","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Yasak ifade alma yöntemleri · m.148","question":"Bir şüphelinin ifadesi, iradesini etkileyen tehdit ve kötü muamele sonucunda alınmıştır. Şüpheli daha sonra bu ifadeyi kabul ettiğini söylese bile hangi sonuç uygulanır?","options":{"A":"İfade mutlaka hükme esas alınır.","B":"İfade ancak savcı izin verirse geçersiz sayılır.","C":"Şüphelinin sonradan kabul etmesi önceki yöntemi hukuka uygun hâle getirir.","D":"Yasak yöntemlerle alınan ifade, rıza gösterilmiş olsa dahi delil olarak değerlendirilemez."},"answer":"D","explanation":"CMK m.148, ifade alma ve sorguda yasak yöntemleri düzenler. Bu yöntemlerle elde edilen ifadeler, kişi rıza göstermiş olsa bile delil olarak değerlendirilemez.","pool":"mixed"},{"id":"cmk5271-mixed-extra-405","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Soruşturma yükümlülüğü · m.160","question":"Cumhuriyet savcısı, işlendiği izlenimini veren bir hâli öğrenmiştir. Delillerin yalnız şüpheli aleyhine olanlarını toplaması gerektiğini düşünmektedir. CMK m.160'a göre hangisi doğrudur?","options":{"A":"Savcı maddi gerçeğin araştırılması için şüphelinin lehine ve aleyhine olan delilleri toplamak ve haklarını korumakla yükümlüdür.","B":"Savcı yalnız mahkûmiyeti destekleyen delilleri toplar.","C":"Savcı suç şüphesini öğrense de hiçbir araştırma yapamaz.","D":"Lehe deliller yalnız hüküm kesinleştikten sonra toplanabilir."},"answer":"A","explanation":"CMK m.160, suç işlendiği izlenimini veren bir hâli öğrenen Cumhuriyet savcısının maddi gerçeği araştırma görevini ve şüphelinin lehine ve aleyhine delilleri toplama yükümlülüğünü düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-extra-406","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Kovuşturmaya yer olmadığı kararı · m.172-173","question":"Soruşturma sonunda kamu davası açılması için yeterli şüphe oluşturacak delil elde edilememiştir. Cumhuriyet savcısı kovuşturmaya yer olmadığına karar vermiştir. Bu karara karşı kanuni koşullarla hangi yol gündeme gelir?","options":{"A":"Doğrudan temyiz.","B":"CMK m.173 uyarınca sulh ceza hâkimliğine itiraz.","C":"Hükmün açıklanmasının geri bırakılması.","D":"Yalnız tanıkların yeniden dinlenmesi."},"answer":"B","explanation":"CMK m.172 kovuşturmaya yer olmadığı kararını, m.173 ise bu karara karşı itiraz yolunu ve başvuru usulünü düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-extra-407","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İddianamenin kabulü · m.175","question":"Mahkeme iddianameyi kabul etmiş, ancak ilk duruşma henüz yapılmamıştır. Ceza muhakemesinin evresi bakımından hangisi doğrudur?","options":{"A":"Soruşturma, ilk duruşma başlayıncaya kadar devam eder.","B":"Kovuşturma ancak hüküm açıklandığında başlar.","C":"İddianamenin kabulüyle kamu davası açılmış ve kovuşturma evresi başlamıştır.","D":"İddianamenin kabulü, hükmün kesinleştiği anlamına gelir."},"answer":"C","explanation":"CMK m.175 uyarınca iddianamenin kabulüyle kamu davası açılmış olur ve kovuşturma evresi başlar. İlk duruşmanın yapılması evrenin başlaması için beklenmez.","pool":"mixed"},{"id":"cmk5271-mixed-extra-408","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Duruşmada delillerin tartışılması · m.216","question":"Duruşmada deliller ortaya konulup tartışıldıktan sonra mahkeme hüküm kurmaya hazırlanmaktadır. Cumhuriyet savcısı esas hakkındaki görüşünü bildirmiştir. Sanığa son söz verilmesi konusunda hangisi doğrudur?","options":{"A":"Son söz yalnız mağdura verilir.","B":"Son sözün verilmesi mahkemenin tercihine bırakılmıştır.","C":"Sanığa son söz verilmesi yalnız beraat kararı verilecekse gerekir.","D":"Hükümden önce hazır bulunan sanığa son söz verilmesi gerekir."},"answer":"D","explanation":"CMK m.216, delillerin tartışılması sırasını ve hükümden önce hazır bulunan sanığa son söz verilmesini düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-extra-409","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Delillerin değerlendirilmesi · m.217","question":"Mahkeme, duruşmada taraflara açıklanmamış ve tartışılmamış bir rapora dayanarak sanık hakkında mahkûmiyet kurmayı düşünmektedir. CMK m.217 bakımından doğru seçenek hangisidir?","options":{"A":"Hüküm, ancak duruşmaya getirilmiş ve huzurda tartışılmış delillere dayanabilir; deliller vicdani kanaate göre değerlendirilir.","B":"Dosyadaki her belge tartışılmadan hükme esas alınabilir.","C":"Delilleri değerlendirme yetkisi yalnız bilirkişiye aittir.","D":"Mahkeme yalnız sanığın kabul ettiği delilleri dikkate alabilir."},"answer":"A","explanation":"CMK m.217 uyarınca hâkim kararını ancak duruşmaya getirilmiş ve huzurunda tartışılmış delillere dayandırabilir; deliller vicdani kanaate göre serbestçe değerlendirilir.","pool":"mixed"},{"id":"cmk5271-mixed-extra-410","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Hüküm çeşitleri · m.223","question":"Yargılama sonunda yüklenen suçun sanık tarafından işlendiği sabit olmamıştır. Mahkemenin hüküm türü bakımından hangi seçeneği değerlendirmesi gerekir?","options":{"A":"Her durumda görevsizlik kararı.","B":"CMK m.223'teki beraat nedenleri kapsamında beraat kararı.","C":"Yalnız davanın nakli kararı.","D":"Otomatik olarak tutuklama kararı."},"answer":"B","explanation":"CMK m.223 hüküm türlerini ve beraat nedenlerini düzenler. Yüklenen suçun sanık tarafından işlendiğinin sabit olmaması, kanundaki beraat nedenleri arasında değerlendirilir.","pool":"mixed"},{"id":"cmk5271-mixed-extra-411","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Hükmün gerekçesi · m.230","question":"Mahkeme mahkûmiyet hükmünde hangi delilleri kabul ettiğini, savunmanın esaslı iddialarını neden reddettiğini ve ulaştığı sonucu açıklamamıştır. Hangi değerlendirme doğrudur?","options":{"A":"Gerekçe yalnız taraflar isterse yazılır.","B":"Mahkûmiyet kararlarında gerekçe aranmaz.","C":"CMK m.230'da belirtilen gerekçe unsurları kararda gösterilmelidir.","D":"Suçun adının yazılması her durumda yeterlidir."},"answer":"C","explanation":"CMK m.230, hükmün gerekçesinde delillerin tartışılması ve değerlendirilmesi, sabit görülen fiil ve hukuki nitelendirme gibi hususların açıklanmasını öngörür.","pool":"mixed"},{"id":"cmk5271-mixed-extra-412","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Duruşmanın açıklığı · m.182","question":"Bir ceza davasında mahkeme, duruşmanın herkesin katılımına açık yapılmasının yargılamayı zorlaştıracağını söyleyerek hiçbir gerekçe ve kanuni dayanak göstermeden duruşmayı kapalı yapmayı planlamaktadır. CMK m.182'ye göre hangisi doğrudur?","options":{"A":"Bütün ceza duruşmaları zorunlu olarak kapalı yapılır.","B":"Duruşmanın açıklığı yalnız savcının iznine bağlıdır.","C":"Mahkeme duruşmayı gerekçesiz olarak her zaman kapalı yapabilir.","D":"Duruşmanın açıklığı kuraldır; kapalılık ancak kanunda öngörülen koşullarla kararlaştırılabilir."},"answer":"D","explanation":"CMK m.182 duruşmanın aleniyetini temel kural olarak benimser ve duruşmanın kapalı yapılabileceği istisnai hâlleri düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-extra-413","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Müdafiin dosyayı incelemesi · m.153","question":"Müdafi, soruşturma dosyasını incelemek istemiştir. Soruşturmanın amacını tehlikeye düşürme ihtimali ileri sürülerek dosyanın tamamının hiçbir karar alınmadan gösterilmeyeceği söylenmiştir. CMK m.153 açısından hangisi doğrudur?","options":{"A":"Dosyayı inceleme hakkı ve olası kısıtlama, m.153'teki koşullar ve istisnalar çerçevesinde değerlendirilmelidir; kısıtlama sınırsız ve kendiliğinden uygulanamaz.","B":"Müdafi soruşturma dosyasını hiçbir zaman inceleyemez.","C":"Dosyayı inceleme hakkı yalnız hüküm kesinleştikten sonra doğar.","D":"Kısıtlama kararını yalnız tanık verebilir."},"answer":"A","explanation":"CMK m.153 müdafiin dosyayı inceleme hakkını, soruşturmanın amacını tehlikeye düşürme hâlindeki kısıtlamanın koşullarını ve kısıtlanamayacak belge gruplarını düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-extra-414","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Mağdurun vekil görevlendirilmesi · m.234, 239","question":"Suçtan zarar gören kişi, kanunda belirtilen koşulların bulunduğunu belirterek vekil yardımından yararlanmak istemektedir. Bu talep nasıl değerlendirilmelidir?","options":{"A":"Vekil yalnız mahkûmiyet hükmü kesinleştikten sonra görevlendirilebilir.","B":"Mağdur veya katılan için vekil görevlendirilmesi, CMK'de ilgili hak ve koşulları düzenleyen hükümler çerçevesinde ele alınır.","C":"Ceza muhakemesinde mağdurun vekille temsil edilmesi hiçbir koşulda mümkün değildir.","D":"Vekil görevlendirilmesine yalnız sanık karar verebilir."},"answer":"B","explanation":"CMK m.234 mağdur ve şikâyetçinin haklarını, m.239 ise katılana vekil görevlendirilmesini düzenler. Talep, ilgili maddelerdeki koşullara göre değerlendirilir.","pool":"mixed"},{"id":"cmk5271-mixed-extra-415","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tercüman görevlendirilmesi · m.202","question":"Sanık, duruşmada yapılan açıklamaları anlayabilecek ölçüde Türkçe bilmediğini belirtmiştir. Savunma hakkını etkin kullanabilmesi için hangi işlem gündeme gelir?","options":{"A":"Sanığın duruşmadan çıkarılması.","B":"Sanığın tüm haklarından vazgeçmiş sayılması.","C":"CMK m.202 uyarınca tercüman aracılığıyla açıklamaların çevrilmesi ve kanundaki güvencelerin sağlanması.","D":"Yalnız yazılı kararın hüküm kesinleştikten sonra çevrilmesi."},"answer":"C","explanation":"CMK m.202, Türkçe bilmeyen veya engeli nedeniyle açıklamaları anlayamayan kişiler bakımından tercüman aracılığıyla iletişimin sağlanmasına ilişkin hükümleri içerir.","pool":"mixed"},{"id":"cmk5271-mixed-extra-416","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Doğrudan soru yöneltme · m.201","question":"Duruşmada sanık müdafii tanığa bir soru yöneltmek istemektedir. Salondaki sanık yakını da aynı tanığa doğrudan soru sormak istediğini belirtmiştir. CMK m.201'e göre hangisi doğrudur?","options":{"A":"Duruşmada hiçbir katılımcı soru soramaz.","B":"Doğrudan soru sorma hakkı yalnız tanık yakınlarına aittir.","C":"Savcı dâhil tarafların temsilcileri hiçbir koşulda doğrudan soru soramaz.","D":"Cumhuriyet savcısı, müdafi ve vekil doğrudan soru yöneltebilir; diğer kişiler sorularını mahkeme başkanı veya hâkim aracılığıyla yöneltir."},"answer":"D","explanation":"CMK m.201, Cumhuriyet savcısı, müdafi ve vekilin doğrudan soru yöneltebilmesini; diğer kişilerin ise sorularını mahkeme başkanı veya hâkim aracılığıyla yöneltmesini düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-extra-417","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tanıkların dinlenmesi · m.52","question":"Aynı olay hakkında bilgisi bulunan iki tanığın beyanlarının birbirini etkileyebileceği anlaşılmaktadır. CMK m.52 bakımından hangi uygulama doğrudur?","options":{"A":"Tanıklar kural olarak ayrı ayrı dinlenir; kanundaki koşullarla yüzleştirme de yapılabilir.","B":"Tanıklar mutlaka aynı anda ve birbirlerinin yanında dinlenir.","C":"Tanıkların beyanları hiçbir tutanağa geçirilmez.","D":"Tanık dinlenmesi yalnız hüküm kesinleştikten sonra mümkündür."},"answer":"A","explanation":"CMK m.52 tanıkların dinlenmesini ve yüzleştirmeyi düzenler. Tanıkların birbirlerinin anlatımlarından etkilenmesini önlemek amacıyla kural olarak ayrı ayrı dinlenmeleri esastır.","pool":"mixed"},{"id":"cmk5271-mixed-extra-418","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Bilirkişi raporuna karşı açıklama · m.67","question":"Bilirkişi raporunda hesaplama yöntemi açıklanmamış ve raporun bir bölümü dosyadaki başka bir belgeyle çelişmiştir. Müdafi rapora karşı görüş bildirmek istemektedir. Hangisi doğrudur?","options":{"A":"Bilirkişi raporu her durumda mahkemeyi bağlar.","B":"Taraflar rapora karşı açıklama yapabilir; gerekli görülürse bilirkişiden açıklama veya yeni inceleme istenebilir.","C":"Raporun tartışılması yalnız hüküm kesinleştikten sonra mümkündür.","D":"Müdafi bilirkişi raporuna karşı görüş bildiremez."},"answer":"B","explanation":"CMK m.67, bilirkişi raporunun taraflara bildirilmesini ve rapora karşı açıklama yapılabilmesini düzenler. Bilirkişi görüşü hâkimin hukuki değerlendirmesinin yerine geçmez.","pool":"mixed"},{"id":"cmk5271-mixed-extra-419","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Yakalama emri · m.98","question":"Soruşturma sırasında şüphelinin usulüne uygun çağrıya rağmen gelmediği ve kanuni koşulların oluştuğu değerlendirilmiştir. Yakalama emri bakımından hangi hüküm incelenmelidir?","options":{"A":"CMK m.230; yalnız hüküm gerekçesi.","B":"CMK m.45; tanıklıktan çekinme.","C":"CMK m.98; yakalama emrinin düzenlenmesi ve koşulları.","D":"CMK m.182; duruşmanın açıklığı."},"answer":"C","explanation":"CMK m.98, soruşturma ve kovuşturma aşamalarında yakalama emrinin düzenlenmesi ve buna ilişkin koşulları düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-extra-420","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tutuklama ve adli kontrol · m.100, 109","question":"Dosyada kuvvetli suç şüphesini gösteren somut deliller bulunduğu ileri sürülmektedir. Ancak mahkeme, adli kontrol tedbirlerinin neden yetersiz kalacağını değerlendirmeden tutuklama kararı vermek istemektedir. Hangisi doğrudur?","options":{"A":"Kuvvetli şüphe iddiası tek başına her durumda tutuklama için yeterlidir.","B":"Tutuklama kararı yalnız kolluk tarafından verilebilir.","C":"Adli kontrol tutuklamadan sonra hiçbir zaman değerlendirilemez.","D":"Tutuklama koşulları ve ölçülülük değerlendirilirken adli kontrolün yeterli olup olmadığı da kanuni çerçevede ele alınmalıdır."},"answer":"D","explanation":"CMK m.100 tutuklama nedenlerini ve ölçülülüğü, m.109 ise tutuklama yerine uygulanabilecek adli kontrol tedbirlerini düzenler. Tutuklama otomatik bir sonuç değildir.","pool":"mixed"},{"id":"cmk5271-mixed-extra-421","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Soruşturma işlemlerinin tutanağa bağlanması · m.169","question":"Soruşturma sırasında şüphelinin ifadesi alınmış, ancak işlem tutanağında hazır bulunan kişilere ve yapılan işleme ilişkin temel bilgiler yer almamıştır. CMK m.169 bakımından hangisi doğrudur?","options":{"A":"Soruşturma işlemleri kanunda öngörülen biçimde tutanağa bağlanmalı; tutanakta işlemin ve katılanların belirlenmesine yarayan gerekli bilgiler bulunmalıdır.","B":"Soruşturma işlemlerinin yazılı kayda alınması hiçbir zaman gerekmez.","C":"Tutanak yalnız hüküm kesinleştikten sonra hazırlanır.","D":"Tutanak düzenleme yükümlülüğü yalnız tanığa aittir."},"answer":"A","explanation":"CMK m.169 soruşturma işlemlerinin tutanağa bağlanmasını ve tutanakta bulunması gereken bilgileri düzenler. Tutanak, işlemin nasıl yapıldığının denetlenebilmesi açısından önemlidir.","pool":"mixed"},{"id":"cmk5271-mixed-extra-422","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Duruşmaya çağrı · m.176","question":"Sanığa duruşma günü bildirilirken savunmasını hazırlaması için çağrı kâğıdının tebliği ile duruşma günü arasında kanunun aradığı asgari süreye uyulmamıştır. Sanığın da bu süreden vazgeçtiğine ilişkin talebi yoktur. Hangisi doğrudur?","options":{"A":"Asgari süre yalnız savcı isterse uygulanır.","B":"CMK m.176'daki çağrı ve süre kuralları gözetilmeli; kanuni istisna veya geçerli vazgeçme yoksa savunma hazırlığına ilişkin güvence korunmalıdır.","C":"Sanığa duruşma gününün bildirilmesine gerek yoktur.","D":"Süreye uyulmaması sanığın otomatik mahkûmiyeti sonucunu doğurur."},"answer":"B","explanation":"CMK m.176 sanığa çağrı kâğıdının tebliğini ve duruşma öncesindeki asgari süreyi düzenler. Savunmanın hazırlanabilmesi için kanuni süre ve istisnalar somut olayda gözetilmelidir.","pool":"mixed"},{"id":"cmk5271-mixed-extra-423","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Davaya katılma · m.237","question":"Suçtan doğrudan zarar gördüğünü belirten kişi, kovuşturma aşamasında davaya katılmak istediğini bildirmiştir. Mahkemenin öncelikle incelemesi gereken konu hangisidir?","options":{"A":"Kişinin otomatik olarak sanık sıfatı kazanması.","B":"Katılma talebinin hüküm kesinleştikten sonra yapılmış sayılması.","C":"CMK m.237 ve devamındaki katılma koşullarının oluşup oluşmadığı.","D":"Kişinin tanık olarak dinlenmesinin her durumda yasaklanması."},"answer":"C","explanation":"CMK m.237 ve devamı, kamu davasına katılma koşullarını ve usulünü düzenler. Suçtan zarar gördüğünü ileri süren kişinin talebi kanuni koşullar çerçevesinde değerlendirilir.","pool":"mixed"},{"id":"cmk5271-mixed-extra-424","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İtiraz kanun yolu · m.267","question":"Hâkim tarafından verilen ve kanunda itiraza tabi olduğu belirtilen bir karara karşı taraf kanun yoluna başvurmak istemektedir. Hangi ifade doğrudur?","options":{"A":"Her hâkim kararı yalnız temyiz edilebilir.","B":"Kanun yolları yalnız hüküm kesinleştikten sonra kullanılabilir.","C":"İtiraz yoluna yalnız tanık başvurabilir.","D":"CMK m.267 ve devamındaki hükümler uyarınca, itiraza tabi kararlar bakımından itiraz kanun yolu gündeme gelir."},"answer":"D","explanation":"CMK m.267, hâkim kararları ile kanunun gösterdiği mahkeme kararlarına karşı itiraz yolunu düzenler. Somut kararın itiraza tabi olup olmadığı ilgili hükümlere göre belirlenir.","pool":"mixed"},{"id":"cmk5271-mixed-extra-425","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İstinaf · m.272-273","question":"İlk derece mahkemesi hükmü açıklamış ve taraflardan biri kararın maddi vakıa ile hukuki değerlendirme yönünden hatalı olduğunu ileri sürerek üst mahkeme incelemesi istemiştir. İstinaf bakımından hangi yaklaşım doğrudur?","options":{"A":"İstinaf yalnız hüküm kesinleştikten sonra mümkündür.","B":"İstinaf başvurusunu yalnız tanık yapabilir.","C":"İlk derece mahkemesinin bütün kararları hiçbir istisna olmadan istinafa açıktır.","D":"Kararın istinafa tabi olup olmadığı ve başvurunun süresi ile usulü CMK m.272 ve devamındaki hükümlere göre değerlendirilmelidir."},"answer":"D","explanation":"CMK m.272 ve devamı istinaf kanun yolunu, istinafa tabi kararları ve başvuru usulünü düzenler. Her kararın kanun yolu durumu ilgili hükümlere göre belirlenir.","pool":"mixed"}{"id":"cmk5271-mixed-extra-426","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tanıklıktan çekinme · m.46","question":"Bir soruşturma kapsamında, şüphelinin avukatı sıfatıyla kendisine açıklanan ve mesleki ilişki nedeniyle öğrendiği bilgileri bilen bir kişi tanık olarak çağrılmıştır. Tanıklıktan çekinme bakımından aşağıdaki ifadelerden hangisi CMK'nin sistematiğine uygundur?","options":{"A":"Avukat, mesleğiyle ilgili öğrendiği her bilgiyi hiçbir istisna olmaksızın açıklamak zorundadır.","B":"Meslek sırrı yalnız kovuşturma evresinde korunur; soruşturmada açıklanabilir.","C":"Avukatın tanıklıktan çekinmesi ancak şüphelinin yazılı izniyle mümkündür ve bu izin her durumda zorunludur.","D":"Müdafiin mesleği nedeniyle öğrendiği bilgiler bakımından tanıklıktan çekinme hakkı vardır; kanundaki istisna ve koşullar ayrıca gözetilir."},"answer":"D","explanation":"CMK m.46, meslek veya sürekli uğraşıları nedeniyle tanıklıktan çekinme hakkı bulunan kişileri düzenler. Avukatın mesleki sır kapsamındaki bilgileri bakımından bu güvence gözetilir.","pool":"mixed"},{"id":"cmk5271-mixed-extra-427","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tanıklıktan çekinme · m.48","question":"Tanık, kendisine sorulan belirli bir soruya doğru cevap vermesi hâlinde kendisini ceza kovuşturmasına uğratabilecek bir açıklama yapmak zorunda kalacağını belirtmiştir. CMK m.48 bakımından hangisi doğrudur?","options":{"A":"Tanık, kendisini veya kanunda belirtilen yakınlarını ceza kovuşturmasına uğratabilecek sorulara cevap vermekten çekinebilir.","B":"Tanık, yemin ettikten sonra hiçbir soruya cevap vermekten çekinemez.","C":"Bu hak yalnız sanığa tanınmış olup tanık bakımından uygulanmaz.","D":"Tanık ancak mahkûmiyet kararı kesinleştikten sonra cevap vermekten kaçınabilir."},"answer":"A","explanation":"CMK m.48, tanığın kendisini veya kanunda belirtilen yakınlarını ceza kovuşturmasına uğratabilecek sorulara cevap vermekten çekinebileceğini düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-extra-428","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tanığın dinlenmesi · m.52","question":"Mahkeme, tanıkların duruşmada birbirlerinin anlatımlarını duymalarının beyanlarını etkileyebileceğini değerlendirmiştir. Tanıkların dinlenme usulü bakımından hangi uygulama CMK'ye uygundur?","options":{"A":"Bütün tanıklar zorunlu olarak aynı anda dinlenir ve birbirlerinin beyanlarını tartışır.","B":"Tanıklar kural olarak ayrı ayrı dinlenir; henüz dinlenmemiş tanıklar dinleme sırasında salonda bulunmaz.","C":"Tanık yalnız sanıkla yüz yüze aynı masada oturursa dinlenebilir.","D":"Tanık beyanı yalnız yazılı olarak alınabilir; duruşmada dinlenmesi mümkün değildir."},"answer":"B","explanation":"CMK m.52 uyarınca tanıklar kural olarak ayrı ayrı dinlenir ve henüz dinlenmemiş tanıklar dinleme sırasında salonda bulunmaz. Kanundaki özel hâller saklıdır.","pool":"mixed"},{"id":"cmk5271-mixed-extra-429","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tanığa yemin · m.54-55","question":"Duruşmada tanığa yemin verdirilmesi gündeme gelmiştir. CMK'de yeminin biçimi ve tanıklık öncesi yemin kuralı hakkında aşağıdaki ifadelerden hangisi doğrudur?","options":{"A":"Her tanık, yaşı ve durumu ne olursa olsun, aynı koşullarda ve istisnasız yemin eder.","B":"Yemin yalnız savcının talebiyle ve soruşturma tamamlandıktan sonra verdirilebilir.","C":"Tanığa yemin verdirilmesine ilişkin usul kanunda düzenlenmiştir; yemin kuralı ve yemin verdirilmeyen istisnai kişiler CMK hükümlerine göre belirlenir.","D":"Tanık yemini yalnız yazılı belgeyle verilebilir; sözlü yemin yasaktır."},"answer":"C","explanation":"CMK m.54-55, tanığa yemin verilmesini ve yeminin biçimini düzenler. Kimin hangi koşullarda yemin edeceği kanundaki genel kural ve istisnalara göre belirlenir.","pool":"mixed"},{"id":"cmk5271-mixed-extra-430","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tanıklıktan sebepsiz çekinme · m.60","question":"Tanık, kanuni bir çekinme sebebi bulunmadığı hâlde tanıklık yapmayı reddetmiş ve yeminden de kaçınmıştır. CMK m.60 bakımından aşağıdakilerden hangisi doğrudur?","options":{"A":"Tanığın reddi davanın otomatik olarak düşmesine neden olur.","B":"Tanık hakkında yalnız para cezası verilebilir; başka tedbir mümkün değildir.","C":"Tanığın yükümlülüğünü yerine getirmemesi hâlinde herhangi bir yaptırım uygulanamaz.","D":"Kanuni koşullarla, tanıklığın veya yeminin gerçekleştirilmesini sağlamak üzere disiplin hapsi uygulanabilir; yükümlülüğe uygun davranınca kişi derhâl serbest bırakılır."},"answer":"D","explanation":"CMK m.60, yasal sebep olmaksızın tanıklıktan veya yeminden çekinen tanık hakkında giderler yanında, kanuni sınırlar içinde disiplin hapsi uygulanabilmesini ve yükümlülük yerine getirilince derhâl serbest bırakılmasını öngörür.","pool":"mixed"},{"id":"cmk5271-mixed-extra-431","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tanık giderleri · m.61","question":"Mahkemece çağrılan tanık duruşmaya gelmiş, yol ve diğer zorunlu giderleri nedeniyle ödeme talep etmiştir. CMK m.61'e göre tanığın giderleri bakımından hangisi doğrudur?","options":{"A":"Tanığa, kanunda öngörülen esaslara göre kaybettiği zamanla orantılı tazminat ile yol ve ikamet giderleri ödenebilir.","B":"Tanık yalnız mahkûmiyet kararı verilirse giderlerini alabilir.","C":"Tanığın giderleri her durumda sanık tarafından duruşma günü elden ödenir.","D":"Tanığın yol giderleri hiçbir koşulda karşılanmaz."},"answer":"A","explanation":"CMK m.61, tanığa kaybettiği zamanla orantılı tazminat ile yol ve ikamet giderlerinin ödenmesini düzenler. Ödeme, kanundaki usul ve esaslara tabidir.","pool":"mixed"},{"id":"cmk5271-mixed-extra-432","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Bilirkişi raporu · m.67","question":"Bilirkişi, teknik incelemesini tamamlayarak raporunu mahkemeye sunmuştur. Taraflardan biri rapordaki yöntemin hatalı olduğunu ileri sürerek ek açıklama istemektedir. CMK m.67 bakımından hangi ifade doğrudur?","options":{"A":"Bilirkişi raporu mahkemeyi kesin olarak bağlar; taraflar rapora ilişkin görüş bildiremez.","B":"Taraflar bilirkişi raporuna karşı görüş bildirebilir ve kanunun tanıdığı koşullarla yeni bir bilirkişi incelemesi talep edebilir.","C":"Bilirkişi raporu yalnız soruşturma evresinde alınabilir.","D":"Raporun duruşmada tartışılması yasaktır."},"answer":"B","explanation":"CMK m.67, bilirkişi raporunun içeriğini ve taraflara tanınan hakları düzenler. Rapor, hâkimin delilleri serbestçe değerlendirme yetkisinin yerine geçmez; taraflar kanuni çerçevede görüş ve talepte bulunabilir.","pool":"mixed"},{"id":"cmk5271-mixed-extra-433","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Gözlem altına alınma · m.74","question":"Şüphelinin fiili işlediği yönünde kuvvetli şüpheler vardır ve akıl hastalığı bulunup bulunmadığı ile bunun davranışlarına etkisi araştırılacaktır. Soruşturma evresinde gözlem altına alınma kararını kim, hangi temel usulle verebilir?","options":{"A":"Kolluk amiri, herhangi bir sağlık değerlendirmesi olmadan süresiz karar verebilir.","B":"Cumhuriyet savcısı tek başına ve müdafii dinlemeden her durumda karar verir.","C":"Uzman hekim önerisi üzerine savcı ve müdafi dinlendikten sonra sulh ceza hâkimi karar verebilir; kanuni süre sınırları uygulanır.","D":"Karar yalnız hüküm kesinleştikten sonra verilebilir."},"answer":"C","explanation":"CMK m.74'e göre soruşturmada sulh ceza hâkimi, kovuşturmada mahkeme karar verir. Uzman hekim önerisi ve savcı ile müdafiin dinlenmesi gerekir; süreler kanunla sınırlandırılmıştır.","pool":"mixed"},{"id":"cmk5271-mixed-extra-434","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Herkes tarafından yakalama · m.90","question":"Bir kişi, bir başkasını suçu işlerken görmüş ve olay yerinde geçici olarak yakalamıştır. Bu yakalama işleminin CMK m.90 bakımından hukuki dayanağı aşağıdakilerden hangisidir?","options":{"A":"Herkesin, suç işlendiğine dair yalnız söylenti duyması yakalama için yeterlidir.","B":"Özel kişiler yalnız savcının önceden yazılı emriyle yakalama yapabilir.","C":"Suçüstü hâlinde yakalama yetkisi yalnız hâkim ve mahkemeye aittir.","D":"CMK'de belirtilen suçüstü hâllerinde herkes tarafından geçici yakalama yapılabilir; kişi ve olayın koşulları kanuni çerçevede değerlendirilir."},"answer":"D","explanation":"CMK m.90/1, kişiye suçu işlerken rastlanması veya maddede belirtilen bazı suçüstü durumlarında herkes tarafından geçici yakalama yapılabilmesini düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-extra-435","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Yakalanan kişinin hakları · m.90-91","question":"Kolluk tarafından yakalanan kişi, yakalama nedenini ve haklarını öğrenmek istemektedir. Yakalama sonrasında yapılacak işlemler bakımından aşağıdaki ifadelerden hangisi doğrudur?","options":{"A":"Yakalama işlemi ve devamındaki gözaltı süreci kanuni usul ve sürelerle sınırlıdır; yakalanan kişiye hakları bildirilir ve ilgili işlemler tutanağa bağlanır.","B":"Yakalama nedeni ve haklar hiçbir durumda kişiye bildirilmez.","C":"Kolluk, yakalanan kişiyi savcının denetimi olmadan süresiz gözaltında tutabilir.","D":"Yakalanan kişinin müdafiyle görüşme hakkı hüküm kesinleşene kadar doğmaz."},"answer":"A","explanation":"CMK m.90-91 yakalama ve gözaltı işlemlerini, savcının denetimini, süreleri ve yakalanan kişinin haklarına ilişkin güvenceleri düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-extra-436","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tutuklama nedenleri · m.100","question":"Şüpheli hakkında kuvvetli suç şüphesini gösteren somut deliller bulunduğu ileri sürülmektedir. Ancak kaçma, delilleri yok etme veya kanunda düzenlenen başka bir tutuklama nedeni yönünden dosyada olgu gösterilmemiştir. Hangisi doğrudur?","options":{"A":"Kuvvetli suç şüphesi varsa tutuklama her durumda zorunludur.","B":"Kuvvetli suç şüphesini gösteren somut deliller yanında tutuklama nedeni ve ölçülülük koşulları da değerlendirilmelidir.","C":"Tutuklama için yalnız kolluğun kanaati yeterlidir.","D":"Tutuklama kararı mağdurun talebi üzerine otomatik olarak verilir."},"answer":"B","explanation":"CMK m.100'e göre tutuklama için kuvvetli suç şüphesini gösteren somut deliller ve bir tutuklama nedeni gerekir; ayrıca tedbir ölçülü olmalıdır.","pool":"mixed"},{"id":"cmk5271-mixed-extra-437","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Tutuklama kararının içeriği · m.101","question":"Hâkim, şüpheli hakkında tutuklama kararı vermeyi değerlendirmektedir. Kararın gerekçesi bakımından aşağıdakilerden hangisi CMK'nin aradığı güvenceye uygundur?","options":{"A":"Kararda hiçbir gerekçe gösterilmeden yalnız suçun adı yazılması yeterlidir.","B":"Tutuklama kararı sözlü verildiğinde dosyaya geçirilmesine gerek yoktur.","C":"Tutuklama kararında kuvvetli suç şüphesini, tutuklama nedenlerini ve ölçülülüğü destekleyen somut olgular gerekçelendirilmelidir.","D":"Kararın gerekçesini yalnız kolluk hazırlar; hâkim gerekçe yazmaz."},"answer":"C","explanation":"CMK m.101, tutuklama kararının gerekçeli olmasını ve tutuklama nedenleri ile ölçülülüğe ilişkin somut olguların gösterilmesini gerektirir.","pool":"mixed"},{"id":"cmk5271-mixed-extra-438","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Adli kontrol · m.109","question":"Tutuklama koşullarının tartışıldığı bir dosyada hâkim, kişinin yargılamaya katılmasını sağlamak ve kaçma riskini azaltmak amacıyla daha hafif bir tedbiri değerlendirmektedir. CMK m.109 bakımından hangisi doğrudur?","options":{"A":"Adli kontrol yalnız mahkûmiyet hükmü kesinleştikten sonra uygulanabilir.","B":"Adli kontrol, kişinin rızası yoksa hiçbir koşulda uygulanamaz.","C":"Adli kontrol, tutuklamadan bağımsız olarak her suçta otomatik uygulanır.","D":"Kanuni koşulları varsa tutuklama yerine adli kontrol kararı verilebilir; uygulanacak yükümlülükler ve koşullar kararın kapsamına göre belirlenir."},"answer":"D","explanation":"CMK m.109, tutuklama nedenlerinin varlığı hâlinde kanuni koşullarla tutuklama yerine adli kontrol uygulanabilmesini düzenler. Tedbirin türü ve kapsamı kanun hükümlerine göre belirlenir.","pool":"mixed"},{"id":"cmk5271-mixed-extra-439","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Arama kararı · m.119","question":"Kolluk, bir konutta suç delili bulunduğu şüphesiyle arama yapmak istemektedir. Gecikmesinde sakınca bulunduğu belirtilmiş, ancak Cumhuriyet savcısına ulaşılabilmektedir. Arama kararı bakımından hangi seçenek doğrudur?","options":{"A":"Konut araması için hâkim kararı veya gecikmesinde sakınca bulunan hâlde savcının yazılı emri gerekir; kolluk amirinin emri tek başına yeterli değildir.","B":"Konut araması her durumda sözlü kolluk emriyle yapılabilir.","C":"Arama kararında aranacak yerin gösterilmesine gerek yoktur.","D":"Konut araması için yalnız ev sahibinin rızası varsa yargısal usule gerek kalmaz."},"answer":"A","explanation":"CMK m.119 arama kararını ve emrini düzenler. Konut ve benzeri kapalı alanlarda hâkim kararı veya gecikmesinde sakınca bulunan hâllerde savcının yazılı emri şartları gözetilir.","pool":"mixed"},{"id":"cmk5271-mixed-extra-440","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · El koyma · m.127","question":"Soruşturma sırasında hâkim kararı olmaksızın el koyma yapılmıştır. İşlemi yapan makam, el koymanın hâkim onayına sunulmasına ilişkin süreleri dikkate almamıştır. CMK m.127'deki temel kural aşağıdakilerden hangisidir?","options":{"A":"Hâkim onayı hiçbir durumda aranmaz.","B":"Hâkim kararı olmaksızın yapılan el koyma kanunda belirtilen süre içinde hâkim onayına sunulmalı; süresinde karar verilmezse el koyma kendiliğinden kalkmalıdır.","C":"El koyma, soruşturma sonuna kadar her durumda geçerliliğini korur.","D":"El koyma yalnız sanığın kabul etmesiyle hukuka uygun hâle gelir."},"answer":"B","explanation":"CMK m.127, hâkim kararı olmaksızın yapılan el koymanın hâkim onayına sunulması ve süresinde karar verilmemesinin sonucunu düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-extra-441","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Bilgisayarlarda arama ve kopyalama · m.134","question":"Bir soruşturmada, başka yollarla delil elde etmenin mümkün olmadığı ileri sürülerek şüphelinin bilgisayarındaki verilerin incelenmesi ve kopyalanması istenmektedir. CMK m.134 yönünden hangisi doğrudur?","options":{"A":"Kolluk, her suçta ve hiçbir karar almadan tüm dijital verilere sınırsız erişebilir.","B":"Bilgisayar verileri hiçbir koşulda ceza soruşturmasında incelenemez.","C":"Bilgisayar ve bilgisayar programları ile kütüklerinde arama, kopyalama ve elkoyma ancak m.134'teki kanuni koşul ve karar usulüne uyularak gerçekleştirilebilir.","D":"Dijital incelemede elde edilen veriler dosyaya kaydedilemez."},"answer":"C","explanation":"CMK m.134, bilgisayar ve bilgisayar programları ile kütüklerinde arama, kopyalama ve elkoymayı özel koşullara bağlar. İşlem için kanundaki gereklilik ve karar usulleri izlenmelidir.","pool":"mixed"},{"id":"cmk5271-mixed-extra-442","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İfade veya sorgu için çağrı · m.145","question":"İfadesi alınmak istenen şüpheliye gönderilen davetiyede yalnız tarih ve saat yazılmış; hangi nedenle çağrıldığı ve gelmemesi hâlinde doğabilecek sonuç belirtilmemiştir. CMK m.145 bakımından hangisi doğrudur?","options":{"A":"Davetiyede yalnız kişinin adı bulunması yeterlidir.","B":"Çağrı yalnız telefonla yapılabilir; davetiye düzenlenemez.","C":"Şüpheli çağrıya uymasa da zorla getirme hiçbir durumda mümkün değildir.","D":"Davetiyede çağrılma nedeni açıkça belirtilmeli ve gelinmemesinin kanuni sonucu gösterilmelidir."},"answer":"D","explanation":"CMK m.145'e göre ifadesi alınacak veya sorgusu yapılacak kişi davetiye ile çağrılır; çağrılma nedeni açıkça belirtilir ve gelmezse zorla getirileceği yazılır.","pool":"mixed"},{"id":"cmk5271-mixed-extra-443","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Zorla getirme · m.146","question":"Şüpheli, usulüne uygun davet edildiği hâlde haklı bir neden bildirmeden gelmemiştir. Dosyada zorla getirme kararı verilmesi için gerekli koşulların bulunduğu değerlendirilmiştir. Hangisi doğrudur?","options":{"A":"Kanuni koşullar varsa şüpheli veya sanığın zorla getirilmesine karar verilebilir; zorla getirme, kendiliğinden tutuklama anlamına gelmez.","B":"Davetiyeye uymamak şüphelinin otomatik olarak mahkûm edilmesini sağlar.","C":"Zorla getirme yalnız tanıklar hakkında uygulanabilir.","D":"Zorla getirme kararı yalnız mağdur tarafından verilebilir."},"answer":"A","explanation":"CMK m.146, kanunda belirtilen koşullarda şüpheli veya sanığın zorla getirilmesini düzenler. Zorla getirme, tek başına tutuklama veya mahkûmiyet değildir.","pool":"mixed"},{"id":"cmk5271-mixed-extra-444","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İfade alma ve sorgu · m.147","question":"Şüphelinin ifadesi alınırken kendisine isnat edilen suç açıklanmış; ancak müdafi yardımından yararlanma ve susma hakkı hatırlatılmamıştır. Bu işlem hakkında hangisi doğrudur?","options":{"A":"Şüphelinin hakları yalnız iddianame kabul edildikten sonra bildirilir.","B":"Müdafi ve susma hakkı, CMK m.147 kapsamında ifade alma ve sorguda gözetilmesi gereken temel usul güvencelerindendir.","C":"Şüpheli yalnız kimlik sorularına cevap vermek zorundadır ve diğer hakları yoktur.","D":"Hakların bildirilmesi tamamen kolluğun isteğine bağlıdır."},"answer":"B","explanation":"CMK m.147; kimlik tespiti, isnadın açıklanması, müdafi yardımından yararlanma, susma hakkı ve lehine delil toplanmasını isteme gibi güvenceleri düzenler.","pool":"mixed"},{"id":"cmk5271-mixed-extra-445","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Müdafiin dosyayı incelemesi · m.153","question":"Müdafi, soruşturma dosyasındaki belgeleri incelemek ve örnek almak istemiştir. Cumhuriyet savcısı, dosyanın her belgesinin hiçbir istisna olmaksızın müdafiden saklanabileceğini ileri sürmüştür. CMK m.153 bakımından doğru yaklaşım hangisidir?","options":{"A":"Müdafiin dosyayı inceleme hakkı yalnız hüküm kesinleştikten sonra başlar.","B":"Dosyanın tamamı, suçun niteliğine bakılmaksızın her zaman sınırsız biçimde gizlidir.","C":"Müdafiin dosyayı inceleme ve belge örneği alma hakkı vardır; kısıtlama ancak kanunda öngörülen koşul ve usulle uygulanabilir.","D":"Dosyayı yalnız sanığın yakınları inceleyebilir; müdafiin hakkı yoktur."},"answer":"C","explanation":"CMK m.153, müdafiin dosyayı inceleme ve belge örneği alma hakkını düzenler. Soruşturmanın amacını tehlikeye düşürebilecek hâllerde kısıtlama ancak kanuni koşullar ve usul çerçevesinde mümkündür.","pool":"mixed"},{"id":"cmk5271-mixed-extra-446","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Cumhuriyet savcısının görevleri · m.160","question":"Cumhuriyet savcısı, işlendiği izlenimini veren bir durumla ilgili ihbar almıştır. Dosyada yalnız şüpheli aleyhine olduğu düşünülen kayıtlar değil, şüphelinin lehine olabilecek bilgi ve belgeler de bulunmaktadır. CMK m.160'a göre savcının yaklaşımı nasıl olmalıdır?","options":{"A":"Savcı yalnız mahkûmiyete yarayabilecek delilleri toplar; lehine delillerle ilgilenmez.","B":"Savcı soruşturmayı ancak mağdurun ayrıca dava açması hâlinde başlatabilir.","C":"Savcı, şüpheli aleyhine delilleri topladıktan sonra soruşturmayı yürütme görevini tamamen kolluğa devreder.","D":"Savcı maddi gerçeğin araştırılması amacıyla şüphelinin lehine ve aleyhine olan delilleri toplamak ve haklarını korumakla yükümlüdür."},"answer":"D","explanation":"CMK m.160 uyarınca Cumhuriyet savcısı, suç işlendiği izlenimini veren bir hâli öğrenince maddi gerçeği araştırır; şüphelinin lehine ve aleyhine delilleri toplar ve haklarını korur.","pool":"mixed"},{"id":"cmk5271-mixed-extra-447","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İddianame · m.170","question":"Soruşturma sonunda toplanan deliller, suçun işlendiği konusunda yeterli şüphe oluşturmuştur. Cumhuriyet savcısının iddianame düzenlemesi bakımından CMK m.170'te esas alınan ölçüt hangisidir?","options":{"A":"Toplanan delillerin suçun işlendiği hususunda yeterli şüphe oluşturması hâlinde savcı iddianame düzenler; iddianamede kanunun aradığı açıklamalar ve deliller gösterilir.","B":"Savcı, yalnız şüphelinin suçu itiraf etmesi hâlinde iddianame düzenleyebilir.","C":"İddianame düzenlenmesi için mahkûmiyet hükmünün önceden verilmiş olması gerekir.","D":"Savcı, dosyadaki delilleri belirtmeden yalnız suçun adını yazıp iddianame düzenler."},"answer":"A","explanation":"CMK m.170, yeterli şüphe ölçütünü ve iddianamenin içermesi gereken unsurları düzenler. İddianame mahkûmiyet hükmü değildir; kamu davasının açılması sürecinin bir parçasıdır.","pool":"mixed"},{"id":"cmk5271-mixed-extra-448","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · İddianamenin iadesi · m.174","question":"Mahkeme, kendisine sunulan iddianameyi incelerken CMK m.174'te sayılan iade nedenlerinden birinin mevcut olduğunu belirlemiştir. Bu aşamada mahkemenin yapabileceği işlem hangisidir?","options":{"A":"İddianameyi incelemeden doğrudan sanığı mahkûm etmek.","B":"Kanunda sayılan bir iade nedeni varsa, m.174'te düzenlenen usul çerçevesinde iddianameyi Cumhuriyet başsavcılığına iade etmek.","C":"İddianameyi iade etmek yerine her durumda kovuşturmayı bitirmek.","D":"İddianameyi yalnız mağdurun onayı varsa iade edebilmek."},"answer":"B","explanation":"CMK m.174, iddianamenin iadesi nedenlerini ve usulünü düzenler. İade kararı, tek başına beraat veya davanın kesin olarak düşmesi anlamına gelmez.","pool":"mixed"},{"id":"cmk5271-mixed-extra-449","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Duruşmada son söz · m.216","question":"Duruşmada deliller tartışılmış, Cumhuriyet savcısı esas hakkındaki görüşünü bildirmiş ve taraflara diyecekleri sorulmuştur. Hükümden önce sanığa son söz verilmesi hakkında hangisi doğrudur?","options":{"A":"Sanığın son söz hakkı yalnız soruşturma evresinde kullanılır.","B":"Son söz yalnız katılana verilir; sanığa söz verilmez.","C":"Delillerin tartışılmasının ardından hükümden önce hazır bulunan sanığa son söz verilir; bu usul güvencesi CMK m.216 kapsamında değerlendirilir.","D":"Mahkeme, savcının görüşünden sonra doğrudan hüküm kurmak zorundadır."},"answer":"C","explanation":"CMK m.216, delillerin tartışılmasını ve hükümden önce hazır bulunan sanığa son söz verilmesini düzenler. Bu, savunma hakkıyla bağlantılı önemli bir usul güvencesidir.","pool":"mixed"},{"id":"cmk5271-mixed-extra-450","topic":"5271 Sayılı Ceza Muhakemesi Kanunu · Delillerin değerlendirilmesi · m.217","question":"Mahkeme, hükmünü kurarken dosyada yer alan ancak duruşmada ortaya konulup tartışılmamış bir belgeye belirleyici ağırlık vermek istemektedir. CMK m.217 bakımından aşağıdaki ifadelerden hangisi doğrudur?","options":{"A":"Mahkeme, tarafların haberi olmasa da dosyadaki her belgeye dayanarak hüküm kurabilir.","B":"Hâkim yalnız kolluk tutanağına dayanmak zorundadır; diğer delilleri değerlendiremez.","C":"Delillerin hukuka uygun elde edilmesi önem taşımaz; sonuca yararlı olan her bilgi kullanılabilir.","D":"Hüküm, ancak duruşmaya getirilmiş ve huzurda tartışılmış delillere dayandırılabilir; deliller hâkimin vicdani kanaatiyle ve hukuka uygunluk koşulları gözetilerek değerlendirilir."},"answer":"D","explanation":"CMK m.217 uyarınca hâkim kararını duruşmaya getirilmiş ve huzurda tartışılmış delillere dayandırır; delilleri vicdani kanaatiyle serbestçe değerlendirirken hukuka uygunluk koşullarını da gözetir.","pool":"mixed"},]);
const letters=["A","B","C","D"];let index=0,answers={},revealed={},finished=false;const $=id=>document.getElementById(id);
function render(){const q=questions[index];$("meta").textContent="Soru "+(index+1)+" / "+questions.length;$("progress").style.width=((index+1)/questions.length*100)+"%";$("topic").textContent=q.topic;$("question").textContent=q.question;$("options").innerHTML="";letters.forEach(k=>{const label=document.createElement("label");label.className="option";if(answers[index]){if(k===q.answer)label.classList.add("correct");else if(answers[index]===k)label.classList.add("wrong");}else if(revealed[index]&&k===q.answer){label.classList.add("correct");}const input=document.createElement("input");input.type="radio";input.name="answer";input.value=k;input.checked=answers[index]===k;input.disabled=finished;input.addEventListener("change",()=>{answers[index]=k;render();});const letter=document.createElement("span");letter.className="letter";letter.textContent=k;const txt=document.createElement("span");txt.textContent=q.options[k];label.append(input,letter,txt);$("options").append(label);});$("feedback").className="feedback"+(revealed[index]?" show":"");$("feedback").innerHTML=revealed[index]?"<strong>Doğru cevap: "+q.answer+" — "+q.options[q.answer]+"</strong><p>"+q.explanation+"</p>":"";$("show").textContent=revealed[index]?"Cevap açıklaması açık":"Cevabı göster +";$("prev").disabled=index===0;$("next").disabled=index===questions.length-1||finished;$("show").disabled=finished;$("grid").innerHTML="";questions.forEach((_,i)=>{const b=document.createElement("button");b.className="num"+(i===index?" active":"")+(answers[i]?" done":"");b.textContent=i+1;b.setAttribute("aria-label","Soru "+(i+1));b.onclick=()=>{index=i;render();};$("grid").append(b);});}
$("prev").onclick=()=>{if(index>0){index--;render();}};$("next").onclick=()=>{if(index<questions.length-1){index++;render();}};$("show").onclick=()=>{revealed[index]=true;const q=questions[index];$("feedback").className="feedback show";$("feedback").innerHTML="<strong>Doğru cevap: "+q.answer+" — "+q.options[q.answer]+"</strong><p>"+(q.explanation||"Bu soru için açıklama alanı boş; doğru seçenek yukarıda gösterilmiştir.")+"</p>";$("show").textContent="Cevap açıklaması açık";$("options").style.display="grid";$("options").style.visibility="visible";$("options").style.opacity="1";$("options").style.height="auto";$("options").style.overflow="visible";letters.forEach(k=>{const label=[...$("options").querySelectorAll("label.option")].find(el=>el.querySelector("input")?.value===k);if(label){label.classList.remove("correct","wrong");if(k===q.answer)label.classList.add("correct");else if(answers[index]===k)label.classList.add("wrong");}});};$("finish").onclick=()=>{finished=true;const answered=Object.keys(answers).length;const correct=questions.filter((q,i)=>answers[i]===q.answer).length;const unanswered=questions.length-answered;$("result").className="result show";$("result").innerHTML='<div class="eyebrow">Test sonucu</div><div class="score">'+correct+' / '+questions.length+'</div><p><b>Doğru:</b> '+correct+' · <b>Yanlış:</b> '+(answered-correct)+' · <b>Boş:</b> '+unanswered+'</p><button class="btn restart" id="restart">Yeni karışık test</button>';$("restart").onclick=()=>{index=0;answers={};revealed={};finished=false;$("result").className="result";render();};render();$("result").scrollIntoView({behavior:"smooth",block:"nearest"});};render();
