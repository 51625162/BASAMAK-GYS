<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PDF Konu Notları — Basamak GYS</title><style>
:root{--ink:#10243E;--teal:#0E9E97;--coral:#FF6B5D;--cloud:#F3F7F9;--white:#FFF;--mist:#E1EAEE;--slate:#5B7186;--radius:18px}*{box-sizing:border-box}body{margin:0;background:var(--cloud);color:var(--ink);font-family:Inter,Arial,sans-serif}.topbar{padding:18px 6vw;background:#fff;border-bottom:1px solid var(--mist);position:sticky;top:0;z-index:10}.crumb{display:flex;gap:10px;align-items:center;font-size:.88rem;color:var(--slate);font-weight:600}.crumb a{color:inherit;text-decoration:none}.hero{max-width:1180px;margin:auto;padding:40px 6vw 8px}.hero h1{margin:0 0 5px}.hero p{margin:0;color:var(--slate)}.content{max-width:1180px;margin:auto;padding:36px 6vw 90px}.group{background:#fff;border:1px solid var(--mist);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}.group-head{width:100%;display:flex;align-items:center;justify-content:space-between;background:#fff;padding:16px 18px;cursor:pointer;text-align:left}.title{font-weight:800}.count{font-size:.75rem;color:var(--slate);margin-left:8px}.arrow{transition:transform .18s}.group.open .arrow{transform:rotate(180deg)}.group-body{display:none;padding:0 14px 14px}.group.open .group-body{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;max-height:420px;overflow-y:auto;padding-bottom:14px;}.card{background:var(--cloud);border:1px solid var(--mist);border-radius:14px;padding:16px}.tag{display:inline-block;font-size:.67rem;font-weight:700;padding:4px 9px;border-radius:100px;background:#e8f6f5;color:#0b7f79}.card h3{font-size:.92rem;margin:10px 0 14px}.actions{display:flex;gap:8px}.btn{flex:1;padding:9px 10px;border-radius:100px;text-align:center;font-weight:700;font-size:.78rem;cursor:pointer}.view{background:#fff;color:#0b7f79;border:1.5px solid #0b7f79}.download{background:#f5a623;color:#fff;text-decoration:none}.delete{background:#fff;color:#C0392B;border:1.5px solid #EF4444}.empty{text-align:center;background:#fff;border:1.5px dashed var(--mist);border-radius:var(--radius);padding:48px 24px;color:var(--slate)}
.lightbox{position:fixed;inset:0;background:rgba(16,36,62,.94);z-index:1000;display:none;flex-direction:column}.lightbox.open{display:flex}.toolbar{display:flex;justify-content:center;gap:8px;padding:14px}.lb{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:100px;padding:10px 14px;font-weight:700}.close{background:var(--coral)}.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}.stage iframe{width:92vw;height:88vh;border:0;border-radius:12px;background:#fff}
</style></head><body><div class="topbar"><div class="crumb"><a href="index.html">Basamak GYS</a><span>/</span><a href="saymanlik.html" id="crumbModul">Saymanlık</a><span>/</span><span>PDF Konu Notları</span></div></div><section class="hero"><h1 id="pageH1">PDF Konu Notları</h1><p>Aynı bölümdeki PDF'ler tek başlık altında toplanır. İstediğin PDF'yi ayrı ayrı silebilirsin.</p></section><div class="content"><div id="groups"></div><div id="empty" class="empty" style="display:none">📥<h3>Henüz PDF konu notu eklemedin</h3><p>İçerik Ekle bölümünden PDF ekleyebilirsin.</p></div></div><div class="lightbox" id="lightbox"><div class="toolbar"><button class="lb close" onclick="closeLb()">✕ Kapat</button></div><div class="stage" id="stage"></div></div>
<script src="db.js?v=1786350782"></script><script>bgysRequireAuth();</script><script>
const map={};function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;')}
async function render(){try{const all=await bgysGetAllByModul('konular'),items=all.filter(x=>x.tip==='pdf'),root=document.getElementById('groups'),empty=document.getElementById('empty');if(!items.length){root.innerHTML='';root.style.display='none';empty.style.display='block';return}empty.style.display='none';root.style.display='block';items.forEach(x=>map[x.id]=x);const groups={};items.forEach(x=>{const k=(x.bolum||'Diğer').trim()||'Diğer';(groups[k]??=[]).push(x)});root.innerHTML=Object.entries(groups).map(([b,arr],i)=>`<section class="group open" id="g${i}"><button class="group-head" onclick="document.getElementById('g${i}').classList.toggle('open')"><span><span class="title">${esc(b)}</span><span class="count">${arr.length} PDF</span></span><span class="arrow">▼</span></button><div class="group-body">${arr.slice().reverse().map(it=>`<article class="card"><span class="tag">📄 PDF</span><h3>${esc(it.baslik||'PDF konu notu')}</h3><div class="actions"><button class="btn view" onclick="openLb('${it.id}')">👁️ Görüntüle</button><a class="btn download" href="${it.dataUrl}" download="${esc(it.fileName||it.baslik||'konu.pdf')}">⬇️ İndir</a><button class="btn delete" onclick="deleteItem('${it.id}')">🗑️ Sil</button></div></article>`).join('')}</div></section>`).join('')}catch(e){console.error(e)}}
function openLb(id){const it=map[id];if(!it)return;document.getElementById('stage').innerHTML=`<iframe src="${it.dataUrl}"></iframe>`;document.getElementById('lightbox').classList.add('open');document.body.style.overflow='hidden'}function closeLb(){document.getElementById('lightbox').classList.remove('open');document.getElementById('stage').innerHTML='';document.body.style.overflow=''}
async function deleteItem(id){if(!confirm('Bu PDF konu notunu çöp kutusuna taşımak istediğine emin misin?'))return;try{await bgysDelete('konular',id);delete map[id];closeLb();await render()}catch(e){alert('Silme hatası: '+e.message)}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLb()});document.getElementById('lightbox').addEventListener('click',e=>{if(e.target.id==='lightbox'||e.target.id==='stage')closeLb()});
const mi=bgysModulInfo();document.getElementById('crumbModul').textContent=mi.ad;document.getElementById('crumbModul').href=mi.sayfa;document.getElementById('pageH1').textContent=mi.ad+' PDF Konu Notları';document.title='PDF Konu Notları — '+mi.ad+' — Basamak GYS';render();bgysAutoRefresh(render);
</script></body></html>
