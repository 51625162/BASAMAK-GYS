<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Çalışma Performansım — Basamak GYS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10243E; --teal:#0E9E97; --teal-dark:#0B7F79; --amber:#F5A623;
    --coral:#FF6B5D; --violet:#8B6BF2; --green:#22C55E; --red:#EF4444;
    --cloud:#F3F7F9; --white:#FFFFFF; --mist:#E1EAEE; --slate:#5B7186;
    --radius-lg:22px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cloud);color:var(--ink);font-family:'Inter',system-ui,sans-serif;}
  h1,h2,h3{font-family:'Sora',sans-serif;letter-spacing:-0.01em;}
  a{color:inherit;text-decoration:none;}

  .topbar{padding:16px 6vw;background:var(--white);border-bottom:1px solid var(--mist);position:sticky;top:0;z-index:10;}
  .crumb{display:flex;align-items:center;gap:10px;font-size:0.86rem;color:var(--slate);font-weight:600;}
  .crumb .cur{color:var(--ink);}
  .crumb .sep{opacity:0.5;}

  .page-hero{max-width:900px;margin:0 auto;padding:30px 6vw 8px;display:flex;align-items:center;gap:16px;}
  .page-hero .icon{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,var(--teal),var(--teal-dark));display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:white;flex-shrink:0;}
  .page-hero h1{font-size:clamp(1.3rem,3vw,1.7rem);margin:0 0 4px;}
  .page-hero p{margin:0;color:var(--slate);font-size:0.88rem;}

  .wrap{max-width:900px;margin:0 auto;padding:20px 6vw 90px;}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:24px;}
  .stat-card{background:var(--white);border:1px solid var(--mist);border-radius:18px;padding:20px;text-align:center;}
  .stat-num{font-family:'Sora';font-size:1.8rem;font-weight:800;}
  .stat-label{font-size:0.78rem;color:var(--slate);font-weight:600;margin-top:4px;}

  .card{background:var(--white);border:1px solid var(--mist);border-radius:var(--radius-lg);padding:22px;margin-bottom:20px;}
  .card h3{margin:0 0 16px;font-size:1rem;}

  .bar-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .bar-label{width:110px;font-size:0.82rem;font-weight:700;flex-shrink:0;}
  .bar-track{flex-grow:1;height:22px;background:var(--cloud);border-radius:100px;overflow:hidden;position:relative;}
  .bar-fill{height:100%;border-radius:100px;transition:width 0.4s ease;}
  .bar-fill.correct{background:linear-gradient(90deg,var(--green),#16803C);}
  .bar-fill.wrong{background:linear-gradient(90deg,var(--red),#C0392B);}
  .bar-val{font-family:'IBM Plex Mono';font-size:0.78rem;color:var(--slate);width:50px;text-align:right;flex-shrink:0;}

  .donut-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap;justify-content:center;}
  .legend{display:flex;flex-direction:column;gap:10px;}
  .legend-item{display:flex;align-items:center;gap:8px;font-size:0.85rem;font-weight:600;}
  .legend-dot{width:12px;height:12px;border-radius:4px;flex-shrink:0;}

  .konu-perf-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--mist);}
  .konu-perf-row:last-child{border-bottom:none;}
  .konu-perf-name{font-weight:700;font-size:0.88rem;}
  .konu-perf-detail{font-size:0.78rem;color:var(--slate);}
  .empty-note{color:var(--slate);font-size:0.88rem;text-align:center;padding:30px 0;}
</style>
</head>
<body>

<div class="topbar">
  <div class="crumb">
    <a href="index.html">Basamak GYS</a><span class="sep">/</span>
    <a href="saymanlik.html" id="crumbModul">Saymanlık</a><span class="sep">/</span>
    <span class="cur">Çalışma Performansım</span>
  </div>
</div>

<section class="page-hero">
  <div class="icon">📊</div>
  <div>
    <h1>Çalışma Performansım</h1>
    <p>Çözdüğün, çözmediğin, yanlış yaptığın sorular ve deneme sonuçların.</p>
  </div>
</section>

<div class="wrap">
  <div class="stat-grid" id="statGrid"></div>

  <div class="card">
    <h3>Doğru / Yanlış Dağılımı</h3>
    <div id="donutArea" class="donut-wrap"></div>
  </div>

  <div class="card">
    <h3>Deneme Sınavı Performansı</h3>
    <div id="denemePerfArea"></div>
  </div>

  <div class="card">
    <h3>Konulara Göre Performans</h3>
    <div id="konuPerfArea"></div>
  </div>
</div>

<script src="db.js?v=1786350782"></script>
<script>bgysRequireAuth();</script>
<script>
  function esc(v) { return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

  async function render() {
    const sorular = await bgysGetAllByModul('sorular');
    const solvedMap = bgysGetSolvedMap();
    const denemeSolvedMap = bgysGetDenemeSolvedMap();
    const denemeler = await bgysGetAllByModul('denemeler');

    const genelSorular = sorular.filter(s => s.denemeId === undefined || s.denemeId === null);
    const cozulenler = genelSorular.filter(s => solvedMap[s.id]);
    const dogruSayisi = cozulenler.filter(s => solvedMap[s.id].correct).length;
    const yanlisSayisi = cozulenler.length - dogruSayisi;
    const cozulmeyenSayisi = genelSorular.length - cozulenler.length;
    const basariYuzdesi = cozulenler.length > 0 ? Math.round((dogruSayisi / cozulenler.length) * 100) : 0;

    // Ust istatistik kartlari
    document.getElementById('statGrid').innerHTML = `
      <div class="stat-card"><div class="stat-num" style="color:var(--teal-dark);">${genelSorular.length}</div><div class="stat-label">Toplam Soru</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--green);">${dogruSayisi}</div><div class="stat-label">Doğru Çözülen</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--red);">${yanlisSayisi}</div><div class="stat-label">Yanlış Çözülen</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--slate);">${cozulmeyenSayisi}</div><div class="stat-label">Hiç Çözülmemiş</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--violet);">%${basariYuzdesi}</div><div class="stat-label">Başarı Oranı</div></div>
    `;

    // Donut / bar (basit CSS bar olarak - kutuphanesiz)
    const donutArea = document.getElementById('donutArea');
    if (cozulenler.length === 0) {
      donutArea.innerHTML = '<div class="empty-note">Henüz soru çözmedin — bir soru çözünce burada görünecek.</div>';
    } else {
      const dogruPct = Math.round((dogruSayisi / cozulenler.length) * 100);
      donutArea.innerHTML = `
        <div style="flex-grow:1;min-width:220px;">
          <div class="bar-row">
            <span class="bar-label">✅ Doğru</span>
            <div class="bar-track"><div class="bar-fill correct" style="width:${dogruPct}%;"></div></div>
            <span class="bar-val">${dogruSayisi}</span>
          </div>
          <div class="bar-row">
            <span class="bar-label">❌ Yanlış</span>
            <div class="bar-track"><div class="bar-fill wrong" style="width:${100-dogruPct}%;"></div></div>
            <span class="bar-val">${yanlisSayisi}</span>
          </div>
        </div>
      `;
    }

    // Deneme performansi
    const denemePerfArea = document.getElementById('denemePerfArea');
    const cozulenDenemeler = denemeler.filter(d => denemeSolvedMap[d.id]);
    if (cozulenDenemeler.length === 0) {
      denemePerfArea.innerHTML = '<div class="empty-note">Henüz bir deneme sınavı tamamlamadın.</div>';
    } else {
      denemePerfArea.innerHTML = cozulenDenemeler.map(d => {
        const rec = denemeSolvedMap[d.id];
        const pct = rec.lastTotal > 0 ? Math.round((rec.lastScore / rec.lastTotal) * 100) : 0;
        return `
          <div class="bar-row">
            <span class="bar-label" title="${esc(d.baslik)}">${esc(d.baslik).slice(0,14)}${d.baslik.length>14?'…':''}</span>
            <div class="bar-track"><div class="bar-fill ${pct>=50?'correct':'wrong'}" style="width:${pct}%;"></div></div>
            <span class="bar-val">${rec.lastScore}/${rec.lastTotal}</span>
          </div>
        `;
      }).join('');
    }

    // Konulara gore kirilim
    const konuPerfArea = document.getElementById('konuPerfArea');
    const konuGruplari = {};
    genelSorular.forEach(s => {
      const k = (s.bolum || 'Diğer').trim() || 'Diğer';
      (konuGruplari[k] ??= { toplam: 0, dogru: 0, yanlis: 0 });
      konuGruplari[k].toplam++;
      if (solvedMap[s.id]) {
        if (solvedMap[s.id].correct) konuGruplari[k].dogru++;
        else konuGruplari[k].yanlis++;
      }
    });
    const konuAnahtarlari = Object.keys(konuGruplari);
    if (konuAnahtarlari.length === 0) {
      konuPerfArea.innerHTML = '<div class="empty-note">Henüz soru eklemedin.</div>';
    } else {
      konuPerfArea.innerHTML = konuAnahtarlari.map(k => {
        const g = konuGruplari[k];
        const cozulen = g.dogru + g.yanlis;
        return `
          <div class="konu-perf-row">
            <div>
              <div class="konu-perf-name">${esc(k)}</div>
              <div class="konu-perf-detail">${cozulen}/${g.toplam} soru çözüldü · ✅ ${g.dogru} · ❌ ${g.yanlis}</div>
            </div>
          </div>
        `;
      }).join('');
    }
  }

  const modulInfo = bgysModulInfo();
  document.getElementById('crumbModul').textContent = modulInfo.ad;
  document.getElementById('crumbModul').setAttribute('href', modulInfo.sayfa);
  document.title = `Çalışma Performansım — ${modulInfo.ad} — Basamak GYS`;

  render();
  bgysAutoRefresh(render);
</script>

</body>
</html>
