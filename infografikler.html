<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İnfografikler — Basamak GYS</title>
<style>
:root{--ink:#10243E;--teal:#0E9E97;--teal-dark:#0B7F79;--coral:#FF6B5D;--violet:#8B6BF2;--cloud:#F3F7F9;--white:#FFF;--mist:#E1EAEE;--slate:#5B7186;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--cloud);color:var(--ink);font-family:Inter,Arial,sans-serif}.topbar{padding:18px 6vw;background:#fff;border-bottom:1px solid var(--mist);position:sticky;top:0;z-index:10}.crumb{display:flex;gap:10px;align-items:center;font-size:.88rem;color:var(--slate);font-weight:600}.crumb a{text-decoration:none;color:inherit}.content{max-width:1180px;margin:auto;padding:36px 6vw 90px}.hero{max-width:1180px;margin:auto;padding:40px 6vw 8px}.hero h1{margin:0 0 5px}.hero p{margin:0;color:var(--slate)}
.group{background:#fff;border:1px solid var(--mist);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}.group-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;padding:16px 18px;text-align:left;cursor:pointer}.group-title{font-weight:800;font-size:1rem}.group-count{font-size:.75rem;color:var(--slate);margin-left:8px}.group-arrow{font-size:1rem;transition:transform .18s}.group.open .group-arrow{transform:rotate(180deg)}.group-body{display:none;padding:0 14px 14px}.group.open .group-body{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.g-card{background:var(--cloud);border:1px solid var(--mist);border-radius:14px;overflow:hidden}.g-thumb{aspect-ratio:1500/1000;background:#e9f0f3;overflow:hidden;cursor:zoom-in}.g-thumb img{width:100%;height:100%;object-fit:cover;display:block}.g-info{padding:12px 14px}.g-tag{display:inline-block;font-size:.67rem;font-weight:700;padding:4px 9px;border-radius:100px;background:rgba(14,158,151,.12);color:var(--teal-dark)}.g-info h3{margin:8px 0;font-size:.92rem}.g-actions{display:flex;gap:8px;align-items:center}.g-btn{padding:8px 12px;border-radius:100px;font-weight:700;font-size:.78rem;color:var(--violet);background:#fff;border:1.5px solid var(--violet)}.g-delete{padding:8px 12px;border-radius:100px;font-weight:700;font-size:.78rem;color:#C0392B;background:#fff;border:1.5px solid #EF4444}.empty{text-align:center;background:#fff;border:1.5px dashed var(--mist);border-radius:var(--radius);padding:48px 24px;color:var(--slate)}
.lightbox{position:fixed;inset:0;background:rgba(16,36,62,.94);z-index:1000;display:none;flex-direction:column}.lightbox.open{display:flex}.toolbar{display:flex;justify-content:center;gap:8px;padding:14px}.lb{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:100px;padding:10px 14px;font-weight:700}.lb.close{background:var(--coral)}.stage{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:20px}.stage img{max-width:none;user-select:none}
</style></head><body>
<div class="topbar"><div class="crumb"><a href="index.html">Basamak GYS</a><span>/</span><a href="saymanlik.html" id="crumbModul">Saymanlık</a><span>/</span><span>İnfografikler</span></div></div>
<section class="hero"><h1 id="pageH1">İnfografikler</h1><p>Aynı bölümdeki tüm görseller tek başlık altında toplanır. İstediğin içeriği ayrı ayrı silebilirsin.</p></section>
<div class="content"><div id="groups"></div><div id="empty" class="empty" style="display:none">📥<h3>Henüz görsel konu notu eklenmedi</h3><p>İçerik Ekle bölümünden görsel ekleyebilirsin.</p></div></div>
<div class="lightbox" id="lightbox"><div class="toolbar"><button class="lb" onclick="zoom(-.25)">➖</button><span class="lb" id="zoomLabel">100%</span><button class="lb" onclick="zoom(.25)">➕</button><button class="lb" onclick="resetZoom()">↺</button><button class="lb close" onclick="closeLightbox()">✕ Kapat</button></div><div class="stage" id="stage"></div></div>
<script src="db.js?v=1786350782"></script><script>bgysRequireAuth();</script><script>
const dataMap={};let scale=1;
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;')}
async function render(){try{const all=await bgysGetAllByModul('konular');const items=all.filter(x=>x.tip==='image');const root=document.getElementById('groups'),empty=document.getElementById('empty');if(!items.length){root.innerHTML='';root.style.display='none';empty.style.display='block';return}empty.style.display='none';root.style.display='block';items.forEach(x=>dataMap[x.id]=x);const groups={};items.forEach(x=>{const key=(x.bolum||'Diğer').trim()||'Diğer';(groups[key]??=[]).push(x)});root.innerHTML=Object.entries(groups).map(([bolum,arr],gi)=>`<section class="group" id="g-${gi}"><button class="group-head" onclick="toggleGroup('g-${gi}')"><span><span class="group-title">${esc(bolum)}</span><span class="group-count">${arr.length} içerik</span></span><span class="group-arrow">▼</span></button><div class="group-body">${arr.slice().reverse().map(it=>`<article class="g-card"><div class="g-thumb" onclick="openLightbox('${it.id}')"><img src="${it.dataUrl}" alt="${esc(it.baslik||'Görsel')}"></div><div class="g-info"><span class="g-tag">${it.kaynak==='yapistir'?'📋 Yapıştır':'🖼️ Görsel'}</span><h3>${esc(it.baslik||'Görsel konu notu')}</h3><div class="g-actions"><button class="g-btn" onclick="openLightbox('${it.id}')">👁️ Görüntüle</button><button class="g-delete" onclick="deleteItem('${it.id}')">🗑️ Sil</button></div></div></article>`).join('')}</div></section>`).join('');}catch(e){console.error(e)}}
function toggleGroup(id){document.getElementById(id)?.classList.toggle('open')}
function openLightbox(id){const it=dataMap[id];if(!it)return;scale=1;document.getElementById('stage').innerHTML=`<img id="lbImg" src="${it.dataUrl}">`;document.getElementById('lightbox').classList.add('open');document.body.style.overflow='hidden';updateZoom()}
function closeLightbox(){document.getElementById('lightbox').classList.remove('open');document.getElementById('stage').innerHTML='';document.body.style.overflow=''}
function zoom(d){scale=Math.min(5,Math.max(.25,scale+d));updateZoom()}function resetZoom(){scale=1;updateZoom()}function updateZoom(){const im=document.getElementById('lbImg');if(im)im.style.transform=`scale(${scale})`;document.getElementById('zoomLabel').textContent=Math.round(scale*100)+'%'}
async function deleteItem(id){if(!confirm('Bu görsel konu notunu çöp kutusuna taşımak istediğine emin misin?'))return;try{await bgysDelete('konular',id);delete dataMap[id];closeLightbox();await render()}catch(e){alert('Silme hatası: '+e.message)}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox()});document.getElementById('lightbox').addEventListener('click',e=>{if(e.target.id==='lightbox'||e.target.id==='stage')closeLightbox()});
const mi=bgysModulInfo();document.getElementById('crumbModul').textContent=mi.ad;document.getElementById('crumbModul').href=mi.sayfa;document.getElementById('pageH1').textContent=mi.ad+' İnfografikler';document.title='İnfografikler — '+mi.ad+' — Basamak GYS';render();bgysAutoRefresh(render);
</script></body></html>
