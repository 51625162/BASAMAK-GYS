<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İnfografikler — Saymanlık — Basamak GYS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#10243E;--teal:#0E9E97;--teal-dark:#0B7F79;--amber:#F5A623;--coral:#FF6B5D;--violet:#8B6BF2;--cloud:#F3F7F9;--white:#FFF;--mist:#E1EAEE;--slate:#5B7186;--radius-lg:22px;}
  *{box-sizing:border-box} body{margin:0;background:var(--cloud);color:var(--ink);font-family:Inter,system-ui,sans-serif} h1,h2,h3{font-family:Sora,system-ui,sans-serif} button{font-family:inherit;cursor:pointer;border:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 6vw;background:#fff;border-bottom:1px solid var(--mist);position:sticky;top:0;z-index:10}.crumb{display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--slate);font-weight:600;flex-wrap:wrap}.crumb a{text-decoration:none;color:inherit}.cur{color:var(--ink)}
  .page-hero{padding:40px 6vw 8px;max-width:1180px;margin:auto;display:flex;align-items:center;gap:18px}.icon{width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,var(--violet),#7C5CE0);display:flex;align-items:center;justify-content:center;font-size:1.7rem;color:#fff}.page-hero h1{font-size:clamp(1.5rem,3vw,2rem);margin:0 0 4px}.page-hero p{margin:0;color:var(--slate);font-size:.95rem}.content{max-width:1180px;margin:auto;padding:36px 6vw 90px}.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}.g-card{background:#fff;border:1px solid var(--mist);border-radius:var(--radius-lg);overflow:hidden}.g-thumb{aspect-ratio:1500/1000;background:var(--cloud);overflow:hidden;cursor:zoom-in}.g-thumb img{width:100%;height:100%;object-fit:cover;display:block}.g-info{padding:16px 18px 18px}.g-info h3{margin:8px 0;font-size:.98rem}.g-tag{display:inline-block;font-size:.68rem;font-weight:700;padding:4px 10px;border-radius:100px;background:rgba(14,158,151,.12);color:var(--teal-dark)}.g-btn{padding:10px 14px;border-radius:100px;font-weight:700;font-size:.82rem;color:var(--violet);background:#fff;border:1.5px solid var(--violet)}.empty-card{background:#fff;border:1.5px dashed var(--mist);border-radius:var(--radius-lg);padding:48px 24px;text-align:center;color:var(--slate)}
  .lightbox{position:fixed;inset:0;background:rgba(16,36,62,.94);z-index:1000;display:none;flex-direction:column}.lightbox.open{display:flex}.lightbox-toolbar{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px}.lb-btn{background:rgba(255,255,255,.12);color:#fff;border-radius:100px;padding:10px 16px;font-weight:700}.lb-btn.close{background:var(--coral)}.lightbox-stage{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:20px}.lightbox-stage img{max-width:none;user-select:none}
</style>
</head>
<body>
<div class="topbar"><div class="crumb"><a href="index.html">Basamak GYS</a><span>/</span><a href="saymanlik.html" id="crumbModul">Saymanlık</a><span>/</span><span class="cur">İnfografikler</span></div></div>
<section class="page-hero"><div class="icon">🧠</div><div><h1 id="pageH1">İnfografikler</h1><p>İçerik Ekle'de eklediğin görsel konu anlatımlarını burada görebilirsin.</p></div></section>
<div class="content"><div id="ownKonuGrid" class="gallery-grid"></div><div id="ownKonuEmpty" class="empty-card" style="display:none"><div style="font-size:2.4rem">📥</div><h3>Henüz görsel konu notu eklenmedi</h3><p>İçerik Ekle bölümünden görsel ekleyebilirsin.</p></div></div>
<div class="lightbox" id="lightbox"><div class="lightbox-toolbar"><button class="lb-btn" onclick="lbZoom(-.25)">➖</button><span id="lbZoomLabel" style="color:#fff;min-width:55px;text-align:center">100%</span><button class="lb-btn" onclick="lbZoom(.25)">➕</button><button class="lb-btn" onclick="lbReset()">↺</button><button class="lb-btn close" onclick="closeLightbox()">✕ Kapat</button></div><div class="lightbox-stage" id="lightboxStage"></div></div>
<script src="db.js?v=1786350782"></script><script>bgysRequireAuth();</script>
<script>
const konuDataMap={};
async function renderOwnKonular(){
  try{
    const all=await bgysGetAllByModul('konular');
    // Yapıştır ile eklenen görseller de artık Konu Çalış > İnfografikler içinde gösterilir.
    const items=all.filter(it=>it.tip==='image');
    const grid=document.getElementById('ownKonuGrid'),empty=document.getElementById('ownKonuEmpty');
    if(!items.length){grid.innerHTML='';grid.style.display='none';empty.style.display='block';return}
    empty.style.display='none';grid.style.display='grid';
    items.forEach(it=>konuDataMap[it.id]=it);
    grid.innerHTML=items.slice().reverse().map(it=>`<div class="g-card"><div class="g-thumb" onclick="openLightbox('${it.id}')"><img src="${it.dataUrl}" alt="${it.baslik||'Görsel'}"></div><div class="g-info"><span class="g-tag">${it.bolum||''}${it.kaynak==='yapistir'?' · 📋 Yapıştır':''}</span><h3>${it.baslik||'Görsel konu notu'}</h3><button class="g-btn" onclick="openLightbox('${it.id}')">👁️ Görüntüle</button></div></div>`).join('');
  }catch(e){console.error('İnfografikler yüklenemedi',e);}
}
let lbScale=1;
function openLightbox(id){const it=konuDataMap[id];if(!it)return;lbScale=1;document.getElementById('lightboxStage').innerHTML=`<img id="lightboxImg" src="${it.dataUrl}" style="transform:scale(1)">`;document.getElementById('lightbox').classList.add('open');document.body.style.overflow='hidden';updateLbZoom()}
function closeLightbox(){document.getElementById('lightbox').classList.remove('open');document.getElementById('lightboxStage').innerHTML='';document.body.style.overflow=''}
function lbZoom(delta){lbScale=Math.min(5,Math.max(.25,lbScale+delta));updateLbZoom()}
function lbReset(){lbScale=1;updateLbZoom()}
function updateLbZoom(){const img=document.getElementById('lightboxImg');if(img)img.style.transform=`scale(${lbScale})`;document.getElementById('lbZoomLabel').textContent=Math.round(lbScale*100)+'%'}
const modulInfo=bgysModulInfo();document.getElementById('crumbModul').textContent=modulInfo.ad;document.getElementById('crumbModul').href=modulInfo.sayfa;document.getElementById('pageH1').textContent=modulInfo.ad+' İnfografikler';document.title='İnfografikler — '+modulInfo.ad+' — Basamak GYS';
renderOwnKonular();bgysAutoRefresh(renderOwnKonular);
</script></body></html>
