<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10243e"><title>Kişisel Notlar | Basamak GYS</title>
<style>
:root{--navy:#10243e;--teal:#087a75;--bg:#f4f7fb;--muted:#607286;--line:#dce5ed;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font:15px/1.6 Arial,sans-serif}.top{background:var(--navy);color:#fff;padding:15px max(16px,calc((100% - 900px)/2));font-weight:800}.wrap{max-width:900px;margin:auto;padding:20px 14px 45px}.back{color:var(--teal);text-decoration:none;font-weight:700;font-size:13px}.hero,.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:20px;margin-top:14px}.hero{background:linear-gradient(120deg,#10243e,#175365,#087a75);color:#fff}.hero h1{font-size:clamp(25px,5vw,34px);line-height:1.2;margin:8px 0}.hero p{color:#d7e6ed;font-size:13px;margin:0}label{display:block;font-size:12px;font-weight:700;margin:12px 0 6px}input,textarea,select{font:inherit;font-size:13px;width:100%;border:1px solid var(--line);border-radius:9px;padding:11px;background:#fbfcfe;color:var(--navy)}textarea{min-height:130px;resize:vertical}.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:800;cursor:pointer;background:var(--teal);color:#fff}.btn.soft{background:#e8f7f5;color:var(--teal)}.btn.danger{background:#fff0ef;color:var(--red)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.muted{color:var(--muted);font-size:12px}.note{background:#fff;border:1px solid var(--line);border-radius:11px;padding:13px;margin-top:10px}.note h3{margin:0;font-size:14px}.note p{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;margin:9px 0}.note small{color:var(--muted);font-size:11px}.note-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.status{font-size:12px;border-radius:8px;padding:10px;background:#f4f7fb;margin-top:12px}.status.error{background:#fff0ef;color:var(--red)}.empty{background:#f4f7fb;border-radius:9px;padding:13px;color:var(--muted);font-size:12px}@media(max-width:550px){.hero,.panel{padding:15px}}
</style></head><body><header class="top">Basamak GYS · Kişisel Notlar</header><main class="wrap"><a class="back" href="ds-sefligi.html">← Çalışma alanlarına dön</a>
<section class="hero"><div style="font-size:10px;letter-spacing:2px;color:#78ded3;font-weight:800">KİŞİSEL ÇALIŞMA ALANI</div><h1>Notlarını kaydet</h1><p>Çalışırken önemli gördüğün bilgileri, ezber kodlarını ve kendi hatırlatmalarını hesabına özel kaydet.</p></section>
<section class="panel"><h2 id="formTitle" style="margin-top:0">Yeni not ekle</h2><form id="noteForm"><input id="noteId" type="hidden"><label for="noteTitle">Not başlığı</label><input id="noteTitle" maxlength="120" required placeholder="Örn. Anayasa Madde 10 – Eşitlik"><label for="noteTopic">Konu</label><select id="noteTopic"><option value="1982 Anayasası">1982 Türkiye Cumhuriyeti Anayasası</option><option value="5275 sayılı Kanun">5275 sayılı İnfaz Kanunu</option><option value="5402 sayılı Kanun">5402 sayılı Denetimli Serbestlik Kanunu</option><option value="Genel">Genel</option></select><label for="noteBody">Not içeriği</label><textarea id="noteBody" maxlength="12000" required placeholder="Önemli bilgiyi, ezber kodunu veya kendi açıklamanı yaz…"></textarea><div class="actions"><button class="btn" id="saveBtn" type="submit">Notu kaydet</button><button class="btn soft" id="cancelEdit" type="button" hidden>Vazgeç</button></div><div id="formStatus" class="status" hidden></div></form></section>
<section class="panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><h2 style="margin:0">Kayıtlı notlarım</h2><button class="btn soft" id="refresh">Yenile</button></div><label for="filterTopic">Konuya göre filtrele</label><select id="filterTopic"><option value="">Tüm konular</option><option value="1982 Anayasası">1982 Türkiye Cumhuriyeti Anayasası</option><option value="5275 sayılı Kanun">5275 sayılı İnfaz Kanunu</option><option value="5402 sayılı Kanun">5402 sayılı Denetimli Serbestlik Kanunu</option><option value="Genel">Genel</option></select><div id="noteList" style="margin-top:12px"><div class="empty">Notlar yükleniyor…</div></div></section></main>
<script src="db.js?v=20261014-4"></script><script>
const $=id=>document.getElementById(id);let notes=[];
function status(msg,error=false){$("formStatus").hidden=false;$("formStatus").textContent=msg;$("formStatus").className="status"+(error?" error":"");}
function resetForm(){$("noteForm").reset();$("noteId").value="";$("formTitle").textContent="Yeni not ekle";$("saveBtn").textContent="Notu kaydet";$("cancelEdit").hidden=true;$("formStatus").hidden=true;}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function renderNotes(){const filter=$("filterTopic").value;const list=notes.filter(n=>!filter||n.topic===filter);if(!list.length){$("noteList").innerHTML='<div class="empty">'+(notes.length?"Bu konu için kayıtlı not yok.":"Henüz not eklememişsin. İlk notunu yukarıdan oluştur.")+'</div>';return;}$("noteList").innerHTML=list.map(n=>'<article class="note"><h3>'+escapeHtml(n.title)+'</h3><small>'+escapeHtml(n.topic||"Genel")+' · '+new Date(n.updatedAt||n.createdAt||Date.now()).toLocaleString("tr-TR")+'</small><p>'+escapeHtml(n.body)+'</p><div class="note-actions"><button class="btn soft" data-edit="'+escapeHtml(n.id)+'">Düzenle</button><button class="btn danger" data-delete="'+escapeHtml(n.id)+'">Sil</button></div></article>').join("");}
async function loadNotes(){ $("refresh").disabled=true;$("noteList").innerHTML='<div class="empty">Notlar yükleniyor…</div>';try{const user=await bgysRequireAuth();if(!user)return;notes=(await bgysGetAll("kisiselNotlar")).sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0));renderNotes();}catch(e){$("noteList").innerHTML='<div class="empty">Notlar yüklenemedi. Girişini ve internet bağlantını kontrol et. '+escapeHtml(e.message)+'</div>';}finally{$("refresh").disabled=false;}}
$("noteForm").addEventListener("submit",async e=>{e.preventDefault();$("saveBtn").disabled=true;try{const user=await bgysRequireAuth();if(!user)return;const id=$("noteId").value;const record={title:$("noteTitle").value.trim(),topic:$("noteTopic").value,body:$("noteBody").value.trim(),updatedAt:Date.now()};if(!record.title||!record.body){status("Başlık ve not içeriği gerekli.",true);return;}if(id){const found=notes.find(n=>n.id===id);if(!found)throw new Error("Düzenlenecek not bulunamadı; listeyi yenile.");await bgysUserCollection("kisiselNotlar").doc(String(id)).update(record);}else{await bgysAdd("kisiselNotlar",{...record,createdAt:Date.now()});}resetForm();await loadNotes();status(id?"Not güncellendi.":"Not kaydedildi.");}catch(err){status("Kaydedilemedi: "+err.message,true);}finally{$("saveBtn").disabled=false;}});
$("noteList").addEventListener("click",async e=>{const edit=e.target.closest("[data-edit]"),del=e.target.closest("[data-delete]");if(edit){const n=notes.find(x=>x.id===edit.dataset.edit);if(!n)return;$("noteId").value=n.id;$("noteTitle").value=n.title||"";$("noteTopic").value=n.topic||"Genel";$("noteBody").value=n.body||"";$("formTitle").textContent="Notu düzenle";$("saveBtn").textContent="Değişiklikleri kaydet";$("cancelEdit").hidden=false;window.scrollTo({top:0,behavior:"smooth"});}if(del){const n=notes.find(x=>x.id===del.dataset.delete);if(!n||!confirm('"'+n.title+'" notunu silmek istiyor musun?'))return;try{await bgysDelete("kisiselNotlar",n.id);await loadNotes();}catch(err){alert("Not silinemedi: "+err.message);}}});
$("cancelEdit").addEventListener("click",resetForm);$("refresh").addEventListener("click",loadNotes);$("filterTopic").addEventListener("change",renderNotes);loadNotes();
</script></body></html>
