name: Apply performance fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'PERF-FIX') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch image saving and infographic loading
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('db.js')
          s=p.read_text(encoding='utf-8')
          old=re.search(r'async function bgysUploadSmart\(file, klasor\) \{.*?\n\}\n\n/\* ================= Firebase yapılandırması',s,re.S)
          if not old: raise SystemExit('bgysUploadSmart bulunamadı')
          new='''async function bgysUploadSmart(file, klasor) {
            if (file && file.type && file.type.startsWith('image/')) {
              try {
                const compressed = await bgysCompressImageFast(file);
                const dataUrl = await bgysFileToDataUrl(compressed);
                if (dataUrl.length <= BGYS_INLINE_LIMIT_BYTES) return dataUrl;
                file = compressed;
              } catch (e) { console.warn('Görsel sıkıştırma atlandı:', e); }
            }
            if (file.size * 1.37 <= BGYS_INLINE_LIMIT_BYTES) {
              const dataUrl = await bgysFileToDataUrl(file);
              if (dataUrl.length <= BGYS_INLINE_LIMIT_BYTES) return dataUrl;
            }
            return await bgysUploadFile(file, klasor);
          }

          async function bgysCompressImageFast(file) {
            const bitmap = await createImageBitmap(file);
            const maxSide = 1600;
            const ratio = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
            const w = Math.max(1, Math.round(bitmap.width * ratio));
            const h = Math.max(1, Math.round(bitmap.height * ratio));
            const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
            const ctx=canvas.getContext('2d',{alpha:false}); ctx.drawImage(bitmap,0,0,w,h); bitmap.close();
            let quality=0.78;
            for(let i=0;i<5;i++){
              const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',quality));
              if(!blob) throw new Error('Sıkıştırma başarısız');
              if(blob.size*1.37 <= BGYS_INLINE_LIMIT_BYTES) return new File([blob],file.name.replace(/\\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'});
              quality=Math.max(0.35,quality-0.1);
            }
            const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',0.35));
            return new File([blob],file.name.replace(/\\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'});
          }

          /* ================= Firebase yapılandırması'''
          s=s[:old.start()]+new+s[old.end():]
          s=s.replace('const snap = await bgysUserCollection(storeName).get({ source: "server" });','''const col = bgysUserCollection(storeName);
          let snap = null;
          try { snap = await col.get({ source: "cache" }); } catch(e) {}
          if (!snap || snap.empty) snap = await col.get({ source: "server" });''')
          s=s.replace('const BGYS_DB_SURUM = "2026-08-12-shared-modul-v8";','const BGYS_DB_SURUM = "2026-08-14-performance-v1";')
          p.write_text(s,encoding='utf-8')

          p=Path('infografikler.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<script src="db.js?v=1786350782"></script>','<script src="db.js?v=20260814perf"></script>',1)
          s=s.replace('.group.open .group-body{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;max-height:620px;overflow-y:auto;padding-bottom:14px;}', '.group.open .group-body{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;max-height:620px;overflow-y:auto;padding-bottom:14px;content-visibility:auto;contain-intrinsic-size:500px;}')
          old_render=re.search(r'async function render\(\)\{.*?\n\}\nfunction toggleGroup',s,re.S)
          if not old_render: raise SystemExit('infografik render bulunamadı')
          new_render='''let renderBusy=false;
          async function render(){
            if(renderBusy)return; renderBusy=true;
            try{
              const all=await bgysGetAllByModul('konular');
              const items=all.filter(x=>x.tip==='image' && (x.dataUrl||x.imageDataUrl||x.url||x.src));
              const root=document.getElementById('groups'),empty=document.getElementById('empty');
              if(!items.length){root.innerHTML='';root.style.display='none';empty.style.display='block';return}
              empty.style.display='none';root.style.display='block';
              items.forEach(x=>{if(!x.dataUrl)x.dataUrl=x.imageDataUrl||x.url||x.src;dataMap[x.id]=x});
              const groups={};items.forEach(x=>{const key=(x.bolum||'Diğer').trim()||'Diğer';(groups[key]??=[]).push(x)});
              root.innerHTML=Object.entries(groups).map(([bolum,arr],gi)=>{const gid='g-'+safeGroupId(bolum)+'-'+gi;const sorted=sortItems(arr);return `<section class="group" id="${gid}"><button class="group-head" onclick="toggleGroup('${gid}')"><span class="group-head-main"><span><span class="group-title">${esc(bolum)}</span><span class="group-count">${sorted.length} içerik</span></span></span><span class="group-tools"><span class="reorder-toggle" onclick="event.stopPropagation();toggleReorder('${gid}')">↕️ Sırala</span><span class="group-arrow">▼</span></span></button><div class="group-body">${sorted.map((it,index)=>`<article class="g-card"><div class="g-thumb" onclick="openLightbox('${it.id}')"><img loading="lazy" decoding="async" src="${it.dataUrl}" alt="${esc(it.baslik||'Görsel')}"></div><div class="g-info"><span class="g-tag">${it.kaynak==='yapistir'?'📋 Yapıştır':'🖼️ Görsel'}</span><h3>${esc(it.baslik||'Görsel konu notu')}</h3><div class="g-actions"><button class="g-btn" onclick="openLightbox('${it.id}')">👁️ Görüntüle</button><button class="g-delete" onclick="deleteItem('${it.id}')">🗑️ Sil</button></div><div class="reorder-controls"><button class="reorder-btn" ${index===0?'disabled':''} onclick="moveItem('${esc(bolum)}','${it.id}',-1)">⬆️</button><button class="reorder-btn" ${index===sorted.length-1?'disabled':''} onclick="moveItem('${esc(bolum)}','${it.id}',1)">⬇️</button><span class="order-label">${index+1} / ${sorted.length}</span></div></div></article>`).join('')}</div></section>`}).join('');
            }catch(e){console.error(e)}finally{renderBusy=false}
          }
          function toggleGroup'''
          s=s[:old_render.start()]+new_render+s[old_render.end()-len('function toggleGroup'):]
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add db.js infografikler.html
          git commit -m 'PERF-FIX: speed up image saving and infographic loading'
          git push
