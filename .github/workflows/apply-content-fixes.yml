name: Apply content fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'AUTO-CONTENT-FIX') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only requested fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('db.js')
          s = p.read_text(encoding='utf-8')
          pattern = r"async function bgysUploadSmart\(file, klasor\) \{.*?\n\}\n\n/\* ================= Firebase yapılandırması"
          replacement = '''async function bgysUploadSmart(file, klasor) {
  if (file && file.type && file.type.startsWith('image/')) {
    try {
      const compressed = await bgysCompressImage(file);
      const dataUrl = await bgysFileToDataUrl(compressed);
      if (dataUrl.length <= BGYS_INLINE_LIMIT_BYTES) return dataUrl;
    } catch (e) {
      console.warn('Görsel sıkıştırma başarısız, orijinal dosya deneniyor:', e);
    }
  }
  if (file.size * 1.37 <= BGYS_INLINE_LIMIT_BYTES) {
    const dataUrl = await bgysFileToDataUrl(file);
    if (dataUrl.length <= BGYS_INLINE_LIMIT_BYTES) return dataUrl;
  }
  return await bgysUploadFile(file, klasor);
}

async function bgysCompressImage(file) {
  const bitmap = await createImageBitmap(file);
  const maxSide = 1800;
  const ratio = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
  const w = Math.max(1, Math.round(bitmap.width * ratio));
  const h = Math.max(1, Math.round(bitmap.height * ratio));
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d', { alpha: false });
  ctx.drawImage(bitmap, 0, 0, w, h);
  bitmap.close();
  let quality = 0.82;
  for (let i = 0; i < 5; i++) {
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
    if (!blob) throw new Error('Görsel sıkıştırılamadı');
    if (blob.size * 1.37 <= BGYS_INLINE_LIMIT_BYTES) {
      return new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' });
    }
    quality -= 0.12;
  }
  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.35));
  return new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' });
}

/* ================= Firebase yapılandırması'''
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('db.js görsel yükleme fonksiyonu bulunamadı')
          p.write_text(s2, encoding='utf-8')

          p = Path('icerik-ekle.html')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace('.scroll-list{max-height:180px;overflow-y:auto;', '.scroll-list{max-height:430px;overflow-y:auto;')
          s2 = s2.replace('.konu-group-body{display:none;padding:0 12px 12px;max-height:180px;overflow-y:auto;', '.konu-group-body{display:none;padding:0 12px 12px;max-height:430px;overflow-y:auto;')
          if s2 == s:
              raise SystemExit('icerik-ekle görünür liste alanı bulunamadı')
          p.write_text(s2, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add db.js icerik-ekle.html
          git commit -m 'AUTO-CONTENT-FIX: fix image saving and show five content items'
          git rm .github/workflows/apply-content-fixes.yml
          git commit -m 'AUTO-CONTENT-FIX: remove temporary patch workflow'
          git push
