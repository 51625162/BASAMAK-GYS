name: Apply shared-note routing UI
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply routing patch
        run: python scripts/patch-share-routing.py
      - name: Commit patch if needed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icerik-ekle.html
          git diff --cached --quiet && exit 0
          git commit -m "[share-routing-bot] Route received notes to selected module"
          git push