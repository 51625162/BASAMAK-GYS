<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notlarım — Basamak GYS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10243E; --teal:#0E9E97; --teal-dark:#0B7F79; --amber:#F5A623;
    --coral:#FF6B5D; --violet:#8B6BF2; --red:#EF4444;
    --cloud:#F3F7F9; --white:#FFFFFF; --mist:#E1EAEE; --slate:#5B7186;
    --radius-lg:22px; --radius-md:16px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cloud);color:var(--ink);font-family:'Inter',system-ui,sans-serif;}
  h1,h2,h3{font-family:'Sora',sans-serif;letter-spacing:-0.01em;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}

  .topbar{padding:16px 6vw;background:var(--white);border-bottom:1px solid var(--mist);position:sticky;top:0;z-index:10;}
  .crumb{display:flex;align-items:center;gap:10px;font-size:0.86rem;color:var(--slate);font-weight:600;}
  .crumb .cur{color:var(--ink);}
  .crumb .sep{opacity:0.5;}

  .page-hero{max-width:820px;margin:0 auto;padding:30px 6vw 8px;display:flex;align-items:center;gap:16px;}
  .page-hero .icon{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,#94A3F5,#6C7FE8);display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:white;flex-shrink:0;}
  .page-hero h1{font-size:clamp(1.3rem,3vw,1.7rem);margin:0 0 4px;}
  .page-hero p{margin:0;color:var(--slate);font-size:0.88rem;}

  .wrap{max-width:820px;margin:0 auto;padding:20px 6vw 90px;}

  .add-card{background:var(--white);border:1px solid var(--mist);border-radius:var(--radius-lg);padding:20px;margin-bottom:24px;}
  textarea{width:100%;min-height:120px;padding:14px;border-radius:14px;border:1.5px solid var(--mist);font-size:0.95rem;font-family:inherit;background:var(--cloud);color:var(--ink);resize:vertical;}
  .tool-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center;}
  .mic-btn{padding:10px 16px;border-radius:100px;background:var(--cloud);border:1.5px solid var(--mist);font-weight:700;font-size:0.85rem;color:var(--ink);display:flex;align-items:center;gap:6px;}
  .mic-btn.recording{background:var(--red);color:white;border-color:var(--red);animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.6;}}
  .onem-row{display:flex;gap:8px;margin-top:14px;}
  .onem-chip{flex:1;padding:11px;border-radius:100px;border:1.5px solid var(--mist);font-weight:700;font-size:0.85rem;text-align:center;background:var(--white);}
  .onem-chip.active[data-val="onemli"]{background:var(--coral);border-color:var(--coral);color:white;}
  .onem-chip.active[data-val="normal"]{background:var(--teal);border-color:var(--teal);color:white;}
  .add-btn{width:100%;margin-top:14px;padding:14px;border-radius:100px;background:linear-gradient(135deg,var(--violet),#6C4FD6);color:white;font-weight:700;font-size:0.95rem;}
  .hint{font-size:0.78rem;color:var(--slate);margin-top:8px;}

  .note-card{background:var(--white);border:1.5px solid var(--mist);border-radius:16px;padding:16px 18px;margin-bottom:12px;position:relative;}
  .note-card.onemli{border-color:var(--coral);background:rgba(255,107,93,0.04);}
  .note-tag{display:inline-block;font-size:0.68rem;font-weight:800;padding:4px 10px;border-radius:100px;margin-bottom:8px;}
  .note-tag.onemli{background:rgba(255,107,93,0.15);color:var(--coral);}
  .note-tag.normal{background:rgba(14,158,151,0.12);color:var(--teal-dark);}
  .note-text{font-size:0.92rem;line-height:1.65;white-space:pre-line;color:var(--ink);}
  .note-actions{display:flex;gap:8px;margin-top:10px;}
  .note-btn{padding:7px 12px;border-radius:100px;font-size:0.75rem;font-weight:700;}
  .note-btn.del{background:rgba(239,68,68,0.1);color:#C0392B;}
  .note-btn.toggle{background:var(--cloud);color:var(--ink);}
  .empty-note{color:var(--slate);font-size:0.85rem;text-align:center;padding:40px 0;}
  .result-msg{display:none;margin-top:10px;padding:11px 14px;border-radius:12px;font-size:0.85rem;}
  .result-msg.ok{display:block;background:rgba(34,197,94,0.1);color:#16803C;}
  .result-msg.err{display:block;background:rgba(239,68,68,0.1);color:#C0392B;}
</style>
</head>
<body>

<div class="topbar">
  <div class="crumb">
    <a href="index.html">Basamak GYS</a><span class="sep">/</span>
    <a href="saymanlik.html" id="crumbModul">Saymanlık</a><span class="sep">/</span>
    <span class="cur">Notlarım</span>
  </div>
</div>

<section class="page-hero">
  <div class="icon">📔</div>
  <div>
    <h1>Notlarım</h1>
    <p>Kendi bağımsız not defterin — klavyeyle yaz, yapıştır ya da sesle söyle.</p>
  </div>
</section>

<div class="wrap">
  <div class="add-card">
    <textarea id="notMetin" placeholder="Buraya yaz, yapıştır (Ctrl+V) ya da mikrofonla sesli söyle..."></textarea>
    <div class="tool-row">
      <button class="mic-btn" id="micBtn">🎙️ Sesle Yaz</button>
      <span class="hint" id="micHint" style="margin:0;"></span>
    </div>
    <div class="onem-row">
      <button class="onem-chip active" data-val="normal">📝 Normal Not</button>
      <button class="onem-chip" data-val="onemli">⭐ Önemli Not</button>
    </div>
    <button class="add-btn" id="notEkleBtn">Notu Ekle</button>
    <div class="result-msg" id="notResult"></div>
  </div>

  <h3 style="font-size:1rem;margin-bottom:14px;">Tüm Notlarım</h3>
  <div id="notListesi"></div>
</div>

<script src="db.js?v=1786350782"></script>
<script>bgysRequireAuth();</script>
<script>
  function esc(v) { return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

  let seciliOnem = 'normal';
  document.querySelectorAll('.onem-chip').forEach(c => {
    c.addEventListener('click', () => {
      document.querySelectorAll('.onem-chip').forEach(x => x.classList.remove('active'));
      c.classList.add('active');
      seciliOnem = c.dataset.val;
    });
  });

  // ---- Sesle yazma (Web Speech API) ----
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let dinliyor = false;
  const micBtn = document.getElementById('micBtn');
  const micHint = document.getElementById('micHint');

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'tr-TR';
    recognition.continuous = true;
    recognition.interimResults = true;

    let finalMetin = '';
    recognition.addEventListener('start', () => {
      finalMetin = document.getElementById('notMetin').value;
      if (finalMetin && !finalMetin.endsWith(' ') && !finalMetin.endsWith('\n')) finalMetin += ' ';
    });
    recognition.addEventListener('result', (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) finalMetin += e.results[i][0].transcript + ' ';
        else interim += e.results[i][0].transcript;
      }
      document.getElementById('notMetin').value = finalMetin + interim;
    });
    recognition.addEventListener('end', () => {
      dinliyor = false;
      micBtn.classList.remove('recording');
      micBtn.textContent = '🎙️ Sesle Yaz';
    });
    recognition.addEventListener('error', (e) => {
      micHint.textContent = '⚠️ Ses tanıma hatası: ' + e.error;
    });

    micBtn.addEventListener('click', () => {
      if (dinliyor) {
        recognition.stop();
      } else {
        try {
          recognition.start();
          dinliyor = true;
          micBtn.classList.add('recording');
          micBtn.textContent = '⏹️ Durdur';
          micHint.textContent = 'Dinleniyor, konuşabilirsin...';
        } catch (e) {
          micHint.textContent = '⚠️ Başlatılamadı: ' + e.message;
        }
      }
    });
  } else {
    micBtn.disabled = true;
    micBtn.style.opacity = '0.5';
    micHint.textContent = 'Bu tarayıcı sesli yazmayı desteklemiyor (Chrome önerilir).';
  }

  function showMsg(id, cls, text) {
    const el = document.getElementById(id);
    el.className = 'result-msg ' + cls;
    el.textContent = text;
  }

  document.getElementById('notEkleBtn').addEventListener('click', async () => {
    const metin = document.getElementById('notMetin').value.trim();
    if (!metin) { showMsg('notResult', 'err', 'Not boş olamaz.'); return; }
    if (dinliyor) recognition.stop();
    try {
      await bgysAdd('notlarim', { modul: bgysCurrentModul(), metin, onem: seciliOnem });
      showMsg('notResult', 'ok', 'Not eklendi.');
      document.getElementById('notMetin').value = '';
      renderNotlar();
    } catch (e) {
      showMsg('notResult', 'err', 'Hata: ' + e.message);
    }
  });

  async function renderNotlar() {
    const items = await bgysGetAllByModul('notlarim');
    const el = document.getElementById('notListesi');
    if (items.length === 0) { el.innerHTML = '<div class="empty-note">Henüz bir not eklemedin. Yukarıdan ilk notunu ekleyebilirsin.</div>'; return; }
    // Onemli notlar once, sonra tarihe gore yeniden eskiye
    const sirali = items.slice().sort((a, b) => {
      if (a.onem !== b.onem) return a.onem === 'onemli' ? -1 : 1;
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
    el.innerHTML = sirali.map(it => `
      <div class="note-card ${it.onem === 'onemli' ? 'onemli' : ''}">
        <span class="note-tag ${it.onem === 'onemli' ? 'onemli' : 'normal'}">${it.onem === 'onemli' ? '⭐ Önemli' : '📝 Normal'}</span>
        <div class="note-text">${esc(it.metin)}</div>
        <div class="note-actions">
          <button class="note-btn toggle" onclick="notOnemDegistir('${it.id}', '${it.onem === 'onemli' ? 'normal' : 'onemli'}')">${it.onem === 'onemli' ? '📝 Normal Yap' : '⭐ Önemli Yap'}</button>
          <button class="note-btn del" onclick="notSil('${it.id}')">🗑️ Sil</button>
        </div>
      </div>
    `).join('');
  }

  window.notOnemDegistir = async (id, yeniOnem) => {
    await bgysInitFirebase();
    await bgysUserCollection('notlarim').doc(String(id)).update({ onem: yeniOnem });
    renderNotlar();
  };
  window.notSil = async (id) => {
    if (!confirm('Bu not silinsin mi?')) return;
    await bgysDelete('notlarim', id);
    renderNotlar();
  };

  const modulInfo = bgysModulInfo();
  document.getElementById('crumbModul').textContent = modulInfo.ad;
  document.getElementById('crumbModul').setAttribute('href', modulInfo.sayfa);
  document.title = `Notlarım — ${modulInfo.ad} — Basamak GYS`;

  renderNotlar();
  bgysAutoRefresh(renderNotlar);
</script>

</body>
</html>
